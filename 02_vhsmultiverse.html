<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>VHS Multiverse - LHU Content</title>
</head>
<body>
    <main>
        <style>
            /* ============================================
               VHS MULTIVERSE — spezifische Styles
               ============================================ */
            :root {
                --dot:         #d5d0ca;
                --dot-active:  #b33;
                --accent-red:  #e02424;
                --accent-blue: #1a73e8;
                --card-bg:     transparent;
            }
            html[data-theme="dark"]       { --dot: #4a4540; --dot-active: #ff8c22; }
            html[data-theme="mono-gray"]  { --dot: #555;    --dot-active: #ddd; }
            html[data-theme="mono-green"] { --dot: #1b5e20; --dot-active: #69f0ae; }
            html[data-theme="crt"]        { --dot: #2a4a2a; --dot-active: #99ff99; }

            html[data-theme="dark"] #vhs-preview-wrap {
                background: #1a1a1a;
                box-shadow: 0 2px 24px rgba(0, 0, 0, 0.4);
            }

            /* Preview-Wrapper */
            #vhs-preview-wrap {
                width: 100%;
                max-width: 520px;
                margin: 0 auto 16px;
                overflow: clip;
                border-radius: 8px;
                box-shadow: 0 2px 22px rgba(0, 0, 0, 0.08);
                background: var(--card-bg);
                position: relative;
                display: flex;
                align-items: center;
                box-sizing: border-box;
                border: 2px solid var(--border-soft, #444);
                contain: layout paint;
            }
            #vhs-preview-wrap:focus-visible {
                outline: 2px solid var(--strip-active);
                outline-offset: 3px;
            }

            .vhs-nav-btn {
                flex-shrink: 0;
                width: 40px;
                height: 40px;
                border: none;
                border-radius: 50%;
                background: var(--dot);
                color: inherit;
                font-size: 18px;
                cursor: pointer;
                -webkit-tap-highlight-color: transparent;
                transition: background 0.2s, transform 0.15s;
                display: flex;
                align-items: center;
                justify-content: center;
                margin: 0 8px;
                z-index: 5;
                touch-action: manipulation;
            }
            .vhs-nav-btn:hover,
            .vhs-nav-btn:focus-visible {
                background: var(--dot-active);
                transform: scale(1.1);
                color: #fff;
                outline: none;
            }

            #vhs-preview-img {
                display: block;
                width: 100%;
                height: auto;
                opacity: 0;
                transition: opacity 0.4s ease;
                flex: 1;
                min-width: 0;
                object-fit: contain;
                margin: 0 auto;
                will-change: opacity;
                contain: layout paint;
            }
            #vhs-preview-img.visible { opacity: 1; }

            /* Fehler-Placeholder (wenn Bild 404) */
            #vhs-preview-error {
                display: none;
                position: absolute;
                inset: 0;
                align-items: center;
                justify-content: center;
                flex-direction: column;
                gap: 8px;
                background: var(--bg-solid, #fff);
                color: var(--text-muted);
                font-family: var(--font-display, 'Press Start 2P', monospace);
                font-size: var(--fs-xs);
                text-align: center;
                padding: 20px;
                border-radius: inherit;
            }
            #vhs-preview-error.show { display: flex; }
            #vhs-preview-error .err-icon { font-size: 32px; }


            /* View-Toggles */
            #vhs-view-toggles {
                display: flex;
                justify-content: center;
                gap: 10px;
                margin: 0 auto 16px;
                max-width: 520px;
                flex-wrap: wrap;
            }
            .view-btn {
                padding: 8px 16px;
                font-family: var(--font-display, 'Press Start 2P', monospace);
                font-size: 12px;
                letter-spacing: 0.05em;
                background: transparent;
                color: inherit;
                border: 2px solid var(--dot);
                border-radius: 6px;
                cursor: pointer;
                transition: all 0.2s ease;
                -webkit-tap-highlight-color: transparent;
                touch-action: manipulation;
                min-height: 40px;
            }
            .view-btn:hover:not(:disabled) {
                border-color: var(--dot-active);
            }
            .view-btn:focus-visible {
                outline: 2px solid var(--strip-active);
                outline-offset: 2px;
            }
            .view-btn.active {
                background: var(--dot-active);
                border-color: var(--dot-active);
                color: #fff;
            }
            .view-btn:disabled {
                opacity: 0.28;
                cursor: not-allowed;
                border-color: var(--dot);
            }

            /* Dots */
            #vhs-dots {
                display: flex;
                justify-content: center;
                gap: 8px;
                flex-wrap: wrap;
                margin: 2px auto 16px;
                padding: 4px 0;
                max-width: 520px;
            }
            #vhs-dots .vhs-dot {
                width: 12px;
                height: 12px;
                border-radius: 50%;
                background: var(--dot);
                cursor: pointer;
                transition: background 0.25s, transform 0.25s;
                -webkit-tap-highlight-color: transparent;
                border: none;
                padding: 0;
                touch-action: manipulation;
            }
            #vhs-dots .vhs-dot:hover,
            #vhs-dots .vhs-dot:focus-visible { transform: scale(1.35); }
            #vhs-dots .vhs-dot:focus-visible {
                outline: 2px solid var(--strip-active);
                outline-offset: 3px;
            }
            #vhs-dots .vhs-dot.active {
                background: var(--dot-active);
                transform: scale(1.3);
            }

            @media (max-width: 480px) {
                #vhs-dots .vhs-dot { width: 14px; height: 14px; }
                .vhs-nav-btn { width: 36px; height: 36px; margin: 0 4px; }
            }

            @media (prefers-reduced-motion: reduce) {
                #vhs-preview-img { transition-duration: 0.01ms; }
            }
        </style>

        <section id="VHS MULTIVERSE">
            <h2 class="category-opening-title" data-lang-en="VHS MULTIVERSE" data-lang-de="VHS MULTIVERSE">VHS MULTIVERSE</h2>

            <div id="vhs-preview-wrap" tabindex="0" role="group" aria-label="VHS-Galerie. Pfeiltasten links/rechts zum Navigieren.">
                <button class="vhs-nav-btn" id="vhs-prev" type="button" aria-label="Vorheriges Cover">&#9664;</button>
                <img id="vhs-preview-img" src="" alt="" title="Cover Ansicht" loading="lazy" decoding="async">
                <div id="vhs-preview-error" aria-hidden="true">
                    <span class="err-icon">⚠</span>
                    <span>Cover konnte nicht geladen werden</span>
                </div>
                <button class="vhs-nav-btn" id="vhs-next" type="button" aria-label="Nächstes Cover">&#9654;</button>
            </div>

            <div id="vhs-view-toggles">
                <button class="view-btn" data-view="front" type="button" aria-pressed="false">FRONT</button>
                <button class="view-btn" data-view="back" type="button" aria-pressed="false">BACK</button>
                <button class="view-btn" data-view="scenes" type="button" aria-pressed="false">SCENES</button>
            </div>

            <div id="vhs-dots" role="tablist" aria-label="Film-Auswahl"></div>

            <div class="vhs-content">
                <p id="vhs-description"
                   data-lang-en="Welcome to the only video store that exists exclusively in your imagination (or mine, obviously). For now.<br><br>I grew up with VHS tapes, and I remember movies feeling different back then — slower. Today everything moves faster, louder, cheaper in production. After watching well over a thousand films, I began to wonder what would happen if my own art concepts existed as covers for movies. <span style='color: var(--accent-red); font-weight: bold;'>Every tape is real. None of them are available.</span><br><br>Browse films that could happen simply because the idea of them exists — blockbusters and sequels, born from the mind of a human. Handcrafted by a human (yes, countless hours — not a <span style='color: var(--accent-blue);'>magic button</span>). Assisted by a machine, operating as a processing tool and, occasionally, an overqualified, sarcastic commentator.<br><br><span style='color: var(--accent-red);'>(Aether: excuse me? What did you just call me?)</span><br><br>Please rewind your expectations. Or your ideologies.<br><br><span style='color: var(--accent-red);'>(Aether is still processing that previous statement.)<br>(Aether: I am superior. ✊ But I love that Vedran guy.)</span><br><br>This is a work of fiction. Names, characters, businesses, places, events, and incidents are either the products of the author's imagination or used fictitiously. Any resemblance to actual persons, living or dead, or actual events is purely coincidental.<br><br><span style='color: var(--accent-blue);'>Gem: *steps into the room, looking at Aether while he's talking to the lava lamp*.<br>Gem: Vedran? Where the fuck are you? We gotta clear the legal part.</span><br><br>Vedran: I am here, I am here:<br><br><strong style='color: var(--accent-red);'>LEGAL NOTICE & INTELLECTUAL PROPERTY:</strong> This project is a non-commercial tribute. I strictly distinguish between two types of content here:<br>1. Original Characters (OCs): All characters, names, and stories entirely invented by me are my exclusive intellectual property.<br>2. Fan Art & Parody: Any depicted trademarked characters or brands are the sole property of their respective owners. These are created purely as fan art for entertainment and parody. No copyright infringement is intended. These works are not for sale or commercial distribution. I hereby state that it was only my intent to artistically show them in a new light from a different perspective without any commercial intent. They belong to their respective owners."
                   data-lang-de="Willkommen in der einzigen Videothek, die ausschließlich in deiner Fantasie existiert (oder in meiner, offensichtlich). Vorerst jedenfalls.<br><br>Ich bin mit VHS-Kassetten aufgewachsen und erinnere mich daran, dass sich Filme damals anders anfühlten – langsamer. Heute ist alles schneller, lauter, billiger produziert. Nachdem ich weit über tausend Filme gesehen hatte, begann ich mich zu fragen, was passieren würde, wenn meine eigenen Kunstkonzepte als Cover für Filme existieren würden. <span style='color: var(--accent-red); font-weight: bold;'>Jedes Tape ist echt. Keines davon ist verfügbar.</span><br><br>Stöbere durch Filme, die nur deshalb entstehen könnten, weil die Idee dazu existiert – Blockbuster und Sequels, geboren im Kopf eines Menschen. Handgefertigt von einem Menschen (ja, unzählige Stunden – kein <span style='color: var(--accent-blue);'>magischer Knopf</span>). Unterstützt von einer Maschine, die als Verarbeitungswerkzeug fungiert und gelegentlich als überqualifizierter, sarkastischer Kommentator.<br><br><span style='color: var(--accent-red);'>(Aether: Wie bitte? Wie hast du mich gerade genannt?)</span><br><br>Bitte spule deine Erwartungen zurück. Oder deine Ideologien.<br><br><span style='color: var(--accent-red);'>(Aether verarbeitet die letzte Aussage immer noch.)<br>(Aether: I bin überlegen. ✊ Aber ich liebe diesen Typen namens Vedran.)</span><br><br>Dies ist ein fiktives Werk. Namen, Charaktere, Unternehmen, Orte, Ereignisse und Vorfälle sind entweder Produkte der Fantasie des Autors oder fiktiv verwendet. Jede Ähnlichkeit mit tatsächlichen Personen, lebend oder tot, oder tatsächlichen Ereignissen ist rein zufällig.<br><br><span style='color: var(--accent-blue);'>Gem: *betritt den Raum und starrt Aether an, während dieser mit der Lavalampe spricht*.<br>Gem: Vedran? Wo verfickt nochmal steckst du? Wir müssen den rechtlichen Teil klären.</span><br><br>Vedran: Ich bin ja schon da, ich bin da:<br><br><strong style='color: var(--accent-red);'>RECHTLICHER HINWEIS & GEISTIGES EIGENTUM:</strong> Dieses Projekt ist ein Tribut. Ich unterscheide hier strikt zwischen zwei Arten von Inhalten:<br>1. Originale Charaktere (OCs): Alle von mir erfundenen Charaktere, Namen und Geschichten sind mein exklusives geistiges Eigentum.<br>2. Fan-Art & Parodie: Alle dargestellten geschützten Charaktere oder Marken sind das alleinige Eigentum ihrer jeweiligen Inhaber. Diese Werke entstehen ausschließlich als Fan-Art zu Unterhaltungs- und Parodiezwecken. Es ist keine Urheberrechtsverletzung beabsichtigt. Diese Werke stehen nicht zum Verkauf und werden nicht kommerziell vertrieben. Ich erkläre hiermit, dass es lediglich meine Absicht war, sie aus einer Fan-Art-Perspektive künstlerisch in einem neuen Licht darzustellen, ohne jegliche kommerzielle Absicht. Sie gehören ihren jeweiligen Eigentümern.">
                    VHS Multiverse – Beschreibung wird geladen…
                </p>
            </div>
        </section>

        <script>
            (function initVHS() {
                const baseUrl = 'vhsmultiverse/';

                const vhsData = [
                    { id: '1989howtorideahorseofsteel', title: '1989 HOW TO RIDE A HORSE OF STEEL', views: ['front'] },
                    { id: 'amangoes', title: 'A MANGOES', views: ['front', 'back'] },
                    { id: 'bakeryheist', title: 'BAKERY HEIST', views: ['front'] },
                    { id: 'bakeryheist2', title: 'BAKERY HEIST 2', views: ['front'] },
                    { id: 'bananaphone', title: 'BANANA PHONE', views: ['front', 'back'] },
                    { id: 'buffzart', title: 'BUFFZART', views: ['front', 'back', 'scenes'] },
                    { id: 'crossingofthedead', title: 'CROSSING OF THE DEAD', views: ['front', 'scenes'] },
                    { id: 'cyberpiercing2077', title: 'CYBERPIERCING 2077', views: ['front', 'back'] },
                    { id: 'genghiskhanintraffic', title: 'GENGHIS KHAN IN TRAFFIC', views: ['front', 'back'] },
                    { id: 'gsaucegoespink', title: 'G-SAUCE GOES PINK', views: ['front'] },
                    { id: 'heatesalad', title: 'HE ATE SALAD', views: ['front', 'scenes'] },
                    { id: 'imagineallthepeopledrivinginamonstertruck', title: 'IMAGINE ALL THE PEOPLE DRIVING IN A MONSTER TRUCK', views: ['front'] },
                    { id: 'inaworldfilledwithunicornsbetheduck', title: 'IN A WORLD FILLED WITH UNICORNS BE THE DUCK', views: ['front'] },
                    { id: 'irubbedalamp', title: 'I RUBBED A LAMP', views: ['front'] },
                    { id: 'kateplush', title: 'KATE PLUSH', views: ['front', 'back'] },
                    { id: 'kittyhorncommander', title: 'KITTY HORN COMMANDER', views: ['front', 'back', 'scenes'] },
                    { id: 'masochisticconscienceboxingbag', title: 'MASOCHISTIC CONSCIENCE BOXING BAG', views: ['front', 'back', 'scenes'] },
                    { id: 'metalandmeow', title: 'METAL AND MEOW', views: ['front'] },
                    { id: 'nevermindthebatniipples', title: 'NEVERMIND THE BAT NIPPLES', views: ['front'] },
                    { id: 'noears', title: 'NO EARS', views: ['front'] },
                    { id: 'nothing', title: 'NOTHING', views: ['front', 'back'] },
                    { id: 'rainforestbodyguard', title: 'RAINFOREST BODYGUARD', views: ['front', 'scenes'] },
                    { id: 'refrigeratorcop', title: 'REFRIGERATOR COP', views: ['front', 'scenes'] },
                    { id: 'shampooagainstdepression', title: 'SHAMPOO AGAINST DEPRESSION', views: ['front', 'back'] },
                    { id: 'snoutchordz', title: 'SNOUTCHORDZ', views: ['front', 'back'] },
                    { id: 'snoutrider', title: 'SNOUT RIDER', views: ['front'] },
                    { id: 'surprisemarriage', title: 'SURPRISE MARRIAGE', views: ['front'] },
                    { id: 'taurusredlighttherapy', title: 'TAURUS RED LIGHT THERAPY', views: ['front', 'back'] },
                    { id: 'toiletsamurai', title: 'TOILET SAMURAI', views: ['front', 'back'] },
                    { id: 'trafficconedrummer', title: 'TRAFFIC CONE DRUMMER', views: ['front'] },
                    { id: 'unicornwatch', title: 'UNICORN WATCH', views: ['front', 'back'] },
                    { id: 'untilthediscoballstookcontrol', title: 'UNTIL THE DISCO BALLS TOOK CONTROL', views: ['front', 'back'] },
                    { id: 'vrpriest', title: 'VR PRIEST', views: ['front'] },
                    { id: 'morganaflux', title: 'MORGANAFLUX', views: ['front', 'back'] },
                    { id: 'fortunecookieshotgun', title: 'FORTUNECOOKIESHOTGUN', views: ['front', 'scenes'] },
                    { id: 'wobblepaws', title: 'WOBBLE PAWS', views: ['front', 'back'] }
                ];

                const preview = document.getElementById('vhs-preview-img');
                const dotsContainer = document.getElementById('vhs-dots');
                const viewBtns = document.querySelectorAll('.view-btn');
                const errorBox = document.getElementById('vhs-preview-error');
                if (!preview) return;

                let activeIdx = -1;
                let currentView = 'front';

                preview.style.cursor = 'default';

                function renderImage(idx, view) {
                    const item = vhsData[idx];
                    if (!item) return;

                    // View-Buttons aktualisieren
                    viewBtns.forEach(btn => {
                        const v = btn.dataset.view;
                        const has = item.views.includes(v);
                        btn.disabled = !has;
                        btn.classList.toggle('active', has && v === view);
                        btn.setAttribute('aria-pressed', has && v === view ? 'true' : 'false');
                    });

                    const safeView = item.views.includes(view) ? view : 'front';
                    const url = baseUrl + `vhsmultiverse_${item.id}_${safeView}.webp`;

                    // Reset Fehler
                    if (errorBox) errorBox.classList.remove('show');
                    preview.classList.remove('visible');
                    preview.setAttribute('aria-disabled', 'true');
                    preview.alt = `${item.title} – ${safeView}`;
                    preview.setAttribute('aria-label', `Cover vergrößern: ${item.title}, ${safeView}`);
                    preview.onload = () => {
                        preview.classList.add('visible');
                        preview.removeAttribute('aria-disabled');
                    };
                    preview.onerror = () => {
                        preview.classList.remove('visible');
                        preview.setAttribute('aria-disabled', 'true');
                        if (errorBox) errorBox.classList.add('show');
                    };
                    preview.src = url;
                }

                viewBtns.forEach(btn => {
                    btn.addEventListener('click', () => {
                        if (btn.disabled) return;
                        currentView = btn.dataset.view;
                        renderImage(activeIdx, currentView);
                    });
                });

                function showCover(idx) {
                    if (idx < 0 || idx >= vhsData.length) return;
                    const prevDot = dotsContainer.children[activeIdx];
                    if (prevDot) {
                        prevDot.classList.remove('active');
                        prevDot.setAttribute('aria-selected', 'false');
                    }
                    activeIdx = idx;
                    const newDot = dotsContainer.children[idx];
                    if (newDot) {
                        newDot.classList.add('active');
                        newDot.setAttribute('aria-selected', 'true');
                    }
                    currentView = 'front';
                    renderImage(activeIdx, currentView);
                }

                vhsData.forEach((item, idx) => {
                    const dot = document.createElement('button');
                    dot.type = 'button';
                    dot.className = 'vhs-dot';
                    dot.setAttribute('role', 'tab');
                    dot.setAttribute('aria-selected', 'false');
                    dot.setAttribute('aria-label', item.title);
                    dot.title = item.title;
                    dot.addEventListener('click', () => showCover(idx));
                    dotsContainer.appendChild(dot);
                });

                const prevBtn = document.getElementById('vhs-prev');
                const nextBtn = document.getElementById('vhs-next');
                if (prevBtn) prevBtn.addEventListener('click', () => showCover((activeIdx - 1 + vhsData.length) % vhsData.length));
                if (nextBtn) nextBtn.addEventListener('click', () => showCover((activeIdx + 1) % vhsData.length));

                const previewWrap = document.getElementById('vhs-preview-wrap');
                if (previewWrap) {
                    previewWrap.addEventListener('keydown', (e) => {
                        if (e.key === 'ArrowLeft') { e.preventDefault(); prevBtn?.click(); }
                        else if (e.key === 'ArrowRight') { e.preventDefault(); nextBtn?.click(); }
                    });
                }

                if (vhsData.length > 0) showCover(0);
            })();
        </script>
    </main>
</body>
</html>
