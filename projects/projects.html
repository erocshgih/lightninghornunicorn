<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROJECTS – Test</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
        /* ========== DESIGN TOKENS (from main page light theme) ========== */
        :root {
            --bg: transparent;
            --bg-solid: #f5f3f0;
            --text: #111111;
            --text-muted: #555555;
            --text-soft: #888888;
            --header-bg: #f5f3f0;
            --strip-text: #4a2c00;
            --strip-active: #ff7a00;
            --border-soft: #e0ddd8;
            --card-bg: #ffffff;
            --accent-green: #00ff28;
            --accent-red: #ff2800;
            --dot: #d5d0ca;
            --dot-active: #b33;
            --radius: 10px;
            --space-section: clamp(16px, 4.5vw, 40px);
            --fs-xs: clamp(0.42rem, 1.3vw + 0.2rem, 0.55rem);
            --fs-sm: clamp(0.48rem, 1.5vw + 0.22rem, 0.65rem);
            --fs-base: clamp(0.52rem, 1.7vw + 0.25rem, 0.72rem);
            --fs-md: clamp(0.62rem, 2.0vw + 0.28rem, 0.85rem);
            --fs-lg: clamp(0.72rem, 2.6vw + 0.3rem, 1.1rem);
        }

        /* ========== RESET ========== */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

        body {
            background: var(--bg-solid);
            font-family: 'VT323', monospace;
            color: var(--text);
            font-size: 18px;
            line-height: 2.4;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ========== MAIN CONTAINER ========== */
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 24px auto;
            padding: 0;
            width: min(90vw, 540px);
        }

        /* ========== H1 / PAGE TITLE ========== */
        h1 {
            font-family: 'Press Start 2P', cursive;
            font-size: var(--fs-lg);
            color: var(--text);
            text-align: center;
            margin: 0 auto 1.2em;
            letter-spacing: 0.05em;
            text-shadow:
                1px 0 rgba(255, 0, 0, 0.45),
                -1px 0 rgba(0, 255, 255, 0.45),
                0 0 2px rgba(255, 255, 255, 0.35);
            filter: contrast(1.06);
        }

        .subtitle {
            text-align: center;
            color: var(--text-soft);
            font-size: var(--fs-sm);
            margin-bottom: 30px;
            line-height: 2.4;
        }

        /* ========== CATEGORY ACCORDION ========== */
        .cat-item {
            border: 2px solid var(--border-soft);
            border-radius: var(--radius);
            margin-bottom: 10px;
            overflow: hidden;
            background: var(--card-bg);
            transition: border-color 0.3s, box-shadow 0.3s;
            width: 100%;
        }

        .cat-item.open {
            border-color: var(--strip-active);
            box-shadow: 0 0 12px rgba(255, 154, 60, 0.08);
        }

        .cat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.2s;
        }

        .cat-header:hover {
            background: rgba(255, 154, 60, 0.04);
        }

        .cat-header .cat-label {
            font-family: 'Press Start 2P', cursive;
            font-size: var(--fs-xs);
            color: var(--strip-active);
            letter-spacing: 0.1em;
        }

        .cat-header .arrow {
            font-size: 14px;
            color: var(--strip-active);
            transition: transform 0.3s ease;
            margin-left: 10px;
        }

        .cat-item.open > .cat-header .arrow {
            transform: rotate(90deg);
        }

        .cat-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease;
        }

        .cat-item.open > .cat-body {
            max-height: 2000px;
        }

        /* ========== PRODUCT ACCORDION ========== */
        .prod-item {
            border-top: 1px solid var(--border-soft);
        }

        .prod-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.2s;
        }

        .prod-header:hover {
            background: rgba(255, 154, 60, 0.03);
        }

        .prod-header .prod-name {
            font-family: 'Press Start 2P', cursive;
            font-size: var(--fs-xs);
            color: var(--text-muted);
            letter-spacing: 0.05em;
        }

        .prod-header .prod-arrow {
            font-size: 12px;
            color: var(--strip-active);
            transition: transform 0.3s ease;
            margin-left: 10px;
        }

        .prod-item.open > .prod-header .prod-arrow {
            transform: rotate(90deg);
        }

        .prod-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease;
        }

        .prod-item.open > .prod-body {
            max-height: 1600px;
        }

        .prod-body-inner {
            padding: 0 16px 18px;
        }

        /* ========== PRODUCT DESCRIPTION ========== */
        .prod-desc {
            font-family: 'VT323', monospace;
            font-size: 16px;
            color: var(--text-muted);
            line-height: 2;
            margin-bottom: 16px;
            text-align: left;
            white-space: pre-line;
        }

        .prod-desc strong {
            color: var(--text);
            font-family: 'Press Start 2P', cursive;
            font-size: var(--fs-xs);
            display: block;
            margin-bottom: 8px;
            letter-spacing: 0.05em;
        }

        /* ========== GO BACK ========== */
        .go-back {
            display: block;
            font-family: 'Press Start 2P', cursive;
            font-size: var(--fs-xs);
            color: var(--text-muted);
            text-decoration: none;
            text-align: center;
            margin-top: 30px;
            padding: 12px 20px;
            border: 2px solid var(--border-soft);
            border-radius: var(--radius);
            background: var(--card-bg);
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .go-back:hover {
            background: var(--strip-active);
            color: #111;
            border-color: var(--strip-active);
        }

        /* ========== IMAGE STAGE ========== */
        .carousel-stage {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            border-radius: var(--radius);
            overflow: hidden;
            background: var(--bg-solid);
            margin-bottom: 10px;
            box-shadow: 0 3px 14px rgba(0, 0, 0, 0.06);
        }

        .carousel-slide {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.35s ease;
            pointer-events: none;
        }

        .carousel-slide.active {
            opacity: 1;
            pointer-events: auto;
        }

        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* ========== NAV ARROWS ========== */
        .carousel-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 8px;
        }

        .carousel-btn {
            width: 36px;
            height: 36px;
            border: 2px solid var(--border-soft);
            border-radius: 50%;
            background: var(--card-bg);
            color: var(--text-soft);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .carousel-btn:hover {
            background: var(--strip-active);
            border-color: var(--strip-active);
            color: #111;
            transform: scale(1.1);
        }

        /* ========== DOTS ========== */
        .carousel-dots {
            display: flex;
            justify-content: center;
            gap: 7px;
            flex-wrap: wrap;
        }

        .carousel-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--dot);
            cursor: pointer;
            transition: background 0.25s, transform 0.25s;
            -webkit-tap-highlight-color: transparent;
        }

        .carousel-dot:hover {
            transform: scale(1.4);
        }

        .carousel-dot.active {
            background: var(--dot-active);
            transform: scale(1.3);
        }

    </style>
</head>
<body>
    <main>
        <h1>PROJECTS</h1>
        <p class="subtitle">Mechanical prototypes, 3D designs &amp; physical concepts</p>

        <a href="../LightningHornUnicorn.html" class="go-back">&#9664; GO BACK</a>

        <div id="projects-accordion"></div>
    </main>

    <script>
    document.addEventListener('DOMContentLoaded', () => {

        const projects = [
            {
                cat: 'GLASSES',
                products: [
                    { name: 'DUCKPARADA: THUNDERBOLT', desc: `Inspired by Bauhaus, aircraft carriers, ducks, and Japanese superheroes, Thunderbolt 1 was born after over two years of development and more than 30 self-made drafts in Blender 3D.

A modular glasses structure with optical lenses and genuine everyday utility.

The idea was simple: Grab the lightning from the sky and wear it as eyewear.

Zeus: Who the fuck stole my glasses?
Narrator: For risks and side effects, bargain with feta cheese.`, images: [
                        { src: 'projects_glasses_duckparada_thunderbolt1vedran.webp' },
                        { src: 'projects_glasses_duckparada_thunderbolt2package.webp' },
                        { src: 'projects_glasses_duckparada_thunderbolt3comic.webp' },
                        { src: 'projects_glasses_duckparada_thunderbolt4squat.webp' },
                    ]}
                ]
            },
            {
                cat: 'HELMET',
                products: [
                    { name: 'DUCKPARADA: DUCKLIGHT', desc: `Began as a decorative duck from a flea market. After removing the plastic bottom, it was defined as headgear.

This resulted in the first unlicensed Duckparada helmet.

Ultralight, striking, and completely uncontrollable. A prototype and proof that good ideas sometimes show up when your mind is open for illegal usage of all day objects.`, images: [
                        { src: 'projects_helmet_duckparada_ducklight_package1.webp' },
                        { src: 'projects_helmet_duckparada_mark123comic.webp' },
                        { src: 'projects_helmet_duckparada_mark12goldmine.webp' },
                    ]}
                ]
            },
            {
                cat: 'RINGS',
                products: [
                    { name: 'TURN ME ON RING', desc: `One ring to give them all… emotional confusion.

Built around a grotesque sculptural form with a tongue, staring eyes, tail, and a small mechanical-looking button marked "ON".

At the top sits a simple message:

LOVE ME.
LOVE. ME.
YES WE CAN.

Part wearable object, part miniature character. Lickable? …rusty and risk-obvious.

A ring with no purpose.
Except perhaps turning something on.`, images: [
                        { src: 'projects_rings_turnmeonring_1package.webp' },
                        { src: 'projects_rings_turnmeonring_2comic.webp' },
                        { src: 'projects_rings_turnmeonring_3ad.webp' },
                    ]}
                ]
            },
            {
                cat: 'FIGURINE',
                products: [
                    { name: 'BERTA', desc: `Berta was developed for a future in which vegetables became necessary weapons.

A pink goat equipped with two of the juiciest hi-tek cucumbers… in Dolby surround ASMR. Maybe.

After the battle, there is only one thing left to do:

Eat your weapons, Berta.`, images: [
                        { src: 'projects_figurine_berta1package.webp' },
                        { src: 'projects_figurine_berta2figurine.webp' },
                        { src: 'projects_figurine_berta3drawing.webp' },
                        { src: 'projects_figurine_berta4newspaper.webp' },
                    ]},
                    { name: 'DUDDHA', desc: `Duddha was created. Yes.

A sculptural duck combining Buddhist bullshitery, retro science fiction, and the unmistakable attitude of… flipping the bird.

He's obese. He may eat your last pretzel from your lunchbox.

Enlightenment is just Tron throwing up in a meditation room.

This whole package is the most disrespectful, glorious, motherfuckin' spiritual awakening you've ever seen. You don't meditate with this thing — you put it on your desk, stare at it, and suddenly every corporate meeting, every traffic jam, every "live laugh love" sign in the world just feels a little more… fuckable.

Forget the red pill. Forget the blue pill. He ate both of 'em and now we're stuck here while he waves his hands, politely asking for the next sandwich.`, images: [
                        { src: 'projects_figurine_duddha1package.webp' },
                        { src: 'projects_figurine_duddha2figurine.webp' },
                    ]}
                ]
            },
            {
                cat: 'ACCESSOIRE',
                products: [
                    { name: 'NOT PLUG', desc: `Designed as a playful attachment for headphones, the glossy black cat ears transform an ordinary pair into something less ordinary. *slurp*

Inspired by the strange intersection of consumer electronics, fashion, cosplay, and the approval of your local OnlyFans artist.

Easy to attach. Explanations are discussable.`, images: [
                        { src: 'projects_accessoire_notplug1package.webp' },
                        { src: 'projects_accessoire_notplug2comic.webp' },
                    ]}
                ]
            }
        ];

        const accordion = document.getElementById('projects-accordion');
        let gIdx = 0;
        const state = {};

        projects.forEach((group) => {
            const catEl = document.createElement('div');
            catEl.className = 'cat-item';

            const catHeader = document.createElement('div');
            catHeader.className = 'cat-header';
            catHeader.innerHTML = `
                <span class="cat-label">${group.cat}</span>
                <span class="arrow">&#9654;</span>
            `;
            catHeader.addEventListener('click', () => toggleCat(catEl));
            catEl.appendChild(catHeader);

            const catBody = document.createElement('div');
            catBody.className = 'cat-body';

            group.products.forEach((prod) => {
                const prodEl = document.createElement('div');
                prodEl.className = 'prod-item';

                const prodHeader = document.createElement('div');
                prodHeader.className = 'prod-header';
                prodHeader.innerHTML = `
                    <span class="prod-name">${prod.name}</span>
                    <span class="prod-arrow">&#9654;</span>
                `;
                const thisGIdx = gIdx;
                prodHeader.addEventListener('click', () => toggleProd(prodEl));
                prodEl.appendChild(prodHeader);

                const prodBody = document.createElement('div');
                prodBody.className = 'prod-body';

                const inner = document.createElement('div');
                inner.className = 'prod-body-inner';

                const stage = document.createElement('div');
                stage.className = 'carousel-stage';
                stage.setAttribute('data-gidx', gIdx);

                prod.images.forEach((img, i) => {
                    const slide = document.createElement('div');
                    slide.className = 'carousel-slide' + (i === 0 ? ' active' : '');
                    slide.innerHTML = `<img src="${img.src}" loading="lazy">`;
                    stage.appendChild(slide);
                });
                inner.appendChild(stage);

                const nav = document.createElement('div');
                nav.className = 'carousel-nav';

                const prevBtn = document.createElement('button');
                prevBtn.className = 'carousel-btn';
                prevBtn.innerHTML = '&#9664;';
                prevBtn.addEventListener('click', (e) => { e.stopPropagation(); navigate(thisGIdx, -1); });

                const nextBtn = document.createElement('button');
                nextBtn.className = 'carousel-btn';
                nextBtn.innerHTML = '&#9654;';
                nextBtn.addEventListener('click', (e) => { e.stopPropagation(); navigate(thisGIdx, 1); });

                nav.appendChild(prevBtn);
                nav.appendChild(nextBtn);
                inner.appendChild(nav);

                const dots = document.createElement('div');
                dots.className = 'carousel-dots';
                dots.id = 'dots-' + gIdx;

                prod.images.forEach((_, i) => {
                    const dot = document.createElement('span');
                    dot.className = 'carousel-dot' + (i === 0 ? ' active' : '');
                    const di = gIdx;
                    dot.addEventListener('click', (e) => { e.stopPropagation(); goToSlide(di, i); });
                    dots.appendChild(dot);
                });
                inner.appendChild(dots);

                if (prod.desc) {
                    const desc = document.createElement('div');
                    desc.className = 'prod-desc';
                    desc.textContent = prod.desc;
                    inner.appendChild(desc);
                }

                prodBody.appendChild(inner);
                prodEl.appendChild(prodBody);
                catBody.appendChild(prodEl);

                state[gIdx] = { idx: 0, total: prod.images.length };
                gIdx++;
            });

            catEl.appendChild(catBody);
            accordion.appendChild(catEl);
        });

        /* open first category + first product */
        const firstCat = accordion.querySelector('.cat-item');
        if (firstCat) {
            firstCat.classList.add('open');
            const firstProd = firstCat.querySelector('.prod-item');
            if (firstProd) firstProd.classList.add('open');
        }

        function toggleCat(el) {
            const isOpen = el.classList.contains('open');
            document.querySelectorAll('.cat-item').forEach(c => c.classList.remove('open'));
            if (!isOpen) el.classList.add('open');
        }

        function toggleProd(el) {
            const isOpen = el.classList.contains('open');
            el.parentElement.querySelectorAll('.prod-item').forEach(p => p.classList.remove('open'));
            if (!isOpen) el.classList.add('open');
        }

        function navigate(gi, dir) {
            const s = state[gi];
            if (!s) return;
            s.idx = (s.idx + dir + s.total) % s.total;
            renderSlide(gi);
        }

        function goToSlide(gi, i) {
            if (!state[gi]) return;
            state[gi].idx = i;
            renderSlide(gi);
        }

        function renderSlide(gi) {
            const s = state[gi];
            if (!s) return;
            const stage = document.querySelector(`.carousel-stage[data-gidx="${gi}"]`);
            if (!stage) return;
            stage.querySelectorAll('.carousel-slide').forEach((sl, i) => sl.classList.toggle('active', i === s.idx));
            document.querySelectorAll(`#dots-${gi} .carousel-dot`).forEach((d, i) => d.classList.toggle('active', i === s.idx));
        }

        let touchX = 0, touchGI = null;
        document.querySelectorAll('.carousel-stage').forEach(st => {
            st.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; touchGI = +st.dataset.gidx; }, { passive: true });
            st.addEventListener('touchend', e => {
                if (touchGI === null) return;
                if (Math.abs(e.changedTouches[0].clientX - touchX) > 40) navigate(touchGI, e.changedTouches[0].clientX < touchX ? 1 : -1);
                touchGI = null;
            }, { passive: true });
        });

        document.addEventListener('keydown', e => {
            const st = document.querySelector('.cat-item.open .prod-item.open .carousel-stage');
            if (!st) return;
            const gi = +st.dataset.gidx;
            if (e.key === 'ArrowLeft') navigate(gi, -1);
            if (e.key === 'ArrowRight') navigate(gi, 1);
        });

    });
    </script>
</body>
</html>
