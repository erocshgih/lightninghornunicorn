<!DOCTYPE html>
<!-- LHU ROUTER — maps clean paths and legacy aliases to the standalone category
     files; unknown paths are sent back to the root page. Language is resolved
     from the browser locale via data-lang-de / data-lang-en. -->
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<base href="/"/>
<title>Seite nicht gefunden — Lightning Horn Unicorn</title>
<meta content="#070708" name="theme-color"/>
<link href="Favicon/lhu_favicon.svg" rel="icon" type="image/svg+xml"/>
<style>
*{box-sizing:border-box}html{background:#070708}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 0%,rgba(224,72,54,.06),transparent 65%),#070708;color:#f5f4f0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;text-align:center}
.box{max-width:520px;width:100%;border:1px solid rgba(255,255,255,.16);border-radius:20px;padding:clamp(24px,6vw,48px);background:rgba(18,18,22,.76)}
h1{font-size:clamp(1.6rem,5vw,2.6rem);letter-spacing:-.03em;margin:0 0 12px}
p{color:rgba(245,244,240,.62);line-height:1.6;margin:0 0 24px}
a{display:inline-block;padding:12px 22px;border-radius:12px;background:#f5f4f0;color:#09090b;font-weight:700;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;text-decoration:none}
a:focus-visible{outline:2px solid #ff6b4a;outline-offset:3px}
</style>
</head>
<body>
<div class="box">
<h1 data-lang-de="404 — VERIRRTER REISENDER" data-lang-en="404 — LOST TRAVELLER">404 — VERIRRTER REISENDER</h1>
<p data-lang-de="Diese Route existiert nicht (mehr). Vielleicht führt der Weg zurück ins Multiversum." data-lang-en="This route does not exist (anymore). Maybe the way leads back to the multiverse.">Diese Route existiert nicht (mehr). Vielleicht führt der Weg zurück ins Multiversum.</p>
<a href="/" data-lang-de="Zurück zum Einhorn" data-lang-en="Back to the unicorn">Zurück zum Einhorn</a>
</div>
<script>
/* Language of the 404 page itself. */
(function () {
  try {
    var l = (navigator.language || navigator.userLanguage || 'en').toLowerCase().startsWith('de') ? 'de' : 'en';
    document.querySelectorAll('[data-lang-' + l + ']').forEach(function (el) {
      el.innerHTML = el.getAttribute('data-lang-' + l);
    });
  } catch (e) {}
})();
</script>
<script>
/* Route compatibility: clean paths, numbered legacy paths, hashes and GitHub Pages restore. */
(function () {
  var map = {
    '/about': '/about.html', '/vhsmultiverse': '/vhsmultiverse.html', '/humanart': '/humanart.html',
    '/projects': '/projects.html', '/storytime': '/storytime.html', '/music': '/music.html',
    '/contact': '/contact.html', '/donate': '/donate.html', '/hire-me': '/contact.html',
    '/3dheads': '/3dheads.html', '/3d-heads': '/3dheads.html',
    '/01_about': '/about.html', '/02_vhsmultiverse': '/vhsmultiverse.html', '/03_humanart': '/humanart.html',
    '/04_projects': '/projects.html', '/05_storytime': '/storytime.html', '/06_music': '/music.html',
    '/07_contact': '/contact.html', '/08_donate': '/donate.html',
    '/01_about.html': '/about.html', '/02_vhsmultiverse.html': '/vhsmultiverse.html',
    '/03_humanart.html': '/humanart.html', '/04_projects.html': '/projects.html',
    '/05_storytime.html': '/storytime.html', '/06_music.html': '/music.html',
    '/07_contact.html': '/contact.html', '/08_donate.html': '/donate.html',
    '/downloads': '/downloads.html'
  };
  var encoded = new URLSearchParams(location.search).get('__lhu_route');
  if (encoded) {
    try {
      var requested = new URL(encoded, location.origin);
      if (requested.origin === location.origin) {
        var p = requested.pathname.toLowerCase().replace(/\/+$/, '') || '/';
        if (map[p]) { location.replace(map[p] + requested.search + requested.hash); return; }
      }
    } catch (e) {}
  }
  var path = location.pathname.toLowerCase().replace(/\/+$/, '') || '/';
  if (location.hash.indexOf('#/') === 0) path = location.hash.slice(2).split('?')[0].toLowerCase().replace(/\/+$/, '');
  if (map[path]) { location.replace(map[path] + location.search); }
  else { location.replace('/'); }
})();
</script>
</body>
</html>
