<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Projects - LHU Content</title>
</head>
<body>
    <main>
        <style>
            /* ============================================
               PROJECTS — spezifische Styles
               (Globale Tokens kommen aus shared.css)
               ============================================ */
            :root {
                /* Fallbacks für Direkt-Aufruf ohne shared.css */
                --accent-red:  #e02424;
                --accent-blue: #1a73e8;
                --dot:         #d5d0ca;
                --dot-active:  #b33;
                --text:        #14120f;
                --text-muted:  #57504a;
                --text-soft:   #8a8078;
                --card-bg:     #ffffff;
                --bg-solid:    #ffffff;
                --border-soft: #e3ddd2;
                --radius:      10px;
                --fs-xs:       0.65rem;
                --fs-sm:       0.8rem;
            }
            html[data-theme="dark"]        { --dot: #4a4540; --dot-active: #ff8c22; }
            html[data-theme="mono-gray"]   { --dot: #555555; --dot-active: #dddddd; }
            html[data-theme="mono-green"]  { --dot: #1b5e20; --dot-active: #69f0ae; }
            html[data-theme="crt"]         { --dot: #2a4a2a; --dot-active: #99ff99; }

            /* SECTION WRAPPER */
            section#PROJECTS {
                width: 100%;
                max-width: 920px;
                margin: 0 auto;
                box-sizing: border-box;
            }

            /* ---------- ACCORDION (Kategorie) ---------- */
            .cat-group {
                border: 2px solid var(--border-soft);
                border-radius: var(--radius);
                margin-bottom: 12px;
                overflow: hidden;
                background: var(--card-bg);
                transition: border-color 0.3s, box-shadow 0.3s;
                width: 100%;
            }
            .cat-group.open {
                border-color: var(--strip-active);
                box-shadow: 0 0 16px rgba(255, 154, 60, 0.18);
            }

            .cat-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                width: 100%;
                padding: 16px 20px;
                cursor: pointer;
                user-select: none;
                -webkit-tap-highlight-color: transparent;
                transition: background 0.2s;
                background: none;
                border: none;
                font: inherit;
                color: inherit;
                text-align: left;
                min-height: 54px;
                touch-action: manipulation;
            }
            .cat-header:hover { background: rgba(255, 154, 60, 0.05); }
            .cat-header:focus-visible {
                outline: 2px solid var(--strip-active);
                outline-offset: -3px;
            }
            .cat-header .cat-label {
                font-family: var(--font-display, 'Press Start 2P', monospace);
                font-size: var(--fs-xs);
                color: var(--strip-active);
                letter-spacing: 0.1em;
            }
            .cat-header .arrow {
                display: inline-block;
                font-size: 14px;
                color: var(--strip-active);
                transition: transform 0.3s ease;
                margin-left: 10px;
                flex-shrink: 0;
            }
            .cat-group.open > .cat-header .arrow { transform: rotate(90deg); }

            /* ---------- GRID-ROWS-COLLAPSE (Kategorie) ---------- */
            .cat-body {
                display: grid;
                grid-template-rows: 0fr;
                transition: grid-template-rows 0.38s cubic-bezier(0.3, 0.9, 0.4, 1);
            }
            .cat-group.open > .cat-body { grid-template-rows: 1fr; }
            .cat-body-inner {
                overflow: hidden;
                min-height: 0;
            }

            /* ---------- ACCORDION (Produkt) ---------- */
            .prod-item { border-top: 1px solid var(--border-soft); }
            .prod-item:first-child { border-top: none; }

            .prod-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                width: 100%;
                padding: 14px 22px;
                cursor: pointer;
                user-select: none;
                -webkit-tap-highlight-color: transparent;
                transition: background 0.2s;
                background: none;
                border: none;
                font: inherit;
                color: inherit;
                text-align: left;
                min-height: 48px;
                touch-action: manipulation;
            }
            .prod-header:hover { background: rgba(255, 154, 60, 0.04); }
            .prod-header:focus-visible {
                outline: 2px solid var(--strip-active);
                outline-offset: -3px;
            }
            .prod-header .prod-name {
                font-family: var(--font-display, 'Press Start 2P', monospace);
                font-size: var(--fs-xs);
                color: var(--text-muted);
                letter-spacing: 0.05em;
                line-height: 1.5;
                padding-right: 8px;
            }
            .prod-header .prod-arrow {
                display: inline-block;
                font-size: 12px;
                color: var(--strip-active);
                transition: transform 0.3s ease;
                margin-left: 10px;
                flex-shrink: 0;
            }
            .prod-item.open > .prod-header .prod-arrow { transform: rotate(90deg); }

            /* ---------- GRID-ROWS-COLLAPSE (Produkt) ---------- */
            .prod-body {
                display: grid;
                grid-template-rows: 0fr;
                transition: grid-template-rows 0.38s cubic-bezier(0.3, 0.9, 0.4, 1);
            }
            .prod-item.open > .prod-body { grid-template-rows: 1fr; }

            .prod-body-inner {
                overflow: hidden;
                min-height: 0;
                padding: 0 24px 24px;
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            /* ---------- BESCHREIBUNG ---------- */
            .prod-desc {
                font-family: var(--font-body, 'VT323', monospace);
                font-size: var(--fs-body-content, 1.1rem);
                color: var(--text-muted);
                line-height: 1.55;
                margin-top: 20px;
                margin-bottom: 16px;
                text-align: left;
                white-space: pre-line;
                width: 100%;
                max-width: 65ch;
            }
            .prod-desc strong {
                color: var(--text);
                display: inline;
                font-weight: 600;
                font-family: var(--font-display, 'Press Start 2P', monospace);
                font-size: 0.85em;
                letter-spacing: 0.02em;
            }

            /* ---------- CAROUSEL ---------- */
            .carousel-wrapper {
                position: relative;
                width: 100%;
                max-width: 520px;
                margin: 15px auto 10px;
                overflow: hidden;
                border-radius: 8px;
                box-shadow: 0 2px 20px rgba(0, 0, 0, 0.06);
                background: var(--card-bg);
                box-sizing: border-box;
                border: 2px solid var(--border-soft);
                contain: layout paint;
            }
            .carousel-stage {
                position: relative;
                width: 100%;
                min-height: 220px;
                display: flex;
                align-items: center;
                justify-content: center;
                background: var(--bg-solid);
            }
            .carousel-slide {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                opacity: 0;
                visibility: hidden;
                transition: opacity 0.35s ease;
                pointer-events: none;
            }
            .carousel-slide.active {
                opacity: 1;
                visibility: visible;
                pointer-events: auto;
                position: relative;
                width: 100%;
                height: auto;
                min-height: 220px;
            }
            .carousel-slide img {
                display: block;
                width: 100%;
                height: auto;
                max-width: 100%;
                max-height: min(72vh, 720px);
                object-fit: contain;
                object-position: center;
                margin: 0 auto;
            }
            @media (max-width: 480px) {
                .carousel-wrapper { max-width: 100%; }
            }

            /* 3D-Modell-Slide */
            .carousel-slide.is-model {
                aspect-ratio: 1 / 1;
                width: min(100%, 320px);
                height: 320px;
                max-width: 320px;
                max-height: 320px;
                margin: auto;
            }
            .carousel-slide model-viewer {
                width: 100%;
                height: 100%;
                background: transparent;
                --poster-color: transparent;
                display: block;
            }

            /* Model-Loading-Overlay */
            .model-loading {
                position: absolute;
                inset: 0;
                z-index: 6;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 14px;
                background: var(--bg-solid);
                pointer-events: none;
            }
            .model-loading .spinner {
                width: 46px;
                height: 46px;
                border-radius: 50%;
                border: 4px solid rgba(128, 128, 128, 0.18);
                border-top-color: var(--strip-active, #ff7a00);
                animation: modelSpin 0.9s linear infinite;
            }
            .model-loading .label {
                font-family: var(--font-display, 'Press Start 2P', monospace);
                font-size: 11px;
                letter-spacing: 0.12em;
                text-transform: uppercase;
                color: var(--text-soft);
            }
            @keyframes modelSpin { to { transform: rotate(360deg); } }

            /* ---------- DOTS ---------- */
            .carousel-dots {
                display: flex;
                justify-content: center;
                gap: 12px;
                flex-wrap: wrap;
                margin: 12px 0 6px;
                padding: 4px 0;
            }
            .carousel-dot {
                width: 20px;
                height: 20px;
                border-radius: 50%;
                background: var(--dot);
                cursor: pointer;
                transition: background 0.25s, transform 0.25s;
                -webkit-tap-highlight-color: transparent;
                border: none;
                padding: 0;
                touch-action: manipulation;
            }
            .carousel-dot:hover,
            .carousel-dot:focus-visible { transform: scale(1.25); }
            .carousel-dot:focus-visible {
                outline: 2px solid var(--strip-active);
                outline-offset: 3px;
            }
            .carousel-dot.active {
                background: var(--dot-active);
                transform: scale(1.25);
            }

            @media (max-width: 480px) {
                .carousel-dot { width: 24px; height: 24px; }
                .prod-body-inner { padding: 0 16px 20px; }
            }

            /* ---------- FULLSCREEN 3D MODEL VIEWER ---------- */
            .lhu-3d-lightbox[hidden] { display: none !important; }
            .lhu-3d-lightbox { position: fixed; inset: 0; z-index: 100200; display: flex; align-items: center; justify-content: center; padding: clamp(12px, 3vw, 36px); background: rgba(0,0,0,.94); backdrop-filter: blur(12px); }
            .lhu-3d-lightbox__panel { position: relative; width: min(100%, 1100px); height: min(92vh, 900px); border: 1px solid rgba(255,255,255,.2); border-radius: 18px; background: radial-gradient(circle at 50% 40%, rgba(70,70,70,.22), #080808 72%); overflow: hidden; box-shadow: 0 24px 90px rgba(0,0,0,.6); isolation: isolate; }
            .lhu-3d-lightbox model-viewer { position: relative; z-index: 0; width: 100%; height: 100%; display: block; background: transparent; --poster-color: transparent; }
            .lhu-3d-lightbox__close { position: absolute; z-index: 5; top: 14px; right: 14px; width: 44px; height: 44px; border: 1px solid rgba(255,255,255,.35); border-radius: 50%; background: rgba(0,0,0,.72); color: white; font: 28px/1 sans-serif; cursor: pointer; }
            .lhu-3d-lightbox__tools { position: absolute; z-index: 5; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 8px; padding: 7px; border-radius: 30px; background: rgba(0,0,0,.72); border: 1px solid rgba(255,255,255,.2); }
            .lhu-3d-lightbox__tools button { min-width: 42px; height: 38px; border: 1px solid rgba(255,255,255,.25); border-radius: 20px; color: white; background: rgba(255,255,255,.1); font: 600 16px sans-serif; cursor: pointer; }
            /* Loading field: 20 moving LOADING rows while the GLB is loading. */
            .lhu-3d-loading-frame { position: absolute; inset: 0; z-index: 2; display: block; overflow: hidden; isolation: isolate; background: rgba(0,0,0,.58); color: #f3f3f3; opacity: 1; visibility: visible; transition: none; pointer-events: none; font-family: 'Courier New', monospace; }
            .lhu-3d-loading-frame.is-loaded { opacity: 0; visibility: hidden; transition: none !important; }
            .lhu-3d-loading-frame.has-error { background: rgba(0,0,0,.82); color: #ffbaba; }
            .lhu-3d-loading-lines { position: absolute; inset: 1.2% 0; z-index: 1; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
            .lhu-3d-loading-row { display: flex; align-items: center; flex: 1 1 0; min-height: 0; width: 100%; overflow: hidden; white-space: nowrap; font-size: clamp(8px, 1.02vw, 13px); line-height: 1; font-weight: 600; letter-spacing: .055em; text-shadow: 0 0 5px rgba(255,255,255,.2); opacity: .48; }
            .lhu-3d-loading-row__track { display: inline-flex; flex: 0 0 auto; width: max-content; will-change: transform; animation: lhuLoadingRowFlow var(--row-speed, 13s) linear var(--row-delay, 0s) infinite; }
            .lhu-3d-loading-row:nth-child(even) .lhu-3d-loading-row__track { animation-direction: reverse; opacity: .76; }
            .lhu-3d-loading-row__track span { display: inline-block; flex: 0 0 auto; padding-right: 1.8em; }
            @keyframes lhuLoadingRowFlow { from { transform: translate3d(0,0,0); } to { transform: translate3d(-33.333333%,0,0); } }
            .carousel-dot-3d { width: auto; min-width: 42px; height: 26px; padding: 0 9px; border-radius: 14px; color: #111; background: #d8d8d8; font: 800 11px/1 sans-serif; letter-spacing: .06em; }
            .carousel-dot-3d::before { content: '3D'; }
            .carousel-dot-3d:hover, .carousel-dot-3d:focus-visible { background: var(--dot-active); color: #fff; }
            @media (max-width: 600px) { .lhu-3d-lightbox__panel { width: 100%; height: 88vh; border-radius: 12px; } }

            /* The GLB loading typography is intentionally animated on desktop and mobile,
               even when the OS requests reduced motion. Other page animations still respect it. */
            @media (prefers-reduced-motion: reduce) {
                .lhu-3d-loading-row__track {
                    animation-name: lhuLoadingRowFlow !important;
                    animation-duration: var(--row-speed, 7s) !important;
                    animation-delay: var(--row-delay, 0s) !important;
                    animation-timing-function: linear !important;
                    animation-iteration-count: infinite !important;
                }
            }

            /* ---------- REDUCED MOTION ---------- */
            @media (prefers-reduced-motion: reduce) {
                .cat-body,
                .prod-body { transition-duration: 0.01ms; }
                .cat-header .arrow,
                .prod-header .prod-arrow { transition-duration: 0.01ms; }
                .model-loading .spinner { animation-duration: 2s; }
            }
        </style>

        <section id="PROJECTS">
            <h2 data-lang-en="PROJECTS" data-lang-de="PROJECTS">PROJECTS</h2>
            <p data-lang-en="Mechanical prototypes, 3D designs &amp; physical concepts"
               data-lang-de="Mechanische Prototypen, 3D Designs &amp; physische Konzepte">Mechanical prototypes, 3D designs &amp; physical concepts</p>

            <div id="projects-accordion"></div>
        </section>

        <script>
            /* ============================================================
               PROJECTS — Akkordeon & Carousel (v2.0)
               ============================================================ */
            (function initProjects() {
                const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                const lang = (navigator.language || 'en').toLowerCase().startsWith('de') ? 'de' : 'en';

                /* ------------------------------------------------
                   Model-Viewer lazy-loading (einmalig, mit Guard)
                   ------------------------------------------------ */
                function ensureModelViewer() {
                    if (customElements.get('model-viewer')) return Promise.resolve();
                    if (!document.querySelector('script[data-lhu-mv-loader]')) {
                        const s = document.createElement('script');
                        s.type = 'module';
                        s.src = 'https://cdn.jsdelivr.net/npm/@google/model-viewer/dist/model-viewer.min.js';
                        s.setAttribute('data-lhu-mv-loader', '1');
                        document.head.appendChild(s);
                    }
                    return customElements.whenDefined('model-viewer').catch(() => {});
                }
                // Früh anstoßen – zu dem Zeitpunkt, wenn der Nutzer das erste Modell öffnet, ist es bereit.
                ensureModelViewer();

                /* The 20-row LOADING field remains visible until model-viewer emits load. */

                let modelLightbox = null;
                let modelLightboxViewer = null;
                function ensureModelLightbox() {
                    if (modelLightbox) return modelLightbox;
                    modelLightbox = document.createElement('div');
                    modelLightbox.className = 'lhu-3d-lightbox';
                    modelLightbox.hidden = true;
                    modelLightbox.setAttribute('role', 'dialog');
                    modelLightbox.setAttribute('aria-modal', 'true');
                    modelLightbox.setAttribute('aria-label', 'Interaktive 3D-Modellansicht');
                    modelLightbox.innerHTML = `<div class="lhu-3d-lightbox__panel">
                        <div class="lhu-3d-loading-frame" role="status" aria-label="3D-Modell wird geladen" aria-live="polite">
                            <div class="lhu-3d-loading-lines" aria-hidden="true"></div>
                        </div>
                        <button type="button" class="lhu-3d-lightbox__close" aria-label="3D-Ansicht schließen">×</button>
                        <div class="lhu-3d-lightbox__tools"><button type="button" data-zoom="out" aria-label="Herauszoomen">−</button><button type="button" data-zoom="in" aria-label="Hineinzoomen">+</button><button type="button" data-zoom="reset" aria-label="Ansicht zurücksetzen">↺</button></div>
                    </div>`;
                    const loadingLines = modelLightbox.querySelector('.lhu-3d-loading-lines');
                    const lineText = 'LOADING LOADING LOADING LOADING LOADING LOADING LOADING LOADING ';
                    loadingLines.innerHTML = Array.from({ length: 20 }, (_, i) => {
                        const speed = 6.2 + (i % 5) * 0.65;
                        const delay = -(i * 0.19).toFixed(2);
                        const direction = i % 2 === 0 ? '' : ' is-reversed';
                        return `<div class="lhu-3d-loading-row${direction}" style="--row-speed:${speed}s;--row-delay:${delay}s"><div class="lhu-3d-loading-row__track"><span>${lineText}</span><span aria-hidden="true">${lineText}</span><span aria-hidden="true">${lineText}</span></div></div>`;
                    }).join('');
                    document.body.appendChild(modelLightbox);
                    const close = () => {
                        modelLightbox.hidden = true;
                        if (modelLightboxViewer) { modelLightboxViewer.remove(); modelLightboxViewer = null; }
                    };
                    modelLightbox.querySelector('.lhu-3d-lightbox__close').addEventListener('click', close);
                    modelLightbox.addEventListener('click', e => { if (e.target === modelLightbox) close(); });
                    modelLightbox.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
                    modelLightbox.querySelectorAll('[data-zoom]').forEach(btn => btn.addEventListener('click', () => {
                        if (!modelLightboxViewer) return;
                        const action = btn.dataset.zoom;
                        if (action === 'reset') { modelLightboxViewer.cameraOrbit = 'auto auto auto'; modelLightboxViewer.fieldOfView = 'auto'; return; }
                        const orbit = modelLightboxViewer.getCameraOrbit();
                        const next = orbit.radius * (action === 'in' ? 0.8 : 1.25);
                        modelLightboxViewer.cameraOrbit = `${orbit.theta}rad ${orbit.phi}rad ${next}m`;
                    }));
                    return modelLightbox;
                }
                function openModelLightbox(modelSrc, label) {
                    ensureModelViewer();
                    const box = ensureModelLightbox();
                    const panel = box.querySelector('.lhu-3d-lightbox__panel');
                    const loader = panel.querySelector('.lhu-3d-loading-frame');
                    const lineTracks = loader.querySelectorAll('.lhu-3d-loading-row__track span');
                    const lineText = 'LOADING LOADING LOADING LOADING LOADING LOADING LOADING LOADING ';

                    if (modelLightboxViewer) modelLightboxViewer.remove();
                    loader.classList.remove('is-loaded', 'has-error', 'fluid-unavailable');
                    lineTracks.forEach(span => { span.textContent = lineText; });

                    const viewer = document.createElement('model-viewer');
                    viewer.setAttribute('alt', `${label} – interaktives 3D-Modell`);
                    viewer.setAttribute('camera-controls', '');
                    viewer.setAttribute('touch-action', 'pan-y');
                    viewer.setAttribute('auto-rotate', '');
                    viewer.setAttribute('auto-rotate-delay', '0');
                    viewer.setAttribute('rotation-per-second', '24deg');
                    viewer.setAttribute('shadow-intensity', '1');
                    viewer.setAttribute('exposure', '1');

                    viewer.addEventListener('load', () => {
                        if (modelLightboxViewer !== viewer) return;
                        loader.classList.add('is-loaded');
                    }, { once: true });
                    viewer.addEventListener('error', () => {
                        if (modelLightboxViewer !== viewer) return;
                        loader.classList.add('has-error');
                        lineTracks.forEach(span => { span.textContent = 'MODEL COULD NOT BE LOADED · MODEL COULD NOT BE LOADED · '; });
                    }, { once: true });

                    modelLightboxViewer = viewer;
                    panel.appendChild(viewer);
                    box.hidden = false;
                    box.querySelector('.lhu-3d-lightbox__close').focus({preventScroll:true});
                    // Set the source only after the loader is visible and listeners exist.
                    requestAnimationFrame(() => {
                        if (modelLightboxViewer === viewer) viewer.setAttribute('src', modelSrc);
                    });
                }

                let gIdx = 0;
                const activeModelViewers = new Set();

                /* ------------------------------------------------
                   Cleanup (registriert beim Menü)
                   ------------------------------------------------ */
                function projectsCleanup() {
                    if (modelLightbox) {
                        modelLightbox.hidden = true;
                    }
                    if (modelLightboxViewer) { modelLightboxViewer.remove(); modelLightboxViewer = null; }
                    activeModelViewers.forEach(mv => {
                        try {
                            if (mv.pause) mv.pause();
                            mv.removeAttribute('src');
                        } catch (e) { /* ignore */ }
                    });
                    activeModelViewers.clear();
                }

                if (typeof window.__lhuRegisterCleanup === 'function') {
                    window.__lhuRegisterCleanup(projectsCleanup);
                } else {
                    window.addEventListener('pagehide', projectsCleanup, { once: true });
                }

                /* ------------------------------------------------
                   DOM-Aufbau
                   ------------------------------------------------ */
                projects.forEach((group) => {
                    const catEl = document.createElement('div');
                    catEl.className = 'cat-group';

                    const catHeader = document.createElement('button');
                    catHeader.type = 'button';
                    catHeader.className = 'cat-header';
                    catHeader.setAttribute('aria-expanded', 'false');
                    catHeader.innerHTML = `
                        <span class="cat-label">${group.cat}</span>
                        <span class="arrow" aria-hidden="true">&#9654;</span>
                    `;
                    catHeader.addEventListener('click', () => toggleCat(catEl));
                    catEl.appendChild(catHeader);

                    const catBody = document.createElement('div');
                    catBody.className = 'cat-body';

                    const catBodyInner = document.createElement('div');
                    catBodyInner.className = 'cat-body-inner';

                    group.products.forEach((prod) => {
                        const prodEl = document.createElement('div');
                        prodEl.className = 'prod-item';

                        const prodHeader = document.createElement('button');
                        prodHeader.type = 'button';
                        prodHeader.className = 'prod-header';
                        prodHeader.setAttribute('aria-expanded', 'false');
                        prodHeader.innerHTML = `
                            <span class="prod-name-wrap"><span class="prod-name">${prod.name}</span></span>
                            <span class="prod-arrow" aria-hidden="true">&#9654;</span>
                        `;
                        prodHeader.addEventListener('click', () => toggleProd(prodEl));
                        prodEl.appendChild(prodHeader);

                        const prodBody = document.createElement('div');
                        prodBody.className = 'prod-body';

                        const inner = document.createElement('div');
                        inner.className = 'prod-body-inner';

                        const wrapper = document.createElement('div');
                        wrapper.className = 'carousel-wrapper';

                        const stage = document.createElement('div');
                        stage.className = 'carousel-stage';
                        stage.setAttribute('data-gidx', gIdx);

                        const modelItem = prod.images.find(item => typeof item.model === 'string' && item.model.toLowerCase().endsWith('.glb'));
                        const imageItems = prod.images.filter(item => !item.model);
                        imageItems.forEach((item, i) => {
                            const slide = document.createElement('div');
                            slide.className = 'carousel-slide' + (i === 0 ? ' active' : '');
                            const img = document.createElement('img');
                            img.src = item.src;
                            img.alt = `${prod.name} – Ansicht ${i + 1}`;
                            img.loading = 'lazy';
                            img.decoding = 'async';
                            slide.appendChild(img);
                            if (typeof window.__lhuAttachImageZoom === 'function') {
                                window.__lhuAttachImageZoom(slide, img, `Bild vergrößern: ${prod.name}, Ansicht ${i + 1}`);
                            }
                            stage.appendChild(slide);
                        });
                        wrapper.appendChild(stage);
                        inner.appendChild(wrapper);

                        // Bild-Unterpunkte plus optionaler letzter 3D-Unterpunkt.
                        const dots = document.createElement('div');
                        dots.className = 'carousel-dots';
                        dots.id = 'dots-' + gIdx;
                        dots.setAttribute('role', 'group');
                        dots.setAttribute('aria-label', `${prod.name} – Bildansichten und 3D-Modell`);
                        const projectIndex = gIdx;
                        imageItems.forEach((_, i) => {
                            const dot = document.createElement('button');
                            dot.type = 'button';
                            dot.className = 'carousel-dot' + (i === 0 ? ' active' : '');
                            dot.setAttribute('aria-label', `${prod.name} – Bild ${i + 1} von ${imageItems.length}`);
                            dot.setAttribute('aria-pressed', i === 0 ? 'true' : 'false');
                            dot.addEventListener('click', e => { e.stopPropagation(); goToSlide(projectIndex, i); });
                            dots.appendChild(dot);
                        });
                        if (modelItem) {
                            const modelDot = document.createElement('button');
                            modelDot.type = 'button';
                            modelDot.className = 'carousel-dot carousel-dot-3d';
                            modelDot.setAttribute('aria-label', `${prod.name} – interaktives 3D-Modell öffnen`);
                            modelDot.title = '3D-Modell öffnen';
                            modelDot.addEventListener('click', e => { e.stopPropagation(); openModelLightbox(modelItem.model, prod.name); });
                            dots.appendChild(modelDot);
                        }
                        inner.appendChild(dots);

                        if (prod.desc) {
                            const desc = document.createElement('div');
                            desc.className = 'prod-desc';
                            desc.innerHTML = prod.desc[lang] || prod.desc['en'];
                            inner.appendChild(desc);
                        }

                        prodBody.appendChild(inner);
                        prodEl.appendChild(prodBody);
                        catBodyInner.appendChild(prodEl);

                        state[gIdx] = { idx: 0, total: imageItems.length };
                        gIdx++;
                    });

                    catBody.appendChild(catBodyInner);
                    catEl.appendChild(catBody);
                    accordion.appendChild(catEl);
                });

                // Erste Kategorie + erstes Produkt vorab öffnen (wie im Original)
                const firstCat = accordion.querySelector('.cat-group');
                if (firstCat) {
                    const header = firstCat.querySelector('.cat-header');
                    firstCat.classList.add('open');
                    if (header) header.setAttribute('aria-expanded', 'true');
                    const firstProd = firstCat.querySelector('.prod-item');
                    if (firstProd) {
                        firstProd.classList.add('open');
                        const prodHeader = firstProd.querySelector('.prod-header');
                        if (prodHeader) prodHeader.setAttribute('aria-expanded', 'true');
                    }
                }

                // Nach dem Start-Layout: Modell-Viewer für aktive Slides initialisieren
                requestAnimationFrame(() => updateStageManager());

                /* ------------------------------------------------
                   Toggle-Logik
                   ------------------------------------------------ */
                function toggleCat(el) {
                    const isOpen = el.classList.contains('open');
                    document.querySelectorAll('.cat-group').forEach(c => {
                        c.classList.remove('open');
                        const h = c.querySelector('.cat-header');
                        if (h) h.setAttribute('aria-expanded', 'false');
                    });
                    if (!isOpen) {
                        el.classList.add('open');
                        const header = el.querySelector('.cat-header');
                        if (header) header.setAttribute('aria-expanded', 'true');
                    }
                    requestAnimationFrame(() => updateStageManager());
                }

                function toggleProd(el) {
                    const isOpen = el.classList.contains('open');
                    el.parentElement.querySelectorAll('.prod-item').forEach(p => {
                        p.classList.remove('open');
                        const h = p.querySelector('.prod-header');
                        if (h) h.setAttribute('aria-expanded', 'false');
                    });
                    if (!isOpen) {
                        el.classList.add('open');
                        const header = el.querySelector('.prod-header');
                        if (header) header.setAttribute('aria-expanded', 'true');
                    }
                    requestAnimationFrame(() => updateStageManager());
                }

                function goToSlide(gi, i) {
                    if (!state[gi]) return;
                    state[gi].idx = i;
                    renderSlide(gi);
                }

                function renderSlide(gi) {
                    const s = state[gi];
                    if (!s) return;
                    const stage = document.querySelector(`.carousel-stage[data-gidx="${gi}"]`);
                    if (!stage) return;
                    stage.querySelectorAll('.carousel-slide').forEach((sl, i) => {
                        sl.classList.toggle('active', i === s.idx);
                    });
                    document.querySelectorAll(`#dots-${gi} .carousel-dot:not(.carousel-dot-3d)`).forEach((d, i) => {
                        d.classList.toggle('active', i === s.idx);
                        d.setAttribute('aria-pressed', i === s.idx ? 'true' : 'false');
                    });
                    updateStageManager();
                }

                /* ------------------------------------------------
                   Model-Viewer-Management
                   ------------------------------------------------ */
                function mountModel(slide, modelSrc) {
                    if (slide.querySelector('model-viewer')) return;
                    ensureModelViewer();

                    const autoRotate = reduceMotion ? '' : 'auto-rotate';
                    slide.innerHTML = `
                        <model-viewer
                            src="${modelSrc}"
                            camera-controls
                            ${autoRotate}
                            auto-rotate-delay="0"
                            rotation-per-second="30deg"
                            shadow-intensity="1"
                            exposure="1"
                            loading="eager"
                            reveal="auto"
                            alt="3D-Modell"
                            style="width:100%;height:100%;background:transparent;--poster-color:transparent;display:block;">
                        </model-viewer>
                        <div class="model-loading" aria-hidden="true">
                            <div class="spinner"></div>
                            <div class="label">Loading 3D</div>
                        </div>
                    `;
                    const mv = slide.querySelector('model-viewer');
                    const loader = slide.querySelector('.model-loading');
                    activeModelViewers.add(mv);

                    const hideLoader = () => {
                        if (loader && loader.parentNode) loader.parentNode.removeChild(loader);
                    };
                    mv.addEventListener('load', hideLoader, { once: true });
                    mv.addEventListener('error', hideLoader, { once: true });
                    // Sicherheitsnetz, falls weder load noch error feuert
                    setTimeout(hideLoader, 15000);
                }

                function unmountModel(slide) {
                    const mv = slide.querySelector('model-viewer');
                    if (!mv) return;
                    activeModelViewers.delete(mv);
                    try {
                        if (mv.pause) mv.pause();
                        mv.removeAttribute('src');
                    } catch (e) { /* ignore */ }
                    slide.innerHTML = '';
                }

                function updateStageManager() {
                    document.querySelectorAll('.carousel-stage').forEach(stage => {
                        const gi = +stage.dataset.gidx;
                        const s = state[gi];
                        const isOpen = !!(stage.closest('.cat-group.open') && stage.closest('.prod-item.open'));

                        stage.querySelectorAll('.carousel-slide').forEach((sl, i) => {
                            const modelSrc = sl.dataset.model;
                            if (!modelSrc) return;

                            const shouldBeActive = isOpen && s && s.idx === i;

                            if (shouldBeActive) {
                                mountModel(sl, modelSrc);
                                const mv = sl.querySelector('model-viewer');
                                if (mv) {
                                    mv.setAttribute('auto-rotate', reduceMotion ? '' : 'auto-rotate');
                                    try { if (mv.play) mv.play(); } catch (e) { /* ignore */ }
                                }
                            } else {
                                unmountModel(sl);
                            }
                        });
                    });
                }
            })();
        </script>
    </main>
</body>
</html>
