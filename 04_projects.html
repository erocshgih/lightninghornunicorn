<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Projects - LHU Content</title>
</head>
<body>
    <main>
        <!-- Spezifisches CSS nur für diese Unterseite -->
        <style>
            .subtitle { text-align: center; color: var(--text-soft); font-size: var(--fs-sm); margin-bottom: 30px; line-height: 2.4; }

            /* CATEGORY ACCORDION */
            .cat-group {
                border: 2px solid var(--border-soft);
                border-radius: var(--radius);
                margin-bottom: 10px;
                overflow: hidden;
                background: var(--card-bg);
                transition: border-color 0.3s, box-shadow 0.3s;
                width: 100%;
            }

            .cat-group.open {
                border-color: var(--strip-active);
                box-shadow: 0 0 12px rgba(255, 154, 60, 0.2);
            }

            .cat-header {
                display: flex; align-items: center; justify-content: space-between;
                padding: 14px 16px; cursor: pointer; user-select: none;
                -webkit-tap-highlight-color: transparent; transition: background 0.2s;
            }

            .cat-header:hover { background: rgba(255, 154, 60, 0.04); }
            .cat-header .cat-label { font-family: 'Press Start 2P', cursive; font-size: var(--fs-xs); color: var(--strip-active); letter-spacing: 0.1em; }
            .cat-header .arrow { font-size: 14px; color: var(--strip-active); transition: transform 0.3s ease; margin-left: 10px; }
            .cat-group.open > .cat-header .arrow { transform: rotate(90deg); }

            .cat-body { max-height: 0; overflow: hidden; transition: max-height 0.4s ease; }
            .cat-group.open > .cat-body { max-height: 2000px; }

            /* PRODUCT ACCORDION */
            .prod-item { border-top: 1px solid var(--border-soft); }
            .prod-header {
                display: flex; align-items: center; justify-content: space-between;
                padding: 12px 16px; cursor: pointer; user-select: none;
                -webkit-tap-highlight-color: transparent; transition: background 0.2s;
            }

            .prod-header:hover { background: rgba(255, 154, 60, 0.03); }
            .prod-header .prod-name { font-family: 'Press Start 2P', cursive; font-size: var(--fs-xs); color: var(--text-muted); letter-spacing: 0.05em; }
            .prod-header .prod-arrow { font-size: 12px; color: var(--strip-active); transition: transform 0.3s ease; margin-left: 10px; }
            .prod-item.open > .prod-header .prod-arrow { transform: rotate(90deg); }

            .prod-body { max-height: 0; overflow: hidden; transition: max-height 0.4s ease; }
            .prod-item.open > .prod-body { max-height: 1600px; }
            .prod-body-inner { padding: 0 24px 18px; }

            /* PRODUCT DESCRIPTION */
            .prod-desc {
                font-family: 'VT323', monospace;
                font-size: 18px;
                color: var(--text-muted);
                line-height: 1.8;
                margin-top: 16px;
                margin-bottom: 16px;
                text-align: left;
                white-space: pre-line;
            }

            .prod-desc strong {
                color: var(--text);
                font-family: 'Press Start 2P', cursive;
                font-size: var(--fs-xs);
                display: block;
                margin-bottom: 8px;
                letter-spacing: 0.05em;
            }

            /* CAROUSEL WRAPPER & STAGE */
            .carousel-wrapper {
                position: relative;
                width: 100%;
                max-width: 600px;
                margin: 15px auto 12px auto;
            }

            .carousel-stage {
                position: relative; width: 100%; aspect-ratio: 1; border-radius: var(--radius);
                overflow: hidden; background: var(--bg-solid);
                box-shadow: 0 3px 14px rgba(0, 0, 0, 0.15);
                border: 2px solid var(--border-soft);
            }

            .carousel-slide {
                position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
                opacity: 0; transition: opacity 0.35s ease; pointer-events: none;
            }
            .carousel-slide.active { opacity: 1; pointer-events: auto; }
            .carousel-slide img { width: 100%; height: 100%; object-fit: contain; display: block; }

            .carousel-slide model-viewer {
                width: 100%; height: 100%; background: transparent; --poster-color: transparent; display: block;
            }

            .model-loading {
                position: absolute; inset: 0; z-index: 6; display: flex; flex-direction: column;
                align-items: center; justify-content: center; gap: 14px; background: var(--bg-solid); pointer-events: none;
            }
            .model-loading .spinner {
                width: 46px; height: 46px; border-radius: 50%; border: 4px solid rgba(255, 255, 255, 0.18);
                border-top-color: var(--text, #fff); animation: modelSpin 0.9s linear infinite;
            }
            .model-loading .label { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-soft, #aaa); }
            @keyframes modelSpin { to { transform: rotate(360deg); } }

            /* ZOOM BUTTON */
            .zoom-btn {
                position: absolute; bottom: 12px; right: 12px; width: 36px; height: 36px;
                background: var(--card-bg); border: 2px solid var(--border-soft); border-radius: 50%;
                display: flex; align-items: center; justify-content: center; text-decoration: none;
                font-size: 16px; color: var(--text); box-shadow: 0 4px 10px rgba(0,0,0,0.5);
                transition: all 0.2s ease; z-index: 5; -webkit-tap-highlight-color: transparent;
            }
            .zoom-btn:hover {
                transform: scale(1.15) rotate(10deg);
                background: var(--strip-active); border-color: #111;
            }

            /* SIDE ARROWS & DOTS */
            .carousel-btn {
                position: absolute;
                top: 50%;
                transform: translateY(-50%);
                z-index: 10;
                width: 40px; height: 40px; border: 2px solid var(--border-soft); border-radius: 50%;
                background: var(--card-bg); color: var(--text-soft); font-size: 16px; cursor: pointer;
                display: flex; align-items: center; justify-content: center; transition: all 0.2s;
                -webkit-tap-highlight-color: transparent;
                box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            }
            .carousel-btn.prev-btn { left: 8px; }
            .carousel-btn.next-btn { right: 8px; }

            .carousel-btn:hover { background: var(--strip-active); border-color: var(--strip-active); color: #111; transform: translateY(-50%) scale(1.1); }
            
            .carousel-dots { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; margin-bottom: 12px; }
            .carousel-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--dot, #555); cursor: pointer; transition: background 0.25s, transform 0.25s; -webkit-tap-highlight-color: transparent; border: 1px solid var(--border-soft); }
            .carousel-dot:hover { transform: scale(1.4); }
            .carousel-dot.active { background: var(--dot-active, var(--strip-active)); transform: scale(1.3); }

            @media (min-width: 769px) {
                .carousel-wrapper { max-width: 600px; }
                .carousel-btn.prev-btn { left: -24px; }
                .carousel-btn.next-btn { right: -24px; }
                .prod-desc { max-width: 600px; margin: 0 auto 20px auto; text-align: left; font-size: 20px;}
                .subtitle { font-size: var(--fs-base); }
            }
        </style>

        <section id="PROJECTS">
            <h2 data-lang-en="PROJECTS" data-lang-de="PROJECTS">PROJECTS</h2>
            <p class="subtitle" data-lang-en="Mechanical prototypes, 3D designs & physical concepts" data-lang-de="Mechanische Prototypen, 3D Designs & physische Konzepte">Mechanical prototypes, 3D designs &amp; physical concepts</p>

            <div id="projects-accordion"></div>
        </section>

        <!-- 3D model viewer script library -->
        <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer/dist/model-viewer.min.js"></script>

        <script>
            (function initProjects() {
                const lang = (navigator.language || 'en').startsWith('de') ? 'de' : 'en';

                const projects = [
                    {
                        cat: 'GLASSES',
                        products: [
                            { name: 'DUCKPARADA: THUNDERBOLT', desc: {
                                en: `Inspired by Bauhaus, aircraft carriers, ducks, and Japanese superheroes, Thunderbolt 1 was born after over two years of development and more than 30 self-made drafts in Blender 3D.\n\nA modular glasses structure with optical lenses and genuine everyday utility.\n\nThe idea was simple: Grab the lightning from the sky and wear it as eyewear.\n\nZeus: Who the fuck stole my glasses?\nNarrator: For risks and side effects, bargain with feta cheese.`,
                                de: `Inspiriert von Bauhaus, Flugzeugträgern, Enten und japanischen Superhelden, entstand Thunderbolt 1 nach über zwei Jahren Entwicklung und mehr als 30 selbstgemachten Entwürfen in Blender 3D.\n\nEine modulare Brillenstruktur mit optischen Linsen und echtem Alltagsnutzen.\n\nDie Idee war simpel: Greif dir den Blitz vom Himmel und trag ihn als Brille.\n\nZeus: Wer zur Hölle hat meine Brille geklaut?\nErzähler: Zu Risiken und Nebenwirkungen feilschen Sie mit Feta-Käse.`
                            }, images: [
                                { src: 'projects/projects_glasses_duckparada_thunderbolt1vedran.webp' },
                                { src: 'projects/projects_glasses_duckparada_thunderbolt2package.webp' },
                                { src: 'projects/projects_glasses_duckparada_thunderbolt3comic.webp' },
                                { src: 'projects/projects_glasses_duckparada_thunderbolt4squat.webp' },
                            ]}
                        ]
                    },
                    {
                        cat: 'HELMET',
                        products: [
                            { name: 'DUCKPARADA: DUCKLIGHT', desc: {
                                en: `Began as a decorative duck from a flea market. After removing the plastic bottom, it was defined as headgear.\n\nThis resulted in the first unlicensed Duckparada helmet.\n\nUltralight, striking, and completely uncontrollable. A prototype and proof that good ideas sometimes show up when your mind is open for illegal usage of all day objects.`,
                                de: `Begann als dekorative Ente vom Flohmarkt. Nachdem der Plastikboden entfernt wurde, definierte man es kurzerhand als Kopfbedeckung.\n\nDas war die Geburtsstunde des ersten unlizenzierten Duckparada-Helms.\n\nUltraleicht, auffällig und völlig unkontrollierbar. Ein Prototyp und der Beweis dafür, dass gute Ideen manchmal dann entstehen, wenn man bereit ist, Alltagsgegenstände zweckzuentfremden.`
                            }, images: [
                                { src: 'projects/projects_helmet_duckparada_ducklight_package1.webp' },
                                { src: 'projects/projects_helmet_duckparada_mark123comic.webp' },
                                { src: 'projects/projects_helmet_duckparada_mark12goldmine.webp' },
                            ]}
                        ]
                    },
                    {
                        cat: 'RINGS',
                        products: [
                            { name: 'TURN ME ON RING', desc: {
                                en: `One ring to give them all… emotional confusion.\n\nBuilt around a grotesque sculptural form with a tongue, staring eyes, tail, and a small mechanical-looking button marked "ON".\n\nAt the top sits a simple message:\n\nLOVE ME.\nLOVE. ME.\nYES WE CAN.\n\nPart wearable object, part miniature character. Lickable? …rusty and risk-obvious.\n\nA ring with no purpose.\nExcept perhaps turning something on.`,
                                de: `Ein Ring, um sie alle... in emotionale Verwirrung zu stürzen.\n\nGebaut um eine groteske skulpturale Form mit einer Zunge, starrenden Augen, einem Schwanz und einem kleinen mechanisch aussehenden Knopf mit der Aufschrift "ON".\n\nOben prangt eine einfache Botschaft:\n\nLOVE ME.\nLOVE. ME.\nYES WE CAN.\n\nTeils tragbares Objekt, teils Miniatur-Charakter. Kann man ihn ablecken? …er ist rostig und birgt offensichtliche Risiken.\n\nEin Ring ohne Zweck.\nAußer vielleicht, irgendetwas "anzuschalten".`
                            }, images: [
                                { src: 'projects/projects_rings_turnmeonring_1package.webp' },
                                { model: 'glb/turnmeonring.glb' },
                                { src: 'projects/projects_rings_turnmeonring_2comic.webp' },
                                { src: 'projects/projects_rings_turnmeonring_3ad.webp' },
                            ]}
                        ]
                    },
                    {
                        cat: 'FIGURINE',
                        products: [
                            { name: 'BERTA', desc: {
                                en: `Berta was developed for a future in which vegetables became necessary weapons.\n\nA pink goat equipped with two of the juiciest hi-tek cucumbers… in Dolby surround ASMR. Maybe.\n\nAfter the battle, there is only one thing left to do:\n\nEat your weapons, Berta.`,
                                de: `Berta wurde für eine Zukunft entwickelt, in der Gemüse zu notwendigen Waffen wurde.\n\nA rosa Ziege, ausgerüstet mit zwei der saftigsten Hi-Tek-Gurken… in Dolby Surround ASMR. Vielleicht.\n\nNach der Schlacht bleibt nur noch eines zu tun:\n\nFriss deine Waffen, Berta.`
                            }, images: [
                                { src: 'projects/projects_figurine_berta1package.webp' },
                                { model: 'glb/Berta.glb' },
                                { src: 'projects/projects_figurine_berta3drawing.webp' },
                                { src: 'projects/projects_figurine_berta4newspaper.webp' },
                            ]},
                            { name: 'DUDDHA', desc: {
                                en: `Duddha was created. Yes.\n\nA sculptural duck combining Buddhist bullshitery, retro science fiction, and the unmistakable attitude of… flipping the bird.\n\nHe's obese. He may eat your last pretzel from your lunchbox.\n\nEnlightenment is just Tron throwing up in a meditation room.\n\nThis whole package is the most disrespectful, glorious, motherfuckin' spiritual awakening you've ever seen. You don't meditate with this thing — you put it on your desk, stare at it, and suddenly every corporate meeting, every traffic jam, every "live laugh love" sign in the world just feels a little more… fuckable.\n\nForget the red pill. Forget the blue pill. He ate both of 'em and now we're stuck here while he waves his hands, politely asking for the next sandwich.`,
                                de: `Duddha wurde erschaffen. Ja.\n\nEine skulpturale Ente, die buddhistischen Bullshit, Retro-Science-Fiction und die unverkennbare Attitüde des... Mittelfingers kombiniert.\n\nEr ist fettleibig. Er könnte dir die letzte Brezel aus deiner Brotdose klauen.\n\nErleuchtung ist einfach nur Tron, der in einem Meditationsraum kotzt.\n\nDieses ganze Paket ist das respektloseste, glorreichste, verfickteste spirituelle Erwachen, das du je gesehen hast. Man meditiert nicht mit diesem Ding – man stellt es auf den Schreibtisch, starrt es an und plötzlich fühlt sich jedes Firmenmeeting, jeder Stau und jedes "Live Laugh Love"-Schild auf der Welt ein bisschen... fickbarer an.\n\nVergiss die rote Pille. Vergiss die blaue Pille. Er hat beide gefressen und jetzt sitzen wir hier fest, während er mit den Händen wedelt und höflich nach dem nächsten Sandwich fragt.`
                            }, images: [
                                { src: 'projects/projects_figurine_duddha1package.webp' },
                                { src: 'projects/projects_figurine_duddha2figurine.webp' },
                            ]}
                        ]
                    },
                    {
                        cat: 'ACCESSOIRE',
                        products: [
                            { 
                                name: 'DUCK ARMOR: BACKPACK', 
                                desc: {
                                    en: `Duck Armor began as a simple question:\nWhat if a backpack had armor...\n...\n...\n...\n...\n...\nAnd duck faces obviously...?\nIt looks like a backpack designed by a medieval knight who had only seen ducks.\nImagine a riot shield, but instead of protecting you, it asks for bread.\nDon't feed the armor.\nBuilt around a sculptural duck-shaped shell with integrated... well fuck this explanational summary...\nDesigned for everyday movement through streets, crowds, and questionable adventures.\nIt carries your stuff.\nWHAT! DO... YOU... WANT... MORE!\nUGH.\nIt’s not fashion.\nIt’s a tactical misunderstanding.\nThe only thing more powerful than two duck heads on your chest is three duck heads on your chest.\nUnfortunately...\nTHAT'S TOO POWERFUL.`,
                                    de: `Duck Armor begann mit einer einfachen Frage:\nWas wäre, wenn ein Rucksack eine Rüstung hätte...\n...\n...\n...\n...\n...\nUnd natürlich Entengesichter...?\nEs sieht aus wie ein Rucksack, entworfen von einem mittelalterlichen Ritter, der in seinem Leben nur Enten gesehen hat.\nStell dir ein Schutzschild vor, das dich nicht beschützt, sondern nach Brot fragt.\nBitte die Rüstung nicht füttern.\nGebaut um eine skulpturale entenförmige Schale mit integriertem... ach, scheiß auf diese Erklärung...\nEntwickelt für die tägliche Bewegung durch Straßen, Menschenmassen und fragwürdige Abenteuer.\nEr trägt dein Zeug.\nWAS! WILLST... DU... MEHR!\nUGH.\nEs ist keine Mode.\nEs ist ein taktisches Missverständnis.\nDas Einzige, was mächtiger ist als zwei Entenköpfe auf der Brust, sind drei Entenköpfe auf der Brust.\nLeider...\nIST DAS ZU MÄCHTIG.`
                                }, 
                                images: [
                                    { src: 'projects/projects_accessoire_duckarmorbackpack_vernissage.webp' },
                                    { model: 'glb/duckarmorbackpack.glb' },
                                    { src: 'projects/projects_accessoire_duckarmorbackpack_big.webp' },
                                    { src: 'projects/projects_accessoire_duckarmorbackpack_man.webp' },
                                    { src: 'projects/projects_accessoire_duckarmorbackpack_woman.webp' },
                                    { src: 'projects/projects_accessoire_duckarmorbackpack_poster.webp' }
                                ]
                            },
                            { name: 'NOT PLUG', desc: {
                                en: `Designed as a playful attachment for headphones, the glossy black cat ears transform an ordinary pair into something less ordinary. *slurp*\n\nInspired by the strange intersection of consumer electronics, fashion, cosplay, and the approval of your local OnlyFans artist.\n\nEasy to attach. Explanations are discussable.`,
                                de: `Als verspieltes Zubehör für Kopfhörer entworfen, verwandeln die glänzend schwarzen Katzenohren ein gewöhnliches Paar in etwas weniger Gewöhnliches. *schlürf*\n\nInspiriert von der seltsamen Schnittmenge aus Unterhaltungselektronik, Mode, Cosplay und der Zustimmung deines lokalen OnlyFans-Artists.\n\nEinfach zu befestigen. Erklärungen sind verhandelbar.`
                            }, images: [
                                { src: 'projects/projects_accessoire_notplug1package.webp' },
                                { src: 'projects/projects_accessoire_notplug2comic.webp' },
                            ]}
                        ]
                    },
                    {
                        cat: 'TSHIRTS',
                        products: [
                            {
                                name: 'BALKAN PARK',
                                desc: {
                                    en: `The T-shirt that makes you the ruler.\n(Well... or at least the undisputed king of the next medieval festival. Or it annoys the security standing there wordlessly in heavy knight armor and helmets.)\n\n'Do these pigs have a stage pass?'\n\n<strong>Look:</strong>\nWell... it looks a bit like a race with a mushroom-slurping plumber who took the route into the swamp.\n\nYou put it on, and your body says:\n'Yes. Yes man. Tonight we ride wild boars into the mosh pit. Tradition is tradition.'\n\n⚔️ <strong>Why is this shirt special?</strong>\nThis is the shirt of the uncle who cuts the wedding cake with his fist at family celebrations. Because it's the official uniform of men who keep their Oakley sunglasses on at night in the bathtub.\n\nWe at Lightning Horn Unicorn cannot offer a guarantee for this garment, but with every purchase comes a roll of duct tape. Maybe. 50/50.`,
                                    de: `Das T-Shirt, das dich zum Herrscher macht.\n(Naja… oder zumindest zum unangefochtenen König des nächsten Mittelalterfests. Oder es verärgert die Security, die wortlos in schweren Ritterrüstungen und Helmen dasteht.)\n\n„Haben diese Schweine einen Stagepass?“\n\n<strong>Optik:</strong>\nNaja… es sieht ein bisschen wie ein Rennen mit einem pilzschlabbernden Klempner aus, der die Route in den Sumpf genommen hat.\n\nDu ziehst es an, und dein Körper sagt:\n„Ja. Ja, Mann. Heute Nacht reiten wir auf Wildsäuen in den Moshpit. Tradition ist Tradition.“\n\n⚔️ <strong>Warum dieses Shirt besonders ist?</strong>\nDas ist das Shirt von dem Onkel, der auf Familienfeiern die Hochzeitstorte mit der Faust anschneidet. Weil es die offizielle Uniform von Männern ist, die ihre Oakley-Sonnenbrille auch nachts in der Badewanne aufbehalten.\n\nWir bei Lightning Horn Unicorn können für dieses Kleidungsstück keine Garantie anbieten, aber bei jedem Kauf gibt es eine Rolle Panzertape dazu. Vielleicht. 50/50.`
                                },
                                images: [
                                    { src: 'projects/projects_tshirts_balkanparkband.webp' },
                                    { src: 'projects/projects_tshirts_balkanparkmodel.webp' }
                                ]
                            }
                        ]
                    }
                ];

                const accordion = document.getElementById('projects-accordion');
                if (!accordion) return;

                let gIdx = 0;
                const state = {};

                projects.forEach((group) => {
                    const catEl = document.createElement('div');
                    catEl.className = 'cat-group';

                    const catHeader = document.createElement('div');
                    catHeader.className = 'cat-header';
                    catHeader.innerHTML = `
                        <span class="cat-label">${group.cat}</span>
                        <span class="arrow">&#9654;</span>
                    `;
                    catHeader.addEventListener('click', () => toggleCat(catEl));
                    catEl.appendChild(catHeader);

                    const catBody = document.createElement('div');
                    catBody.className = 'cat-body';

                    group.products.forEach((prod) => {
                        const prodEl = document.createElement('div');
                        prodEl.className = 'prod-item';

                        const prodHeader = document.createElement('div');
                        prodHeader.className = 'prod-header';
                        prodHeader.innerHTML = `
                            <span class="prod-name">${prod.name}</span>
                            <span class="prod-arrow">&#9654;</span>
                        `;
                        const thisGIdx = gIdx;
                        prodHeader.addEventListener('click', () => toggleProd(prodEl));
                        prodEl.appendChild(prodHeader);

                        const prodBody = document.createElement('div');
                        prodBody.className = 'prod-body';

                        const inner = document.createElement('div');
                        inner.className = 'prod-body-inner';

                        // Carussell-Wrapper (enthält Stage und seitliche Pfeile)
                        const wrapper = document.createElement('div');
                        wrapper.className = 'carousel-wrapper';

                        const prevBtn = document.createElement('button');
                        prevBtn.className = 'carousel-btn prev-btn';
                        prevBtn.innerHTML = '&#9664;';
                        prevBtn.addEventListener('click', (e) => { e.stopPropagation(); navigate(thisGIdx, -1); });
                        wrapper.appendChild(prevBtn);

                        const stage = document.createElement('div');
                        stage.className = 'carousel-stage';
                        stage.setAttribute('data-gidx', gIdx);

                        prod.images.forEach((item, i) => {
                            const slide = document.createElement('div');
                            slide.className = 'carousel-slide' + (i === 0 ? ' active' : '');
                            
                            if (item.model) {
                                slide.setAttribute('data-model', item.model);
                            } else {
                                slide.innerHTML = `
                                    <img src="${item.src}" loading="lazy">
                                    <a href="${item.src}" target="_blank" class="zoom-btn" title="Bild in neuem Tab öffnen & zoomen">🔍</a>
                                `;
                            }
                            stage.appendChild(slide);
                        });
                        wrapper.appendChild(stage);

                        const nextBtn = document.createElement('button');
                        nextBtn.className = 'carousel-btn next-btn';
                        nextBtn.innerHTML = '&#9654;';
                        nextBtn.addEventListener('click', (e) => { e.stopPropagation(); navigate(thisGIdx, 1); });
                        wrapper.appendChild(nextBtn);

                        inner.appendChild(wrapper);

                        // Dots (unterhalb des Bildes)
                        const dots = document.createElement('div');
                        dots.className = 'carousel-dots';
                        dots.id = 'dots-' + gIdx;

                        prod.images.forEach((_, i) => {
                            const dot = document.createElement('span');
                            dot.className = 'carousel-dot' + (i === 0 ? ' active' : '');
                            const di = gIdx;
                            dot.addEventListener('click', (e) => { e.stopPropagation(); goToSlide(di, i); });
                            dots.appendChild(dot);
                        });
                        inner.appendChild(dots);

                        if (prod.desc) {
                            const desc = document.createElement('div');
                            desc.className = 'prod-desc';
                            desc.innerHTML = prod.desc[lang] || prod.desc['en'];
                            inner.appendChild(desc);
                        }

                        prodBody.appendChild(inner);
                        prodEl.appendChild(prodBody);
                        catBody.appendChild(prodEl);

                        state[gIdx] = { idx: 0, total: prod.images.length };
                        gIdx++;
                    });

                    catEl.appendChild(catBody);
                    accordion.appendChild(catEl);
                });

                const firstCat = accordion.querySelector('.cat-group');
                if (firstCat) {
                    firstCat.classList.add('open');
                    const firstProd = firstCat.querySelector('.prod-item');
                    if (firstProd) firstProd.classList.add('open');
                }

                updateStageManager();

                function toggleCat(el) {
                    const isOpen = el.classList.contains('open');
                    document.querySelectorAll('.cat-group').forEach(c => c.classList.remove('open'));
                    if (!isOpen) el.classList.add('open');
                    updateStageManager();
                }

                function toggleProd(el) {
                    const isOpen = el.classList.contains('open');
                    el.parentElement.querySelectorAll('.prod-item').forEach(p => p.classList.remove('open'));
                    if (!isOpen) el.classList.add('open');
                    updateStageManager();
                }

                function navigate(gi, dir) {
                    const s = state[gi];
                    if (!s) return;
                    s.idx = (s.idx + dir + s.total) % s.total;
                    renderSlide(gi);
                }

                function goToSlide(gi, i) {
                    if (!state[gi]) return;
                    state[gi].idx = i;
                    renderSlide(gi);
                }

                function renderSlide(gi) {
                    const s = state[gi];
                    if (!s) return;
                    const stage = document.querySelector(`.carousel-stage[data-gidx="${gi}"]`);
                    if (!stage) return;
                    stage.querySelectorAll('.carousel-slide').forEach((sl, i) => sl.classList.toggle('active', i === s.idx));
                    document.querySelectorAll(`#dots-${gi} .carousel-dot`).forEach((d, i) => d.classList.toggle('active', i === s.idx));
                    updateStageManager();
                }

                function updateStageManager() {
                    document.querySelectorAll('.carousel-stage').forEach(stage => {
                        const gi = +stage.dataset.gidx;
                        const s = state[gi];
                        const isOpen = stage.closest('.cat-group.open') && stage.closest('.prod-item.open');

                        stage.querySelectorAll('.carousel-slide').forEach((sl, i) => {
                            const modelSrc = sl.dataset.model;
                            if (!modelSrc) return;

                            const active = !!(isOpen && s && s.idx === i);

                            if (active) {
                                if (!sl.querySelector('model-viewer')) {
                                    sl.innerHTML = `
                                        <model-viewer src="${modelSrc}" camera-controls auto-rotate auto-rotate-delay="0" rotation-per-second="30deg" shadow-intensity="1" exposure="1" loading="eager" reveal="auto" ar style="width: 100%; height: 100%; background: transparent; --poster-color: transparent; display: block;"></model-viewer>
                                        <div class="model-loading">
                                            <div class="spinner"></div>
                                            <div class="label">Loading 3D</div>
                                        </div>
                                    `;
                                    const mv = sl.querySelector('model-viewer');
                                    const loader = sl.querySelector('.model-loading');
                                    const hideLoader = () => { if(loader) loader.remove(); };
                                    mv.addEventListener('load', hideLoader, { once: true });
                                    mv.addEventListener('error', hideLoader, { once: true });
                                } else {
                                    const mv = sl.querySelector('model-viewer');
                                    if (mv) {
                                        mv.setAttribute('auto-rotate', '');
                                        try { if (mv.play) mv.play(); } catch(e) {}
                                    }
                                }
                            } else {
                                if (sl.querySelector('model-viewer')) {
                                    sl.innerHTML = '';
                                }
                            }
                        });
                    });
                }
            })();
        </script>
    </main>
</body>
</html>
