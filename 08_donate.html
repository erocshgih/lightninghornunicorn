<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Donate - LHU Content</title>
</head>
<body>
    <main>
        <!-- Spezifisches CSS nur für diese Unterseite -->
        <style>
            .script-box {
                background: var(--card-bg);
                border: 2px solid var(--border-soft);
                border-radius: var(--radius);
                padding: 30px 20px;
                margin: 20px auto 40px auto;
                box-shadow: 0 4px 15px rgba(0,0,0,0.05);
                text-align: left;
                font-size: var(--fs-sm);
                line-height: 2.4;
            }

            .wobble-glitch-container {
                position: relative;
                display: inline-block;
            }
            .analog-glow {
                pointer-events: none;
            }

            .invisible-paypal-submit-btn {
                background: none;
                border: none;
                padding: 0;
                cursor: pointer;
                outline: none;
                display: block;
                margin: 0 auto;
                transition: transform 0.2s;
            }
            .invisible-paypal-submit-btn:hover {
                transform: scale(1.05);
            }

            @keyframes retroBlink {
                0%, 49% { opacity: 1; }
                50%, 100% { opacity: 0; }
            }

            @media (min-width: 769px) {
                .script-box { padding: 40px; font-size: 1rem; max-width: 650px; }
                .invisible-paypal-submit-btn { width: 300px !important; }
                .invisible-paypal-submit-btn .wobble-glitch-container { width: 300px !important; }
                .paypal-img { width: 300px !important; }
            }
        </style>

        <section id="DONATE">
            <h2 data-lang-en="SUPPORT ART" data-lang-de="SUPPORT ART">SUPPORT ART</h2>

            <div class="script-box" 
                 data-lang-en="Let's skip the emotional begging. You've made it this far into the universe, so you already know the deal. Creating art requires time, obsession, and electricity. I provide the first two. You can help with the third.<br><br>This is Mrrrphadora van Donatia. A highly advanced tactical plush unit. Press her belly button to fund the next 3D prototype, the next album, or just my next coffee.<br><br>No pressure. But she is watching."
                 data-lang-de="Lass uns das emotionale Betteln überspringen. Du bist so weit in dieses Universum vorgedrungen, also kennst du den Deal. Kunst erfordert Zeit, Obsession und Strom. Ich liefere die ersten beiden. Du kannst beim dritten helfen.<br><br>Das ist Mrrrphadora van Donatia. Eine hochgradig taktische Plüscheinheit. Drück ihren Bauchknopf, um den nächsten 3D-Prototypen, das nächste Album oder einfach meinen nächsten Kaffee zu finanzieren.<br><br>Kein Druck. Aber sie beobachtet dich."
            ></div>

            <form action="https://www.paypal.com/donate/?hosted_button_id=KXHUZ6BNZAY84&source=qr" method="post" target="_blank" style="text-align: center; margin: 30px auto 10px auto; width: 100%;">
                <button type="submit" class="invisible-paypal-submit-btn" style="width: 200px;">
                    <div class="wobble-glitch-container" style="width: 200px; border-radius: 12px; box-shadow: 0 6px 15px rgba(0,0,0,0.15); border: 3px solid #333;">
                        <img src="https://raw.githubusercontent.com/erocshgih/lightninghornunicorn/main/mrrrphadoravandonatia.webp"
                             class="paypal-img"
                             title="Donate to Mrrrphadora van Donatia"
                             alt="Donate to Mrrrphadora van Donatia"
                             style="width: 200px !important; height: auto !important; display: block; margin: 0 !important; border-radius: 8px !important; box-shadow: none !important;">
                        <div class="analog-glow"></div>
                    </div>
                </button>
            </form>

            <p style="font-family: 'Press Start 2P', cursive; font-size: 0.55rem; color: #FF2800; text-align: center; letter-spacing: 1px; margin-top: 25px; animation: retroBlink 1.5s infinite steps(2);">
                ⚡ WARNING: UNAUTHORIZED GENEROSITY DETECTED // SYSTEM OVERRIDE ⚡
            </p>
        </section>

        <script>
            (function initDonate() {
                const lang = (navigator.language || 'en').startsWith('de') ? 'de' : 'en';
                document.querySelectorAll('[data-lang-en]').forEach(el => {
                    const text = el.getAttribute(`data-lang-${lang}`);
                    if (text) el.innerHTML = text;
                });
            })();
        </script>
    </main>
</body>
</html>
