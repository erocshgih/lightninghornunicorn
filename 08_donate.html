<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Donate - LHU Content</title>
</head>
<body>
    <main>
        <!-- Nur noch die absolut nötige Animation für den Warn-Text -->
        <style>
            @keyframes retroBlink {
                0%, 49% { opacity: 1; }
                50%, 100% { opacity: 0; }
            }
        </style>

        <section id="DONATE">
            <h2 data-lang-en="SUPPORT ART" data-lang-de="SUPPORT ART">SUPPORT ART</h2>

            <!-- Textformatierung exakt wie in den anderen Kategorien (reines <p>) -->
            <p data-lang-en="You have ventured this far into this website and want to support the art of tomorrow.<br><br>Creating art requires time and a ridiculously large amount of coffee. If you like what is being created here, you can help directly with a donation.<br><br>This is Mrrrphadora van Donatia. Simply press the sticker to support me. Thank you."
               data-lang-de="Du bist so weit in diese Website vorgedrungen und möchtest die Kunst von morgen fördern.<br><br>Kunst zu erschaffen erfordert Zeit und eine lächerlich große Menge an Kaffee. Wenn dir gefällt, was hier entsteht, kannst du direkt mithelfen mit einer Spende.<br><br>Das hier ist Mrrrphadora van Donatia. Drücke einfach das Sticker, um mich zu supporten. Danke.">
            </p>

            <!-- Sauberer Button ohne Rahmen, nutzt die globalen Sticker-Klassen -->
            <form action="https://www.paypal.com/donate/?hosted_button_id=KXHUZ6BNZAY84&source=qr" method="post" target="_blank" style="text-align: center; margin: 40px auto;">
                <button type="submit" class="sticker-link" style="background: none; border: none; cursor: pointer; outline: none; padding: 0;">
                    <img src="https://raw.githubusercontent.com/erocshgih/lightninghornunicorn/main/donate.png"
                         class="transparent-sticker"
                         title="Donate to Mrrrphadora van Donatia"
                         alt="Donate to Mrrrphadora van Donatia">
                </button>
            </form>

            <!-- Der blinkende Warntext im korrekten LHU-Stil -->
            <p style="font-size: var(--fs-xs); color: #FF2800; text-align: center; letter-spacing: 1px; margin-top: 25px; animation: retroBlink 1.5s infinite steps(2);">
                ⚡ WARNING: UNAUTHORIZED GENEROSITY DETECTED // SYSTEM OVERRIDE ⚡
            </p>
        </section>
    </main>
</body>
</html>
