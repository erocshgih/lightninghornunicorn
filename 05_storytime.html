<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Storytime - LHU Content</title>
</head>
<body>
    <main>
        <style>
            /* ============================================
               STORYTIME — spezifische Styles
               (Globale Tokens kommen aus shared.css)
               ============================================ */

            /* Kapitel-Navigation */
            .chapter-topnav {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 8px;
                margin: 20px auto 24px;
                max-width: 720px;
            }
            .chapter-topnav button {
                padding: 8px 12px;
                background: var(--card-bg);
                color: var(--text);
                border: 2px solid var(--border-medium);
                border-radius: var(--radius-sm, 6px);
                font-family: var(--font-display, 'Press Start 2P', monospace);
                font-size: 12px;
                transition: all 0.2s var(--ease-out, ease);
                cursor: pointer;
                touch-action: manipulation;
            }
            .chapter-topnav button:hover,
            .chapter-topnav button:focus-visible {
                background: var(--strip-active);
                color: #111;
                border-color: var(--strip-active);
                transform: translateY(-2px);
                outline: none;
            }
            .chapter-topnav button.current {
                background: var(--strip-active);
                color: #111;
                border-color: var(--border-strong, #14120f);
                font-weight: bold;
                box-shadow: 0 0 10px rgba(255, 122, 0, 0.4);
            }

            /* Sprach-Toggle */
            .lang-select-container {
                display: flex;
                justify-content: center;
                gap: 12px;
                margin-bottom: 24px;
            }
            .lang-btn {
                padding: 10px 20px;
                background: var(--card-bg);
                color: var(--text);
                text-decoration: none;
                border: 2px solid var(--border-medium);
                border-radius: var(--radius-sm, 6px);
                font-size: 12px;
                font-family: var(--font-display, 'Press Start 2P', monospace);
                cursor: pointer;
                transition: all 0.2s ease;
                touch-action: manipulation;
            }
            .lang-btn:hover,
            .lang-btn:focus-visible {
                background: #80f0a8;
                color: #111;
                border-color: #80f0a8;
                box-shadow: 0 0 12px rgba(128,240,168,0.5);
                outline: none;
            }
            .lang-btn.active {
                background: #80f0a8;
                color: #111;
                border-color: #80f0a8;
                box-shadow: 0 0 12px rgba(128,240,168,0.3);
            }

            /* Text-Reader (Terminal-Look) */
            .text-reader-container {
                background-color: var(--card-bg);
                border: 2px solid var(--border-medium);
                border-radius: var(--radius);
                padding: 30px;
                box-shadow: inset 0 0 20px rgba(0,0,0,0.03), var(--shadow-md, 0 4px 14px rgba(0,0,0,0.06));
                position: relative;
                overflow: hidden;
                max-width: 900px;
                margin: 0 auto;
            }

            /* CRT-Rauschen (performanter) */
            .text-reader-container::before {
                content: "";
                position: absolute;
                top: -10%; left: -10%;
                width: 120%; height: 120%;
                background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.4'/%3E%3C/svg%3E");
                pointer-events: none;
                z-index: 0;
                animation: staticJitter 0.5s steps(2) infinite;
                will-change: transform;
            }
            @keyframes staticJitter {
                0%   { transform: translate(0, 0); }
                25%  { transform: translate(10px, -10px); }
                50%  { transform: translate(-8px, 8px); }
                75%  { transform: translate(12px, 4px); }
                100% { transform: translate(0, 0); }
            }

            #text-content {
                font-family: var(--font-body, 'VT323', monospace);
                font-size: clamp(1.15rem, 1vw + 0.8rem, 1.35rem);
                color: #00a800; /* Klassisches Terminal-Grün */
                text-align: left;
                line-height: 1.7;
                white-space: pre-wrap; 
                word-wrap: break-word;
                position: relative;
                z-index: 1; 
            }
            html[data-theme="dark"] #text-content,
            html[data-theme="mono-gray"] #text-content,
            html[data-theme="crt"] #text-content {
                color: #69f0ae; /* Helleres Grün für Dark-Modes */
            }

            .loading-text {
                font-family: var(--font-display, 'Press Start 2P', monospace);
                font-size: 12px;
                color: var(--text-soft);
                animation: pulse 1.2s infinite alternate;
                display: inline-block;
            }
            @keyframes pulse { from { opacity: 0.4; } to { opacity: 1; } }

            @media (min-width: 769px) {
                .text-reader-container { padding: 50px; }
                #text-content { font-size: 1.5rem; line-height: 1.8; }
                .chapter-topnav button { font-size: 13px; padding: 10px 14px; }
            }

            @media (prefers-reduced-motion: reduce) {
                .text-reader-container::before { animation: none; }
                .loading-text { animation: none; }
            }
        </style>

        <section id="STORYTIME">
            <h2 data-lang-en="STORYTIME" data-lang-de="STORYTIME">STORYTIME</h2>
            
            <nav id="dynamic-chapter-nav" class="chapter-topnav" aria-label="Kapitel-Navigation">
                <!-- Wird per JS befüllt -->
            </nav>

            <div class="lang-select-container">
                <button id="lang-en" class="lang-btn active" type="button" aria-pressed="true">ENGLISH</button>
                <button id="lang-de" class="lang-btn" type="button" aria-pressed="false">DEUTSCH</button>
            </div>

            <div class="text-reader-container">
                <div id="text-content" aria-live="polite">
                    <span class="loading-text" id="storytime-scan-loader">SCANNING ARCHIVE DIRECTORY...</span>
                </div>
            </div>
        </section>

        <script>
            (function initStorytime() {
                let totalChapters = 0;
                let currentChapter = 1;
                let currentLang = (navigator.language || 'en').toLowerCase().startsWith('de') ? 'de' : 'en'; 
                let chapterData = { en: '', de: '' };

                const contentDiv = document.getElementById('text-content');
                const navDiv = document.getElementById('dynamic-chapter-nav');
                const btnEn = document.getElementById('lang-en');
                const btnDe = document.getElementById('lang-de');

                if (!contentDiv || !navDiv || !btnEn || !btnDe) return;
                const scanLoader = document.getElementById('storytime-scan-loader');
                if (scanLoader && window.LHU?.Loader) scanLoader.outerHTML = window.LHU.Loader.markup('SCANNING ARCHIVE DIRECTORY...');

                // Sprache initialisieren
                if (currentLang === 'de') {
                    btnDe.classList.add('active');
                    btnDe.setAttribute('aria-pressed', 'true');
                    btnEn.classList.remove('active');
                    btnEn.setAttribute('aria-pressed', 'false');
                }

                // AbortController für sauberes Abbrechen beim Kategorie-Wechsel
                let fetchController = null;

                function cleanup() {
                    if (fetchController) {
                        fetchController.abort();
                        fetchController = null;
                    }
                }

                if (typeof window.__lhuRegisterCleanup === 'function') {
                    window.__lhuRegisterCleanup(cleanup);
                } else {
                    window.addEventListener('pagehide', cleanup, { once: true });
                }

                // Sprach-Buttons
                btnEn.addEventListener('click', () => {
                    currentLang = 'en';
                    btnEn.classList.add('active');
                    btnEn.setAttribute('aria-pressed', 'true');
                    btnDe.classList.remove('active');
                    btnDe.setAttribute('aria-pressed', 'false');
                    renderText();
                });

                btnDe.addEventListener('click', () => {
                    currentLang = 'de';
                    btnDe.classList.add('active');
                    btnDe.setAttribute('aria-pressed', 'true');
                    btnEn.classList.remove('active');
                    btnEn.setAttribute('aria-pressed', 'false');
                    renderText();
                });

                async function scanChapters() {
                    // 1. Prüfen, ob wir die Anzahl in dieser Session schon kennen
                    const cacheKey = 'lhu-storytime-chaptercount';
                    const cachedCount = sessionStorage.getItem(cacheKey);

                    if (cachedCount !== null) {
                        totalChapters = parseInt(cachedCount, 10);
                        if (totalChapters > 0) {
                            buildNavigation();
                            loadChapter(1);
                        } else {
                            showEmptyArchive();
                        }
                        return;
                    }

                    // 2. Wenn nicht gecacht: Scannen
                    let count = 1;
                    while (true) {
                        let numStr = count.toString().padStart(6, '0');
                        try {
                            let response = await fetch(`chapters/${numStr}.txt`, { method: 'HEAD' });
                            if (response.ok) {
                                count++;
                            } else {
                                break; 
                            }
                        } catch (error) {
                            break; 
                        }
                    }
                    
                    totalChapters = count - 1;

                    // 3. Ergebnis in Session speichern
                    sessionStorage.setItem(cacheKey, totalChapters.toString());

                    if (totalChapters > 0) {
                        buildNavigation();
                        loadChapter(1);
                    } else {
                        showEmptyArchive();
                    }
                }

                function showEmptyArchive() {
                    contentDiv.innerHTML = `
                    <div style="text-align: center; margin-bottom: 25px;">
                        <span style="color: var(--strip-active); font-size: 24px;">[ ARCHIVE DIRECTORY EMPTY ]</span>
                    </div>
                    <div style="padding: 20px; border: 1px dashed var(--border-soft); border-radius: 8px;">
                        <strong>BACK COVER TEASER // SYSTEM LOG</strong><br><br>
                        [SCENE START]<br><br>
                        INT. NEON-LIT BUNKER IN VIENNA - NIGHT<br><br>
                        VEDRAN (LIGHTNING HORN UNICORN) hits the mechanical keyboard. Sparks fly.<br><br>
                        VEDRAN<br>
                        The chapters! Where are they?! The VHS Multiverse will collapse into a singularity of cheap 80s static!<br><br>
                        AETHER VEYLAN steps out of the shadows, spinning a glowing floppy disk on one finger.<br><br>
                        AETHER<br>
                        We didn't write them yet. We were too busy hot-gluing a lightbulb to a duck helmet.<br><br>
                        NARRATOR (V.O.)<br>
                        In a world where text files are missing, one duo must upload their stories before the 16-bit apocalypse hits. For risks and side effects, bargain with feta cheese.<br><br>
                        [SCENE END]
                    </div>`;
                }

                function buildNavigation() {
                    navDiv.innerHTML = '';
                    for (let i = 1; i <= totalChapters; i++) {
                        let numStr = i.toString().padStart(6, '0');
                        let btn = document.createElement('button');
                        btn.type = 'button';
                        btn.textContent = numStr;
                        btn.setAttribute('aria-label', `Kapitel ${i}`);
                        btn.addEventListener('click', () => loadChapter(i));
                        navDiv.appendChild(btn);
                    }
                }

                async function loadChapter(num) {
                    if (currentChapter === num && chapterData.en !== '') return; // Verhindere unnötiges Neuladen

                    currentChapter = num;
                    
                    // Navigation updaten
                    const btns = navDiv.querySelectorAll('button');
                    btns.forEach((btn, index) => {
                        const isCurrent = (index + 1 === num);
                        btn.classList.toggle('current', isCurrent);
                        if (isCurrent) btn.setAttribute('aria-current', 'page');
                        else btn.removeAttribute('aria-current');
                    });

                    contentDiv.innerHTML = window.LHU?.Loader?.markup('LOADING FILE...') || '<span class="loading-text">LOADING FILE...</span>';
                    
                    let numStr = num.toString().padStart(6, '0');
                    
                    cleanup(); // Vorherigen Fetch abbrechen, falls noch aktiv
                    fetchController = new AbortController();

                    try {
                        let response = await fetch(`chapters/${numStr}.txt`, { signal: fetchController.signal });
                        if (response.ok) {
                            let text = await response.text();
                            parseChapterText(text);
                            renderText();
                            
                            // Sanft nach oben scrollen, damit man den Textanfang sieht
                            const container = document.querySelector('.text-reader-container');
                            if (container) {
                                container.scrollIntoView({ behavior: 'smooth', block: 'start' });
                            }
                        } else {
                            contentDiv.innerHTML = "<p>FILE CORRUPTED OR MISSING.</p>";
                        }
                    } catch (error) {
                        if (error.name === 'AbortError') return; // Ignorieren, wenn wir absichtlich abgebrochen haben
                        contentDiv.innerHTML = "<p>CONNECTION ERROR.</p>";
                    }
                }

                function parseChapterText(rawText) {
                    if (rawText.includes('[ GERMAN VERSION ]')) {
                        let parts = rawText.split('[ GERMAN VERSION ]');
                        chapterData.en = parts[0].replace('[ ENGLISH VERSION ]', '').trim();
                        chapterData.de = parts[1].trim();
                    } else {
                        chapterData.en = rawText;
                        chapterData.de = "ERROR 404: GERMAN TRANSLATION NOT FOUND IN ARCHIVE.";
                    }
                }

                function renderText() {
                    let mainText = currentLang === 'en' ? chapterData.en : chapterData.de;
                    let continuedText = currentLang === 'en' ? "\n\n\n... TO BE CONTINUED ..." : "\n\n\n... FORTSETZUNG FOLGT ...";
                    contentDiv.textContent = mainText + continuedText;
                }
                
                // Verzögerter Start für flüssigeres Laden
                setTimeout(scanChapters, 100);
            })();
        </script>
    </main>
</body>
</html>
