<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Storytime - LHU Content</title>
</head>
<body>
    <main>
        <!-- Spezifisches CSS nur für diese Unterseite -->
        <style>
            /* DYNAMISCHE KAPITEL-NAVIGATION */
            .chapter-topnav {
                display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 20px auto 30px auto; max-width: 700px;
            }
            .chapter-topnav a {
                padding: 8px 12px; background: var(--card-bg); color: var(--text); text-decoration: none;
                border: 2px solid var(--border-soft); border-radius: 6px; font-size: var(--fs-xs); transition: all 0.2s;
            }
            .chapter-topnav a:hover { background: var(--strip-active); color: #111; border-color: var(--strip-active); transform: translateY(-2px); }
            .chapter-topnav a.current { background: var(--strip-active); color: #111; border-color: var(--strip-active); font-weight: bold; }

            /* LANGUAGE TOGGLE */
            .lang-select-container { 
                display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; 
            }
            .lang-btn {
                padding: 10px 20px; background: var(--card-bg); color: var(--text); text-decoration: none;
                border: 2px solid var(--border-soft); border-radius: 6px; font-size: var(--fs-xs); 
                font-family: 'Press Start 2P', cursive; cursor: pointer; transition: all 0.2s;
            }
            .lang-btn:hover { background: #80f0a8; color: #111; border-color: #80f0a8; box-shadow: 0 0 10px rgba(128,240,168,0.5); }
            
            .lang-btn.active { background: #80f0a8; color: #111; border-color: #80f0a8; box-shadow: 0 0 10px rgba(128,240,168,0.3); }

            /* TEXT-ARCHIV MIT ANIMIERTEM RAUSCHEN */
            .text-reader-container {
                background-color: var(--card-bg);
                border: 2px solid var(--border-soft);
                border-radius: var(--radius);
                padding: 30px;
                box-shadow: inset 0 0 10px rgba(0,0,0,0.02);
                position: relative;
                overflow: hidden;
            }

            .text-reader-container::before {
                content: "";
                position: absolute;
                top: -50px; left: -50px; 
                width: calc(100% + 100px); 
                height: calc(100% + 100px);
                background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.4'/%3E%3C/svg%3E");
                pointer-events: none;
                z-index: 0;
                animation: staticJitter 0.2s steps(2) infinite;
            }

            @keyframes staticJitter {
                0%   { transform: translate(0px, 0px); }
                25%  { transform: translate(15px, -15px); }
                50%  { transform: translate(-10px, 10px); }
                75%  { transform: translate(20px, 5px); }
                100% { transform: translate(0px, 0px); }
            }

            #text-content {
                font-family: 'VT323', monospace;
                font-size: 20px;
                color: #00a800;
                text-align: left;
                line-height: 1.8;
                white-space: pre-wrap; 
                word-wrap: break-word;
                position: relative;
                z-index: 1; 
            }
            
            .loading-text {
                font-family: 'Press Start 2P', cursive;
                font-size: var(--fs-xs);
                color: var(--text-soft);
                animation: pulse 1s infinite alternate;
            }
            @keyframes pulse { from { opacity: 0.5; } to { opacity: 1; } }

            @media (min-width: 769px) {
                .text-reader-container { padding: 50px; }
                #text-content { font-size: 24px; line-height: 1.9; }
            }
        </style>

        <section id="STORYTIME">
            <h2 data-lang-en="STORYTIME" data-lang-de="STORYTIME">STORYTIME</h2>
            
            <!-- Dynamische Kapitel-Buttons -->
            <nav id="dynamic-chapter-nav" class="chapter-topnav"></nav>

            <!-- Language Buttons -->
            <div class="lang-select-container">
                <button id="lang-en" class="lang-btn active">ENGLISH</button>
                <button id="lang-de" class="lang-btn">DEUTSCH</button>
            </div>

            <!-- Textarchiv Container -->
            <div class="text-reader-container">
                <div id="text-content">
                    <span class="loading-text">SCANNING ARCHIVE DIRECTORY...</span>
                </div>
            </div>
        </section>

        <script>
            (function initStorytime() {
                let totalChapters = 0;
                let currentChapter = 1;
                
                let currentLang = (navigator.language || 'en').startsWith('de') ? 'de' : 'en'; 
                let chapterData = { en: '', de: '' };

                const contentDiv = document.getElementById('text-content');
                const navDiv = document.getElementById('dynamic-chapter-nav');
                const btnEn = document.getElementById('lang-en');
                const btnDe = document.getElementById('lang-de');

                if (!contentDiv || !navDiv || !btnEn || !btnDe) return;

                if (currentLang === 'de') {
                    btnDe.classList.add('active');
                    btnEn.classList.remove('active');
                }

                btnEn.addEventListener('click', () => {
                    currentLang = 'en';
                    btnEn.classList.add('active');
                    btnDe.classList.remove('active');
                    renderText();
                });

                btnDe.addEventListener('click', () => {
                    currentLang = 'de';
                    btnDe.classList.add('active');
                    btnEn.classList.remove('active');
                    renderText();
                });

                async function scanChapters() {
                    let count = 1;
                    while (true) {
                        let numStr = count.toString().padStart(6, '0');
                        try {
                            let response = await fetch(`chapters/${numStr}.txt`, { method: 'HEAD' });
                            if (response.ok) {
                                count++;
                            } else {
                                break; 
                            }
                        } catch (error) {
                            break; 
                        }
                    }
                    
                    totalChapters = count - 1;

                    if (totalChapters > 0) {
                        buildNavigation();
                        loadChapter(1);
                    } else {
                        contentDiv.innerHTML = `
                        <div style="text-align: center; margin-bottom: 25px;">
                            <span style="color: var(--strip-active); font-size: 24px;">[ ARCHIVE DIRECTORY EMPTY ]</span>
                        </div>
                        <div style="padding: 20px; border: 1px dashed var(--border-soft); border-radius: 8px;">
                            <strong>BACK COVER TEASER // SYSTEM LOG</strong><br><br>
                            [SCENE START]<br><br>
                            INT. NEON-LIT BUNKER IN VIENNA - NIGHT<br><br>
                            VEDRAN (LIGHTNING HORN UNICORN) hits the mechanical keyboard. Sparks fly.<br><br>
                            VEDRAN<br>
                            The chapters! Where are they?! The VHS Multiverse will collapse into a singularity of cheap 80s static!<br><br>
                            AETHER VEYLAN steps out of the shadows, spinning a glowing floppy disk on one finger.<br><br>
                            AETHER<br>
                            We didn't write them yet. We were too busy hot-gluing a lightbulb to a duck helmet.<br><br>
                            NARRATOR (V.O.)<br>
                            In a world where text files are missing, one duo must upload their stories before the 16-bit apocalypse hits. For risks and side effects, bargain with feta cheese.<br><br>
                            [SCENE END]
                        </div>`;
                    }
                }

                function buildNavigation() {
                    navDiv.innerHTML = '';
                    for (let i = 1; i <= totalChapters; i++) {
                        let numStr = i.toString().padStart(6, '0');
                        let a = document.createElement('a');
                        a.href = '#';
                        a.textContent = numStr;
                        a.addEventListener('click', (e) => {
                            e.preventDefault();
                            loadChapter(i);
                        });
                        navDiv.appendChild(a);
                    }
                }

                async function loadChapter(num) {
                    currentChapter = num;
                    
                    const links = navDiv.querySelectorAll('a');
                    links.forEach((link, index) => {
                        if (index + 1 === num) {
                            link.classList.add('current');
                        } else {
                            link.classList.remove('current');
                        }
                    });

                    contentDiv.innerHTML = '<span class="loading-text">LOADING FILE...</span>';
                    
                    let numStr = num.toString().padStart(6, '0');
                    try {
                        let response = await fetch(`chapters/${numStr}.txt`);
                        if (response.ok) {
                            let text = await response.text();
                            parseChapterText(text);
                            renderText();
                        } else {
                            contentDiv.innerHTML = "<p>FILE CORRUPTED OR MISSING.</p>";
                        }
                    } catch (error) {
                        contentDiv.innerHTML = "<p>CONNECTION ERROR.</p>";
                    }
                }

                function parseChapterText(rawText) {
                    if (rawText.includes('[ GERMAN VERSION ]')) {
                        let parts = rawText.split('[ GERMAN VERSION ]');
                        chapterData.en = parts[0].replace('[ ENGLISH VERSION ]', '').trim();
                        chapterData.de = parts[1].trim();
                    } else {
                        chapterData.en = rawText;
                        chapterData.de = "ERROR 404: GERMAN TRANSLATION NOT FOUND IN ARCHIVE.";
                    }
                }

                function renderText() {
                    let mainText = currentLang === 'en' ? chapterData.en : chapterData.de;
                    let continuedText = currentLang === 'en' ? "\n\n\n... TO BE CONTINUED ..." : "\n\n\n... FORTSETZUNG FOLGT ...";
                    contentDiv.textContent = mainText + continuedText;
                }
                
                setTimeout(scanChapters, 300);
            })();
        </script>
    </main>
</body>
</html>
