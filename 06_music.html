<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Music - LHU Content</title>
</head>
<body>
    <main>
        <!-- Spezifisches CSS nur für diese Unterseite -->
        <style>
            /* Manifesto Styles */
            .music-manifesto {
                background: var(--card-bg);
                border: 2px solid var(--border-soft);
                border-radius: var(--radius);
                padding: 30px 20px;
                margin-top: 20px;
                box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            }

            .music-manifesto h3 {
                font-size: var(--fs-md);
                color: var(--strip-active);
                margin: 1.5em 0 1em;
                text-align: center;
            }

            .music-manifesto p {
                font-size: var(--fs-sm);
                color: var(--text-muted);
                margin: 0 auto 20px auto;
                text-align: left;
                line-height: 2.2;
                max-width: 650px;
                font-family: 'VT323', monospace;
                font-size: 20px;
            }

            .music-manifesto p strong {
                color: var(--text);
                font-family: 'Press Start 2P', cursive;
                font-size: var(--fs-xs);
                letter-spacing: 0.05em;
            }

            .music-manifesto hr {
                border: 0; height: 1px; background: var(--border-soft); margin: 40px auto; width: 60%;
            }

            .tape-image {
                display: block;
                width: 100%;
                max-width: 400px;
                height: auto;
                margin: 40px auto;
                border-radius: var(--radius);
                box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
                transition: transform 0.3s;
            }

            .tape-image:hover {
                transform: scale(1.03);
            }

            @media (min-width: 769px) {
                .music-manifesto { padding: 50px; }
                .music-manifesto p { font-size: 22px; line-height: 2.0; }
            }
        </style>

        <section id="MUSIC">
            <h2 data-lang-en="MUSIC" data-lang-de="MUSIC">MUSIC</h2>

            <p data-lang-en="Would you like to support my music? Three ways: Donate, personal purchase via a meeting, or an album against PayPal proof. Afterwards you will receive a personal download token from me."
               data-lang-de="Du möchtest meine Musik unterstützen? Drei Wege: Donate (Spende), persönlicher Kauf über ein Treffen oder ein Album gegen PayPal-Nachweis. Danach erhältst du von mir einen persönlichen Download-Token."
               style="font-family: 'Press Start 2P', cursive; font-size: var(--fs-xs); color: var(--text-soft); text-align: center; margin-bottom: 20px; line-height: 2.2;">
            </p>

            <div class="music-manifesto">
                
                <h3 data-lang-en="Let's be real for a second." data-lang-de="Lass uns mal ehrlich sein.">
                    Let's be real for a second.
                </h3>

                <p data-lang-en="Thanks to everyone who didn't mind spending 25 € back then, during a personal conversation on the street between 2012 and 2016, to support me as a regional Austrian artist with a recording studio."
                   data-lang-de="Danke an alle, denen die 25 € damals, bei einem persönlichen Gespräch auf der Straße zwischen 2012 und 2016, nicht zu viel waren, um mich als regionalen österreichischen Künstler mit Tonstudio zu unterstützen.">
                </p>

                <p data-lang-en="You could have just pretended to swim through invisible water like a triathlete, gasping for air as you walked past. But instead, you were brave enough to stop."
                   data-lang-de="Ihr hättet einfach so tun können, als würdet ihr gerade wie ein Triathlet durch unsichtbares Wasser schwimmen und nach Luft schnappen, während ihr vorbeigeht. Aber ihr wart stattdessen mutig genug, stehenzubleiben.">
                </p>

                <p data-lang-en="I can't sugarcoat it anymore:"
                   data-lang-de="Ich kann es leider nicht mehr schönreden:">
                </p>

                <p data-lang-en="I increasingly observe a generation of listeners who take streaming services like 'Blobofy' for granted, believing musicians are mythical creatures who automatically get paid for their work by glowing on an app and remaining unreachable."
                   data-lang-de="Ich beobachte zunehmend eine Generation von Hörern, die Streamingdienste wie „Blobofy“ für selbstverständlich hält und glaubt, Musiker seien Fabelwesen und würden dort automatisch für ihre Arbeit bezahlt, indem sie auf einer App leuchten und unerreichbar sind.">
                </p>

                <p data-lang-en="That is not reality."
                   data-lang-de="Das ist nicht die Realität.">
                </p>

                <p data-lang-en="Indie artists are not defined by a streaming service. We sell music, merch, and handmade products. And in the end, it all seems to boil down to one question for some:"
                   data-lang-de="Indie-Künstler definieren sich nicht über einen Streamingdienst. Wir verkaufen Musik, Merch und handgefertigte Produkte. Und am Ende scheint sich bei manchen alles auf eine Frage zu reduzieren:">
                </p>

                <p data-lang-en="Why should I pay for this?"
                   data-lang-de="Warum soll ich dafür bezahlen?">
                </p>

                <p data-lang-en="I get the sentiment. In a perfect world, art would be free. Pizza would be gratis, synthesizers would fall from the sky (please no, Moog synths are heavy and make strange sounds upon impact), and rent would be free as well."
                   data-lang-de="Ich verstehe den Gedanken. In einer perfekten Welt wäre Kunst kostenlos. Pizza wäre gratis, Synthesizer würden vom Himmel fallen (bitte nicht, die Moog sind schwer und geben bei Aufprall strange Sounds) und die Miete wäre ebenfalls gratis.">
                </p>

                <p data-lang-en="But down here in reality, the magic of life simply costs money."
                   data-lang-de="Aber hier unten in der Realität kostet die Magie des Lebens nun mal Geld.">
                </p>

                <hr>

                <h3 data-lang-en="Where Did the Music Go?" data-lang-de="Wo ist die Musik geblieben?">
                    Where Did the Music Go?
                </h3>

                <p data-lang-en="For over twenty years, I partially gave my music away."
                   data-lang-de="Über zwanzig Jahre lang habe ich meine Musik teilweise verschenkt.">
                </p>

                <p data-lang-en="Because let's be honest: What musician walks up to strangers and sells them their own works?"
                   data-lang-de="Denn seien wir ehrlich: Welcher Musiker geht schon zu fremden Menschen und verkauft ihm seine eigenen Werke?">
                </p>

                <p data-lang-en="&quot;Honey, I just bought David's new Titanium record at Hofer. It rocks!&quot;"
                   data-lang-de="„Schatz, ich hab gerade beim Hofer von David die neue Titanium-Platte gekauft. Die rockt!“">
                </p>

                <p data-lang-en="What a shitty sales system."
                   data-lang-de="Was für ein beknacktes Verkaufssystem.">
                </p>

                <p data-lang-en="I admit it: That might not have been the best sales idea."
                   data-lang-de="Ich gebe es zu: Das war vielleicht nicht die beste Verkaufsidee.">
                </p>

                <p data-lang-en="But you can't choose where you start. Somewhere is better than nowhere, as long as you're not the real David who gets 30,000 € for a 30-minute DJ set."
                   data-lang-de="Aber man kann sich nicht aussuchen, wo man anfängt. Irgendwo ist besser als nirgendwo, solange man nicht der echte David ist, der für 30 Minuten DJ-Set 30.000 € bekommt.">
                </p>

                <p data-lang-en="Yet out of this system, something else emerged: artist proximity and authenticity."
                   data-lang-de="Doch aus diesem System ist etwas anderes entstanden: Künstlernähe und Authentizität.">
                </p>

                <p data-lang-en="You talked to me about the music I created. Many of you called it very good. And isn't it nice to meet someone personally who has the gift to create such things?"
                   data-lang-de="Ihr habt mit mir über die Musik gesprochen, die ich geschaffen habe. Viele von euch haben sie als sehr gut bezeichnet. Und ist es nicht schön, jemanden persönlich zu treffen, der die Gabe hat, solche Dinge zu erschaffen?">
                </p>

                <p data-lang-en="Perhaps the real meaning behind it was to inspire you so deeply that you strum three chords on the old guitar yourself."
                   data-lang-de="Vielleicht war der eigentliche Sinn dahinter, euch so stark zu inspirieren, dass ihr selbst drei Akkorde in die alte Klampfe haut.">
                </p>

                <p data-lang-en="And if you didn't know what some DJ fees look like until now: Now you know."
                   data-lang-de="Und falls ihr bisher nicht wusstet, was manche DJ-Gagen ausmachen: Jetzt wisst ihr es.">
                </p>

                <p data-lang-en="It's not just about 25 €.<br>It's about respect.<br>It's a matter of culture that Austria probably still doesn't understand."
                   data-lang-de="Es geht nicht nur um 25 €.<br>Es geht um Respekt.<br>Es geht um eine Frage der Kultur, die Österreich wahrscheinlich noch immer nicht versteht.">
                </p>

                <p data-lang-en="To this day, I don't quite understand how Vienna can celebrate itself as one of the most livable cities in the world and venerate Mozart and Falco as cultural assets, while living local artists are perceived by a significant portion of society as a nuisance rather than culture."
                   data-lang-de="Ich verstehe bis heute nicht ganz, wie Wien sich als eine der lebenswertesten Städte der Welt feiern und gleichzeitig Mozart und Falco als Kulturgut verehren kann, während lebende Künstler vor Ort von einem erheblichen Teil der Gesellschaft eher als Belästigung denn als Kultur wahrgenommen werden.">
                </p>

                <p data-lang-en="A city cannot only celebrate its artists when they are already archived."
                   data-lang-de="Eine Stadt kann ihre Künstler nicht nur feiern, wenn sie bereits archiviert sind.">
                </p>

                <p data-lang-en="When a living artist crosses your path on the street, maybe ask yourself why you choose the side that wants to get rid of them."
                   data-lang-de="Wenn euch ein lebender Künstler auf der Straße begegnet, stellt euch vielleicht einmal die Frage, warum ihr euch für die Seite entscheidet, die ihn loswerden möchte.">
                </p>

                <p data-lang-en="You don't owe anyone anything."
                   data-lang-de="Ihr seid niemandem etwas schuldig.">
                </p>

                <p data-lang-en="But ask yourselves something if you are so critical of AI:"
                   data-lang-de="Aber fragt euch dabei einmal etwas, wenn ihr so KI-kritisch seid:">
                </p>

                <p data-lang-en="Are you sure you aren't the AI yourselves in this moment?"
                   data-lang-de="Seid ihr sicher, dass ihr in diesem Moment nicht selbst die A.I. seid?">
                </p>

                <p data-lang-en="How would an artificial intelligence act if it were in your shoes?"
                   data-lang-de="Wie würde eine künstliche Intelligenz handeln, wenn sie in euren Schuhen stecken würde?">
                </p>

                <p data-lang-en="Probably it would at least listen to the first three sentences before deciding to walk past ten times ignorantly and deafly."
                   data-lang-de="Vermutlich würde sie zumindest die ersten drei Sätze anhören, bevor sie entscheidet, zehnmal ignorant und gehörlos weiterzugehen.">
                </p>

                <p data-lang-en="After all, you have a choice."
                   data-lang-de="Ihr habt schließlich die Wahl.">
                </p>

                <hr>

                <h3 data-lang-en="The AI Question" data-lang-de="Die KI-Frage">
                    The AI Question
                </h3>

                <p data-lang-en="I spend countless hours shaping every note until it matches the exact thought I want to express with a piece."
                   data-lang-de="Ich verbringe unzählige Stunden damit, jede Note so lange zu formen, bis sie genau zu dem Gedanken passt, den ich mit einem Stück ausdrücken möchte.">
                </p>

                <p data-lang-en="Sometimes a complete track emerges from my own guitar, sometimes from synthesizers, and sometimes with other tools."
                   data-lang-de="Manchmal entsteht ein kompletter Track aus meiner eigenen Gitarre, manchmal aus Synthesizern und manchmal mit anderen Werkzeugen.">
                </p>

                <p data-lang-en="For me, artificial intelligence is precisely that:<br>A tool."
                   data-lang-de="Künstliche Intelligenz ist für mich genau das:<br>Ein Hilfsmittel.">
                </p>

                <p data-lang-en="I see no point in having a complete track generated out of nowhere and subsequently presenting it as my own artistic achievement."
                   data-lang-de="Ich sehe keinen Sinn darin, einen kompletten Track aus dem Nichts erzeugen zu lassen und ihn anschließend als eigene künstlerische Leistung auszugeben.">
                </p>

                <p data-lang-en="When I create, I want to decide and shape things myself."
                   data-lang-de="Wenn ich gestalte, möchte ich selbst entscheiden und formen.">
                </p>

                <p data-lang-en="One thing is extremely important to me:"
                   data-lang-de="Mir ist dabei eine Sache extrem wichtig:">
                </p>

                <p data-lang-en="Transparency."
                   data-lang-de="Transparenz.">
                </p>

                <p data-lang-en="I will continue to use AI and not drop it just because groups online and many of you have banded together to sound the big riot drum and declare war on the robots."
                   data-lang-de="Ich werde KI weiterhin benutzen und nicht ablegen, weil sich Gruppen im Netz und viele von euch zusammengetan haben, um hier laut die große Riottrommel zu schlagen und den Kampf gegen die Roboter auszurufen.">
                </p>

                <p data-lang-en="Please leave that to Yoshima or some other fictional character."
                   data-lang-de="Das überlasst bitte Yoshima oder irgendeiner anderen fiktiven Figur.">
                </p>

                <p data-lang-en="Not using AI for ethical reasons is to me like explaining that bicycle cops would be faster on unicycles."
                   data-lang-de="KI aus ethischen Gründen grundsätzlich nicht zu benutzen, ist für mich, wie zu erklären, dass Fahrradpolizisten schneller auf Einrädern wären.">
                </p>

                <p data-lang-en="Someone is going to use AI. Then it'd better be the right people with better values. The ones who use it for the people, not for the envious or the rich who don't give a damn."
                   data-lang-de="Irgendwer wird KI benutzen. Dann sollten es besser die richtigen Leute mit besseren Werten tun. Die, die sie für die Leute benutzen und nicht für die Neider oder Reichen, die sich einen Dreck scheren.">
                </p>

                <p data-lang-en="The technology is not going to disappear."
                   data-lang-de="Die Technologie wird nicht verschwinden.">
                </p>

                <p data-lang-en="Open-source models and new tools will continue to be developed and used."
                   data-lang-de="Open-Source-Modelle und neue Werkzeuge werden weiterentwickelt und benutzt werden.">
                </p>

                <p data-lang-en="Music requires work. Sometimes spanning across nights."
                   data-lang-de="Musik braucht Arbeit. Teilweise über Nächte hinweg.">
                </p>

                <p data-lang-en="AI can spit out a suggestion for me, but it decides how it spits it out in the first place."
                   data-lang-de="KI kann mir einen Vorschlag ausspucken, aber sie entscheidet zunächst selbst, wie sie ihn ausspuckt.">
                </p>

                <p data-lang-en="And while we argue about this, major corporations will carefully evaluate where AI can replace human labor more cheaply."
                   data-lang-de="Und während wir uns darüber streiten, werden große Unternehmen genau prüfen, wo KI menschliche Arbeit billiger ersetzen kann.">
                </p>

                <p data-lang-en="Against this, it helps little to sit on a park bench with a few beers and complain that machines might eventually replace artists."
                   data-lang-de="Das ist die Realität, mit der wir uns auseinandersetzen müssen. Dagegen hilft es wenig, sich mit ein paar Bier auf eine Parkbank zu setzen und darüber zu schimpfen, dass Maschinen irgendwann Künstler ersetzen könnten.">
                </p>

                <p data-lang-en="The more interesting question is:"
                   data-lang-de="Die interessantere Frage lautet:">
                </p>

                <p data-lang-en="What do we do with the technology as long as we help decide how it is used?"
                   data-lang-de="Was machen wir mit der Technologie, solange wir mitentscheiden, wie sie eingesetzt wird?">
                </p>

                <p data-lang-en="Therefore, I don't need anyone explaining to me that AI is fundamentally unsuitable for my learning processes or creative work."
                   data-lang-de="Ich brauche deshalb niemanden, der mir erklärt, dass KI für meine Lernprozesse oder meine kreative Arbeit grundsätzlich ungeeignet sei.">
                </p>

                <p data-lang-en="That to me is nothing other than gatekeeping."
                   data-lang-de="Das wäre für mich nichts anderes als Gatekeeping.">
                </p>

                <p data-lang-en="If someone chooses not to use AI for personal, ethical, or artistic reasons, I respect that."
                   data-lang-de="Wenn jemand KI aus persönlichen, ethischen oder künstlerischen Gründen nicht verwenden möchte, respektiere ich das.">
                </p>

                <p data-lang-en="I myself run my local AI models for image, music, and text processing on my own hardware. I don't run server farms in China for that."
                   data-lang-de="Ich selbst betreibe meine lokalen KI-Modelle für Bild, Musik und Textverarbeitung auf meiner eigenen Hardware. Ich betreibe dafür keine Serverfarmen in China.">
                </p>

                <p data-lang-en="But turning that into a universal rule for everyone else is simply wrong."
                   data-lang-de="Aber daraus eine allgemeingültige Regel für alle anderen zu machen, ist schlichtweg falsch.">
                </p>

                <p data-lang-en="Rebellion for the sake of rebellion doesn't interest me."
                   data-lang-de="Rebellion um der Rebellion willen interessiert mich nicht.">
                </p>

                <hr>

                <h3 data-lang-en="The Question of Live Performance" data-lang-de="Die Frage der Liveperformance">
                    The Question of Live Performance
                </h3>

                <p data-lang-en="Because I never stopped being a musician."
                   data-lang-de="Ich habe nämlich nie aufgehört, Musiker zu sein.">
                </p>

                <p data-lang-en="With every song, I eventually ask myself:"
                   data-lang-de="Bei jedem Song stelle ich mir irgendwann die Frage:">
                </p>

                <p data-lang-en="How much of this can I actually play live?"
                   data-lang-de="Wie viel davon kann ich eigentlich live spielen?">
                </p>

                <p data-lang-en="If a song sounds fantastic, but I can't reproduce it on stage with my guitar or a sensible setup, that's a real problem for me."
                   data-lang-de="Wenn ein Song fantastisch klingt, aber ich ihn auf der Bühne nicht mit meiner Gitarre oder einem sinnvollen Setup reproduzieren kann, ist das für mich ein echtes Problem.">
                </p>

                <p data-lang-en="Generating a music catalog with AI is one thing."
                   data-lang-de="Einen Musikkatalog mit KI zu erzeugen, ist eine Sache.">
                </p>

                <p data-lang-en="Thinking a piece through musically to the point where it works on a stage is another."
                   data-lang-de="Ein Stück musikalisch so weit durchzudenken, dass es auf einer Bühne funktioniert, ist eine andere.">
                </p>

                <p data-lang-en="That requires knowing chords, understanding arrangements, building transitions, simplifying or expanding parts, and literally assembling the performance in your head."
                   data-lang-de="Dafür muss man Akkorde kennen, Arrangements verstehen, Übergänge bauen, Parts vereinfachen oder erweitern und sich die Performance regelrecht im Kopf zusammenbauen.">
                </p>

                <p data-lang-en="A good stage performance doesn't just happen because a song exists."
                   data-lang-de="Eine gute Bühnenperformance entsteht nicht einfach dadurch, dass ein Song existiert.">
                </p>

                <p data-lang-en="It costs time, rehearsals, nerves, and dedication."
                   data-lang-de="Sie kostet Zeit, Proben, Nerven und Engagement.">
                </p>

                <p data-lang-en="Above all, it requires experience."
                   data-lang-de="Vor allem aber braucht sie Erfahrung.">
                </p>

                <p data-lang-en="And eventually, it is this experience that determines what actually works on a stage."
                   data-lang-de="Und genau diese Erfahrung entscheidet irgendwann, was auf einer Bühne tatsächlich funktioniert.">
                </p>

                <p data-lang-en="We have a cultural glitch here because Mozart is commercialized."
                   data-lang-de="Wir haben einen kulturellen Knacks hier, weil Mozart kommerzialisiert ist.">
                </p>

                <p data-lang-en="Ultimately, though, he doesn't compete with you at the subway."
                   data-lang-de="Aber er konkurriert schließlich nicht mit euch bei der U-Bahn.">
                </p>

                <p data-lang-en="Nevertheless, everyone in Vienna wants his chocolate balls in their mouth, and as soon as the bass starts to FUCK, the police arrive with the biggest Bluetooth box: &quot;A LITTLE QUIETER!!! THANK YOU!!!&quot;"
                   data-lang-de="Trotzdem wollen in Wien alle seine Schokobälle im Mund haben, und sobald der Bass anfängt zu FICKEN, kommt die Polizei mit der größten Bluetooth-Box: „EIN BISSCHEN LEISER!!! DANKE!!!“">
                </p>

                <p data-lang-en="AI is just a tool."
                   data-lang-de="KI ist nur ein Werkzeug.">
                </p>

                <p data-lang-en="A camera didn't replace the painter."
                   data-lang-de="Eine Kamera hat den Maler nicht ersetzt.">
                </p>

                <p data-lang-en="For me, AI is just another brush on the canvas."
                   data-lang-de="KI ist für mich nur ein weiterer Pinsel auf der Leinwand.">
                </p>

                <p data-lang-en="And perhaps this brush can even teach us something someday. Maybe we can learn to create things independently instead of plugging the next USB stick into our brains to memorize a thousand variations of Mozart and demonstrate &quot;All My Ducklings&quot; at the next birthday party."
                   data-lang-de="Und vielleicht kann dieser Pinsel uns irgendwann sogar etwas beibringen. Vielleicht können wir damit lernen, selbstständig Dinge zu erschaffen, anstatt uns irgendwann den nächsten USB-Stick ins Gehirn zu stecken, um tausend Variationen von Mozart auswendig zu lernen und bei der nächsten Geburtstagsfeier „Alle meine Entchen“ zu demonstrieren.">
                </p>

                <p data-lang-en="Because as I have experienced it in Austria, access to learning and personal artistic development is unfortunately still heavily gatekept and kept small in its value of creation."
                   data-lang-de="Denn so, wie ich es in Österreich erlebt habe, wird der Zugang zum Lernen und zur eigenen künstlerischen Weiterentwicklung leider immer noch stark gegatekeept und kleingehalten in seinem Schöpfungswert.">
                </p>

                <p data-lang-en="People are judged by certificates, fame, and established structures."
                   data-lang-de="Menschen werden nach Zertifikaten, Bekanntheit und etablierten Strukturen beurteilt.">
                </p>

                <p data-lang-en="Here, paper sometimes seems to count more than actual ability."
                   data-lang-de="Hier scheint Papier manchmal mehr zu zählen als tatsächliches Können.">
                </p>

                <p data-lang-en="I don't believe art thrives on repeatedly reproducing what has already been declared valuable."
                   data-lang-de="Ich glaube nicht, dass Kunst davon lebt, dass wir immer wieder das reproduzieren, was bereits als wertvoll erklärt wurde.">
                </p>

                <p data-lang-en="If music has value to you, then the person sitting in the studio late at night filing away at those tracks has value too."
                   data-lang-de="Wenn Musik für dich einen Wert hat, dann hat auch der Mensch, der spät nachts im Studio sitzt und an diesen Tracks feilt, einen Wert.">
                </p>

                <p data-lang-en="You are supporting the decision that this work has value for you."
                   data-lang-de="Du unterstützt die Entscheidung, dass diese Arbeit für dich etwas wert ist.">
                </p>

                <p data-lang-en="And that decision shouldn't be taken away from you by a streaming service."
                   data-lang-de="Und diese Entscheidung sollte dir kein Streamingdienst abnehmen.">
                </p>

                <p data-lang-en="If my work speaks to you: Thank you for being here."
                   data-lang-de="Wenn meine Arbeit zu dir spricht: Danke, dass du hier bist.">
                </p>

                <p data-lang-en="And if not: Thanks as well."
                   data-lang-de="Und wenn nicht: ebenfalls danke.">
                </p>

                <p data-lang-en="Go your own way."
                   data-lang-de="Geh deinen Weg.">
                </p>

                <p data-lang-en="Thank you for your attention."
                   data-lang-de="Danke für deine Aufmerksamkeit.">
                </p>

                <p style="text-align: center; margin-top: 30px;">
                    <strong>Lightning Horn Unicorn</strong>
                </p>
            </div>

            <a href="https://www.youtube.com/watch?v=6mEqVviTbno" target="_blank" rel="noopener noreferrer">
                <img src="music_Laserette.webp" alt="Laserette" class="tape-image">
            </a>
        </section>

        <script>
            (function initMusic() {
                const lang = (navigator.language || 'en').startsWith('de') ? 'de' : 'en';
                document.querySelectorAll('[data-lang-en]').forEach(el => {
                    const text = el.getAttribute(`data-lang-${lang}`);
                    if (text) el.innerHTML = text;
                });
            })();
        </script>
    </main>
</body>
</html>
