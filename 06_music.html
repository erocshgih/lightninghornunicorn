<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Music - LHU Content</title>
</head>
<body>
    <main>
        <!-- Spezifisches CSS nur für diese Unterseite -->
        <style>
            /* Manifesto Styles */
            .music-manifesto {
                background: var(--card-bg);
                border: 2px solid var(--border-soft);
                border-radius: var(--radius);
                padding: 30px 20px;
                margin-top: 20px;
                box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            }

            .music-manifesto h3 {
                font-size: var(--fs-md);
                color: var(--strip-active);
                margin: 1.5em 0 1em;
                text-align: center;
            }

            .music-manifesto p {
                font-size: var(--fs-sm);
                color: var(--text-muted);
                margin: 0 auto 20px auto;
                text-align: left;
                line-height: 2.2;
                max-width: 650px;
                font-family: 'VT323', monospace;
                font-size: 20px;
            }

            .music-manifesto p strong {
                color: var(--text);
                font-family: 'Press Start 2P', cursive;
                font-size: var(--fs-xs);
                letter-spacing: 0.05em;
            }

            .music-manifesto hr {
                border: 0; height: 1px; background: var(--border-soft); margin: 40px auto; width: 60%;
            }

            .tape-image {
                display: block;
                width: 100%;
                max-width: 400px;
                height: auto;
                margin: 40px auto;
                border-radius: var(--radius);
                box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
                transition: transform 0.3s;
            }

            .tape-image:hover {
                transform: scale(1.03);
            }

            @media (min-width: 769px) {
                .music-manifesto { padding: 50px; }
                .music-manifesto p { font-size: 22px; line-height: 2.0; }
            }
        </style>

        <section id="MUSIC">
            <h2 data-lang-en="MUSIC" data-lang-de="MUSIC">MUSIC</h2>

            <p data-lang-en="If you'd like to support my music, click the mailbox under CONTACT to buy an album via PayPal. Only if you want to."
               data-lang-de="Wenn du meine Musik unterstützen möchtest, klick auf den Briefkasten unter KONTAKT, um ein Album via PayPal zu erwerben. Nur wenn du möchtest."
               style="font-family: 'Press Start 2P', cursive; font-size: var(--fs-xs); color: var(--text-soft); text-align: center; margin-bottom: 20px; line-height: 2.2;">
            </p>

            <div class="music-manifesto">
                
                <h3 data-lang-en="Let's be real for a second." data-lang-de="Lass uns mal ehrlich sein.">
                    Let's be real for a second.
                </h3>

                <p data-lang-en="If you've supported my art over the years—thank you. Every purchase, every kind word, and every shared link has essentially bought me the time and freedom to keep creating. You are the reason this universe expands."
                   data-lang-de="Falls du meine Kunst über die Jahre hinweg unterstützt hast – danke. Jeder Kauf, jedes nette Wort und jeder geteilte Link hat mir buchstäblich die Zeit und Freiheit gekauft, weiterzumachen. Du bist der Grund, warum dieses Universum wächst.">
                </p>

                <p data-lang-en="But if you're wondering why my music isn't simply handed out for free anymore, let's talk about the elephant in the room."
                   data-lang-de="Aber falls du dich gerade fragst, warum meine Musik hier nicht mehr einfach so gratis verteilt wird, lass uns kurz über den Elefanten im Raum sprechen.">
                </p>

                <p data-lang-en="I totally get the sentiment. In a perfect, glitch-free utopia, art would be free. Pizza would be free. Synthesizers and rent would drop from the sky at zero cost."
                   data-lang-de="Ich verstehe den Gedanken absolut. In einer perfekten, fehlerfreien Utopie wäre Kunst umsonst. Pizza wäre gratis. Synthesizer und die Miete würden einfach so vom Himmel fallen.">
                </p>

                <p data-lang-en="But down here in reality, magic costs mana."
                   data-lang-de="Aber hier unten in der Realität kostet Magie nun mal Mana.">
                </p>

                <hr>

                <h3 data-lang-en="Where Did the Music Go?" data-lang-de="Wo ist die Musik geblieben?">
                    Where Did the Music Go?
                </h3>

                <p data-lang-en="For over twenty years, I gave my music away. I tossed my tracks into the endless ocean of the internet, hoping people would just enjoy them. And many did."
                   data-lang-de="Über zwanzig Jahre lang habe ich meine Musik verschenkt. Ich habe meine Tracks in den endlosen Ozean des Internets geworfen, in der Hoffnung, dass die Leute sie einfach genießen. Und viele haben das getan.">
                </p>

                <p data-lang-en="But the landscape changed. I don't want my work to disappear inside an algorithmic void where everything is expected to be instantly available and completely worthless. I don't want to be a 3-second dopamine hit sandwiched between two ads on Spotify or YouTube."
                   data-lang-de="Aber die Landschaft hat sich verändert. Ich möchte nicht, dass meine Arbeit in einer algorithmischen Leere verschwindet, in der erwartet wird, dass alles sofort verfügbar und völlig wertlos ist. Ich möchte kein 3-Sekunden-Dopamin-Hit zwischen zwei Werbespots auf Spotify oder YouTube sein.">
                </p>

                <p data-lang-en="Music is meant to be felt. It’s meant to be valued."
                   data-lang-de="Musik soll gefühlt werden. Sie soll wertgeschätzt werden.">
                </p>

                <hr>

                <h3 data-lang-en="The AI Question" data-lang-de="Die KI-Frage">
                    The AI Question
                </h3>

                <p data-lang-en="I spend countless hours shaping every sound until it perfectly matches the chaos in my head. Sometimes I use a guitar. Sometimes synthesizers. Sometimes I use AI."
                   data-lang-de="Ich verbringe unzählige Stunden damit, jeden Klang so lange zu formen, bis er perfekt zum Chaos in meinem Kopf passt. Manchmal benutze ich eine Gitarre. Manchmal Synthesizer. Manchmal nutze ich KI.">
                </p>

                <p data-lang-en="Many people believe AI makes music by pressing a single, magical 'make a hit song' button. Let me burst that bubble: It doesn't."
                   data-lang-de="Viele glauben, KI mache Musik, indem man einen einzigen, magischen 'Mach-einen-Hit'-Knopf drückt. Lass mich diese Seifenblase platzen: Das tut sie nicht.">
                </p>

                <p data-lang-en="Creating something that actually means something still requires taste, composition, structure, and thousands of creative decisions. A synthesizer didn't replace the musician in the 80s. A camera didn't replace the painter. AI is just another brush on the canvas."
                   data-lang-de="Etwas zu erschaffen, das auch wirklich eine Bedeutung hat, erfordert weiterhin Geschmack, Komposition, Struktur und tausende kreative Entscheidungen. Ein Synthesizer hat in den 80ern den Musiker nicht ersetzt. Eine Kamera hat den Maler nicht ersetzt. KI ist nur ein weiterer Pinsel auf der Leinwand.">
                </p>

                <p data-lang-en="<strong>The tool evolves.<br>The artist remains.</strong>"
                   data-lang-de="<strong>Das Werkzeug entwickelt sich weiter.<br>Der Künstler bleibt.</strong>">
                </p>

                <hr>

                <h3 data-lang-en="Support the Madness" data-lang-de="Support the Madness">
                    Support the Madness
                </h3>

                <p data-lang-en="Creating art takes time, energy, and a ridiculous amount of coffee. If music has value to you, then the person sitting in the studio late at night bleeding over those tracks has value too."
                   data-lang-de="Kunst zu erschaffen kostet Zeit, Energie und lächerlich viel Kaffee. Wenn Musik für dich einen Wert hat, dann hat auch der Mensch, der spätnachts im Studio sitzt und an diesen Tracks feilt, einen Wert.">
                </p>

                <p data-lang-en="Buying an album doesn't just buy you a few MP3 files. It funds the next crazy idea. The next prototype. The next chapter of this universe."
                   data-lang-de="Mit dem Kauf eines Albums erwirbst du nicht nur ein paar MP3-Dateien. Du finanzierst die nächste verrückte Idee. Den nächsten Prototypen. Das nächste Kapitel dieses Universums.">
                </p>

                <p data-lang-en="If my work speaks to you, thank you for being here. If you decide to financially support an independent artist today: You rock. Literally."
                   data-lang-de="Wenn meine Arbeit zu dir spricht: Danke, dass du hier bist. Falls du dich entscheidest, heute einen unabhängigen Künstler finanziell zu unterstützen: Du rockst. Buchstäblich.">
                </p>

                <p data-lang-en="Either way... keep your ears open."
                   data-lang-de="So oder so... halt die Ohren offen.">
                </p>

                <p style="text-align: center; margin-top: 30px;">
                    <strong>Lightning Horn Unicorn</strong>
                </p>
            </div>

            <a href="https://www.youtube.com/watch?v=6mEqVviTbno" target="_blank" rel="noopener noreferrer">
                <img src="music_Laserette.webp" alt="Laserette" class="tape-image">
            </a>
        </section>

        <script>
            (function initMusic() {
                const lang = (navigator.language || 'en').startsWith('de') ? 'de' : 'en';
                document.querySelectorAll('[data-lang-en]').forEach(el => {
                    const text = el.getAttribute(`data-lang-${lang}`);
                    if (text) el.innerHTML = text;
                });
            })();
        </script>
    </main>
</body>
</html>
