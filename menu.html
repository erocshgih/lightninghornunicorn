<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Humanart - LHU Content</title>
</head>
<body>
    <main>
        <!-- Spezifisches CSS & Bibliotheken für die 3D Humanart-Seite -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

        <style>
            /* Spezifische Variablen & Stile für Humanart */
            :root {
                --accent-red: #e02424;
                --accent-blue: #1a73e8;
            }

            html[data-theme="dark"] { --accent-red: #ff4d4d; --accent-blue: #3b82f6; }
            html[data-theme="mono-gray"] { --accent-red: #aaaaaa; --accent-blue: #cccccc; }
            html[data-theme="mono-green"] { --accent-red: #39ff14; --accent-blue: #b6ffb6; }
            html[data-theme="crt"] { --accent-red: #ff9999; --accent-blue: #99ccff; }

            /* 3D CONTAINER */
            #three-container {
                width: 100%;
                height: 55vh;
                min-height: 400px;
                cursor: grab;
                margin: 0 auto 30px auto; 
                position: relative;
                background: transparent;
            }
            #three-container:active {
                cursor: grabbing;
            }
            
            /* Loading-Text für den 3D Container */
            .loading-text {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                font-size: var(--fs-xs, 0.5rem);
                color: var(--accent-blue);
                text-shadow: 0 0 10px rgba(26, 115, 232, 0.5);
                animation: pulse 1s infinite alternate;
                z-index: 10;
                pointer-events: none;
            }
            @keyframes pulse { from { opacity: 0.4; } to { opacity: 1; } }

            .atom-disclaimer {
                font-size: 0.65rem !important; 
                margin-top: 15px;
                margin-bottom: 25px;
                color: var(--accent-blue) !important;
                letter-spacing: 2px;
                text-align: center !important;
                text-shadow: 0 0 10px rgba(26, 115, 232, 0.5); 
            }

            @media (min-width: 769px) {
                #three-container { height: 65vh; margin-bottom: 40px; }
            }

            @media (max-width: 480px) {
                #three-container { height: 45vh; }
            }
        </style>

        <section id="HUMANART">
            <h2 data-lang-en="HUMANART" data-lang-de="HUMANART">HUMANART</h2>

            <div id="three-container">
                <div id="three-loader" class="loading-text">RENDERING ARTWORK... 0%</div>
            </div>
            
            <p class="atom-disclaimer">
                ART BY VEDRAN LUKIC : everything is connected...
            </p>

            <p data-lang-en="Explore the beauty of Human Art, entirely crafted by me.<br><br>Each piece starts with my <span style='color: var(--accent-red); font-weight: bold;'>original ideas</span> and is brought to life with careful attention. Using both digital tools and traditional methods, I often work with pencils and minimal color, focusing on <span style='color: var(--accent-blue);'>simplicity and elegance</span>.<br><br>When I add color, it's to create a special touch.<br><br><span style='color: var(--accent-red);'>Enjoy the purity of handcrafted art.</span>"
               data-lang-de="Erkunde die Schönheit der menschlichen Kunst, vollständig von mir gestaltet.<br><br>Jedes Stück beginnt mit meinen <span style='color: var(--accent-red); font-weight: bold;'>originellen Ideen</span> und wird mit Sorgfalt zum Leben erweckt. Ich arbeite sowohl mit digitalen Werkzeugen als auch mit traditionellen Methoden, oft mit Bleistift und minimaler Farbe, wobei der Schwerpunkt auf <span style='color: var(--accent-blue);'>Einfachheit und Eleganz</span> liegt.<br><br>Wenn ich Farbe hinzufüge, geschieht dies, um einen besonderen Akzent zu setzen.<br><br><span style='color: var(--accent-red);'>Genieße die Reinheit handgefertigter Kunst.</span>">
            </p>

            <!-- BILDER-DATENBANK FÜR DIE 3D-KUGEL -->
            <div id="image-data-source" style="display: none;" aria-hidden="true">
                <span data-src="humanart/mynameisrain.webp"></span>
                <span data-src="humanart/candle.webp"></span>
                <span data-src="humanart/rainbowonyx.webp"></span>
                <span data-src="humanart/clown.webp"></span>
                <span data-src="humanart/bigwavecube.webp"></span>
                <span data-src="humanart/bananismagainstgorillas.webp"></span>
                <span data-src="humanart/augapfel.webp"></span>
                <span data-src="humanart/apffel2.webp"></span>
                <span data-src="humanart/acircleofcolors.webp"></span>
                <span data-src="humanart/eagletriangle.webp"></span>
                <span data-src="humanart/face001.webp"></span>
                <span data-src="humanart/girlwithseashell.webp"></span>
                <span data-src="humanart/blackmountainlandscape.webp"></span>
                <span data-src="humanart/chillin.webp"></span>
            </div>
        </section>

        <script>
            // 3D-Engine Initialisierung für das Menü-System
            (function initThreeJsCradle() {
                const container = document.getElementById('three-container');
                const loaderText = document.getElementById('three-loader');
                if (!container || typeof THREE === 'undefined') return;

                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
                
                const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
                renderer.setSize(container.clientWidth, container.clientHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                container.appendChild(renderer.domElement);

                const controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.dampingFactor = 0.05;
                controls.enablePan = false;
                controls.minDistance = 20;
                controls.maxDistance = 350;

                const sourceNodes = document.querySelectorAll('#image-data-source span');
                const imageUrls = Array.from(sourceNodes).map(node => node.getAttribute('data-src'));

                const nodesData = [];
                const radius = 80;

                for(let index = 0; index < imageUrls.length; index++) {
                    const phi = Math.acos(-1 + (2 * index) / imageUrls.length);
                    const theta = Math.sqrt(imageUrls.length * Math.PI) * phi;
                    nodesData.push(new THREE.Vector3(
                        radius * Math.sin(phi) * Math.cos(theta),
                        radius * Math.sin(phi) * Math.sin(theta),
                        radius * Math.cos(phi)
                    ));
                }

                camera.position.set(0, 0, 220);

                const manager = new THREE.LoadingManager();
                manager.onProgress = function (url, itemsLoaded, itemsTotal) {
                    if (loaderText) {
                        loaderText.innerText = `RENDERING ARTWORK... ${Math.round((itemsLoaded / itemsTotal) * 100)}%`;
                    }
                };
                manager.onLoad = function () {
                    if (loaderText) {
                        loaderText.style.display = 'none';
                    }
                };

                const textureLoader = new THREE.TextureLoader(manager);

                imageUrls.forEach((url, i) => {
                    textureLoader.load(url, (texture) => {
                        const aspect = texture.image.width / texture.image.height;
                        const material = new THREE.SpriteMaterial({ map: texture, depthTest: false }); 
                        const sprite = new THREE.Sprite(material);
                        
                        const baseSize = 30;
                        sprite.scale.set(baseSize * (aspect > 1 ? aspect : 1), baseSize * (aspect < 1 ? 1/aspect : 1), 1);
                        sprite.position.copy(nodesData[i]);
                        scene.add(sprite);
                    });
                });

                let animationFrameId;
                function animate() {
                    animationFrameId = requestAnimationFrame(animate);
                    scene.rotation.y -= 0.0005;
                    scene.rotation.x -= 0.0002;
                    controls.update();
                    renderer.render(scene, camera);
                }
                animate();

                window.addEventListener('resize', () => {
                    if (!container.clientWidth) return;
                    const width = container.clientWidth;
                    const height = container.clientHeight;
                    renderer.setSize(width, height);
                    camera.aspect = width / height;
                    camera.updateProjectionMatrix();
                });
            })();
        </script>
    </main>
</body>
</html>
