<style>
  :root {
    --text: #f3f4f8;
    --muted: rgba(243, 244, 248, 0.6);
    --accent: #8fd9fb;
  }

  * { box-sizing: border-box; }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #04050a;
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* --- INTRO --- */
  #lhu-intro {
    position: fixed;
    inset: 0;
    z-index: 100000;
    overflow: hidden;
    background: #000;
    opacity: 1;
    transition: opacity .22s ease;
    pointer-events: auto;
  }
  #lhu-intro-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  #lhu-intro-vignette {
    position: absolute;
    inset: -10%;
    background: radial-gradient(circle at 50% 50%, transparent 0 27%, rgba(0,0,0,.28) 55%, rgba(0,0,0,.96) 100%);
    mix-blend-mode: multiply;
  }
  #lhu-enter-panel {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    z-index: 5;
    width: min(82vw, 420px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }
  #lhu-image-slot {
    width: min(68vw, 300px);
    aspect-ratio: 1 / 1;
    position: relative;
    overflow: hidden;
  }
  #lhu-image-slot canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  #lhu-enter-panel.hidden {
    opacity: 0;
    pointer-events: none;
    transition: opacity .15s ease;
  }
  
  #lhu-intro-word {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    perspective: 900px;
    font-family: Impact, sans-serif;
    font-weight: 900;
    letter-spacing: .12em;
    color: white;
    text-shadow: 0 0 8px rgba(255,255,255,.95), 0 0 25px rgba(80,210,255,.8), 0 0 55px rgba(170,60,255,.65);
    opacity: 0;
  }
  
  #lhu-intro-word > span {
    display: block;
    line-height: .82;
    transform-style: preserve-3d;
    will-change: transform, opacity, letter-spacing, filter;
  }
  #lhu-intro-word > span:nth-child(1) { font-size: clamp(32px, 8vw, 110px); }
  #lhu-intro-word > span:nth-child(2) { font-size: clamp(26px, 6vw, 82px); }
  #lhu-intro-word > span:nth-child(3) { font-size: clamp(34px, 9vw, 120px); }
  
  #lhu-intro.flash { background: #fff; }
  #lhu-intro.flash #lhu-intro-word { opacity: 0; }

  /* Pill Buttons */
  #lhu-pill-buttons { display:flex; justify-content:center; align-items:center; gap:22px; width:min(88vw,420px); }
  .lhu-pill {
    width:94px; height:94px; border-radius:50%;
    border:3px solid rgba(210,210,210,.65); cursor:pointer;
    box-shadow:inset 0 0 0 4px rgba(0,0,0,.35), inset 0 8px 16px rgba(255,255,255,.18);
    transition:transform .12s ease;
  }
  .lhu-pill:hover { transform:scale(1.04); }
  .lhu-pill:active { transform:scale(.96); }
  .lhu-pill-red { background:radial-gradient(circle at 34% 27%,#ff9b9b 0 7%,#e33131 28%,#8d0909 72%,#390000 100%); }
  .lhu-pill-yellow { background:radial-gradient(circle at 34% 27%,#fff4a0 0 7%,#f0c51f 28%,#9c7800 72%,#3e3000 100%); }
  .lhu-pill-blue { background:radial-gradient(circle at 34% 27%,#9edcff 0 7%,#2587db 28%,#0c397c 72%,#00162f 100%); }
  
  #lhu-intro.lhu-intro-red #lhu-intro-vignette { background:radial-gradient(circle at center,rgba(255,20,20,.14),rgba(90,0,0,.56) 68%,rgba(0,0,0,.94)); }
  #lhu-intro.lhu-intro-yellow #lhu-intro-vignette { background:radial-gradient(circle at center,rgba(255,220,30,.14),rgba(100,80,0,.48) 68%,rgba(0,0,0,.94)); }
  #lhu-intro.lhu-intro-blue #lhu-intro-vignette { background:radial-gradient(circle at center,rgba(30,120,255,.16),rgba(0,30,100,.52) 68%,rgba(0,0,0,.94)); }

  /* --- Z-INDEX THEATER --- */
  #matrix-bg { position: fixed; inset: 0; z-index: 1; display: block; transition: opacity 0.4s ease; opacity: 1; }
  #heart-emojis, #rainbow-emojis { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 2; display: none; }
  #shmup-container { position: fixed; inset: 0; pointer-events: none; z-index: 3; display: none; }
  #rainbow-aura { position: fixed; pointer-events: none; z-index: 4; display: none; }
  #container3D { position: relative; width: 100%; height: 100vh; height: 100dvh; z-index: 5; touch-action: none; }
  #ui-wrapper { position: fixed; top: max(54px, calc(env(safe-area-inset-top) + 44px)); left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 10px; }
  #head-menu { position: fixed; bottom: max(16px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); z-index: 10; width: min(92vw, 460px); }
  #effect-buttons { position: fixed; bottom: max(82px, calc(env(safe-area-inset-bottom) + 70px)); left: 50%; transform: translateX(-50%); z-index: 11; display: flex; gap: 10px; }

  #container3D canvas { display: block; }

  /* --- UI STYLING --- */
  .glass { background: rgba(0, 0, 0, 0.7); border: 1px solid rgba(255, 255, 255, 0.2); color: var(--text); border-radius: 4px; }
  .btn { padding: 10px 18px; font-size: clamp(13px, 3.6vw, 16px); font-weight: 600; text-transform: uppercase; cursor: pointer; transition: background 0.15s ease; }
  .btn:hover { background: rgba(255, 255, 255, 0.15); }
  #head-select { width: 100%; padding: 15px 20px; font-size: clamp(14px, 3.8vw, 17px); text-align: center; text-align-last: center; cursor: pointer; appearance: none; }
  #head-select option { color: #111; }
  .effect-btn { min-width: 58px; height: 48px; font-size: 24px; line-height: 1; }

  #loading { position: fixed; inset: 0; z-index: 100001; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; pointer-events: none; color: var(--text); font-size: 13px; letter-spacing: 0.22em; text-transform: uppercase; }
  #loading.show { display: flex; }
  .spinner { width: 54px; height: 54px; background: conic-gradient(from 0deg, transparent, var(--accent)); -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 0); mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 0); animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* --- EFFECTS --- */
  #rainbow-aura { left: 50%; top: 50%; width: min(48vw, 360px); height: min(48vw, 360px); transform: translate(-50%, -50%); border-radius: 50%; background: conic-gradient(from 0deg, #ff3030, #ffd52e, #40ff70, #30d8ff, #7655ff, #ff35b8, #ff3030); opacity: 0.15; }
  #rainbow-aura.active { display: block; animation: rainbowAura 0.55s linear infinite; }
  @keyframes rainbowAura { from { transform: translate(-50%, -50%) rotate(0deg) scale(0.78); opacity: 0.05; } 50% { transform: translate(-50%, -50%) rotate(180deg) scale(1.08); opacity: 0.18; } to { transform: translate(-50%, -50%) rotate(360deg) scale(0.78); opacity: 0.05; } }

  /* SHMUP MULTI-LASER SYSTEM */
  .shmup-center { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
  .shmup-beam { position: absolute; top: -8px; height: 16px; width: 45vw; border-radius: 8px; opacity: 0; }
  .shmup-beam.right { left: 0; transform-origin: left center; background: linear-gradient(90deg, #fff, #ff3030, #ff9d21, transparent); animation: fireRight var(--speed) linear infinite; animation-delay: var(--delay); }
  .shmup-beam.left { right: 0; transform-origin: right center; background: linear-gradient(-90deg, #fff, #ff3030, #ff9d21, transparent); animation: fireLeft var(--speed) linear infinite; animation-delay: var(--delay); }
  @keyframes fireRight { 0% { transform: rotate(var(--angle)) translateX(5vw) scaleX(0.2); opacity: 1; filter: hue-rotate(0deg); } 100% { transform: rotate(var(--angle)) translateX(50vw) scaleX(1); opacity: 0; filter: hue-rotate(360deg); } }
  @keyframes fireLeft { 0% { transform: rotate(var(--angle)) translateX(-5vw) scaleX(0.2); opacity: 1; filter: hue-rotate(0deg); } 100% { transform: rotate(var(--angle)) translateX(-50vw) scaleX(1); opacity: 0; filter: hue-rotate(360deg); } }

  /* EMOJI SYSTEM */
  #heart-emojis.active, #rainbow-emojis.active { display: block; }
  .fast-rise-emoji { position: absolute; bottom: -15vh; left: var(--left); font-size: var(--size); opacity: 0; animation: riseFast var(--dur) linear var(--delay) infinite; will-change: transform, opacity; }
  @keyframes riseFast { 0% { transform: translate3d(0, 0, 0) scale(0.8); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translate3d(var(--drift), -120vh, 0) scale(1.2); opacity: 0; } }

  @media (max-width: 600px) { #effect-buttons { bottom: max(76px, calc(env(safe-area-inset-bottom) + 64px)); } }
</style>

<script>
  /* 1. MATRIX RAIN SCRIPT */
  const mcanvas = document.getElementById("matrix-bg");
  const mctx = mcanvas.getContext("2d");
  let cols, drops, hues, speeds, sizes, fontSize;

  function setupMatrix() {
    mcanvas.width = innerWidth; mcanvas.height = innerHeight;
    fontSize = Math.max(40, Math.round(innerWidth / 18));
    cols = Math.ceil(innerWidth / fontSize);
    drops = new Array(cols); hues = new Array(cols); speeds = new Array(cols); sizes = new Array(cols);
    for (let i = 0; i < cols; i++) {
      drops[i] = Math.random() * (innerHeight / fontSize);
      hues[i] = Math.floor(Math.random() * 360);
      speeds[i] = 0.12 + Math.random() * 0.16;
      sizes[i] = 0.55 + Math.random() * 1.25;
    }
  }
  setupMatrix();

  function drawMatrix() {
    mctx.clearRect(0, 0, mcanvas.width, mcanvas.height);
    for (let i = 0; i < cols; i++) {
      drops[i] += speeds[i];
      const y = mcanvas.height - drops[i] * fontSize;
      let size = fontSize * sizes[i];
      mctx.font = size + "px monospace";
      const x = i * fontSize;
      let glitchOffset = 0;
      if (Math.random() > 0.85) glitchOffset = (Math.random() - 0.5) * 6;
      mctx.fillStyle = "rgba(0, 255, 255, 0.35)"; mctx.fillText("7", x - 3 + glitchOffset, y);
      mctx.fillStyle = "rgba(255, 0, 255, 0.35)"; mctx.fillText("7", x + 3 - glitchOffset, y);
      mctx.fillStyle = "hsl(" + hues[i] + ", 100%, 82%)"; mctx.fillText("7", x, y);
      hues[i] = (hues[i] + 0.12) % 360;
      if (y < -size && Math.random() > 0.97) { drops[i] = 0; hues[i] = Math.floor(Math.random() * 360); }
    }
    requestAnimationFrame(drawMatrix);
  }
  drawMatrix(); window.addEventListener("resize", setupMatrix);
</script>

<script type="module">
  /* 2. THREE.JS & APP LOGIC */
  import * as THREE from "https://esm.sh/three@0.160.0";
  import { OrbitControls } from "https://esm.sh/three@0.160.0/examples/jsm/controls/OrbitControls.js";
  import { GLTFLoader } from "https://esm.sh/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";
  import { DRACOLoader } from "https://esm.sh/three@0.160.0/examples/jsm/loaders/DRACOLoader.js";

  const MODELS = [
    { label: "unibrowserloadicorn", url: "https://raw.githubusercontent.com/erocshgih/lightninghornunicorn/main/glb/unibrowserloadicorn.glb" },
    { label: "uniturnoeyeballhorn", url: "https://raw.githubusercontent.com/erocshgih/lightninghornunicorn/main/glb/uniturnoeyeballhorn.glb" },
    { label: "duckybulbywaterhorn", url: "https://raw.githubusercontent.com/erocshgih/lightninghornunicorn/main/glb/duckybulbywaterhorn.glb" },
    { label: "obesewarrior", url: "https://raw.githubusercontent.com/erocshgih/lightninghornunicorn/main/glb/obesewarrior.glb" },
    { label: "askflamongostache", url: "https://raw.githubusercontent.com/erocshgih/lightninghornunicorn/main/glb/askflamongostache.glb" }
  ];

  const loadingEl = document.getElementById("loading");
  function startLoading() { loadingEl.classList.add("show"); }
  function stopLoading() { loadingEl.classList.remove("show"); }

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 1000); camera.position.set(2.6, 0, 2.6);
  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: false }); renderer.setPixelRatio(1); renderer.setSize(innerWidth, innerHeight); renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.getElementById("container3D").appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 0.9));
  const key = new THREE.DirectionalLight(0xffffff, 0.8); key.position.set(5, 5, 5); scene.add(key);
  const fill = new THREE.DirectionalLight(0xffffff, 1.2); fill.position.set(-5, 2, 5); scene.add(fill);
  const rim = new THREE.DirectionalLight(0xffffff, 0.7); rim.position.set(-3, 5, -5); scene.add(rim);

  const dracoLoader = new DRACOLoader(); dracoLoader.setDecoderPath("https://www.gstatic.com/draco/v1/decoders/");
  const loader = new GLTFLoader(); loader.setDRACOLoader(dracoLoader);

  const hitEnterSlot = document.getElementById("lhu-image-slot");
  const hitEnterScene = new THREE.Scene();
  const hitEnterCamera = new THREE.PerspectiveCamera(32, 1, 0.01, 100);
  const hitEnterRenderer = new THREE.WebGLRenderer({ alpha: true, antialias: false, powerPreference: "low-power" });
  hitEnterRenderer.setPixelRatio(1); hitEnterRenderer.setClearColor(0x000000, 0); hitEnterRenderer.outputColorSpace = THREE.SRGBColorSpace;
  hitEnterSlot.appendChild(hitEnterRenderer.domElement);
  
  hitEnterScene.add(new THREE.AmbientLight(0xffffff, 2.0)); hitEnterScene.add(new THREE.HemisphereLight(0xffffff, 0x222222, 1.8));
  const hitKey = new THREE.DirectionalLight(0xffffff, 3.0); hitKey.position.set(3, 5, 6); hitEnterScene.add(hitKey);
  const hitFill = new THREE.DirectionalLight(0xaac8ff, 1.8); hitFill.position.set(-5, 2, 4); hitEnterScene.add(hitFill);
  const hitRim = new THREE.DirectionalLight(0xffffff, 2.2); hitRim.position.set(0, 3, -5); hitEnterScene.add(hitRim);
  
  let hitEnterObject = null, hitEnterMixer = null;

  function fitHitEnterModel(model) {
    const box = new THREE.Box3().setFromObject(model); const center = box.getCenter(new THREE.Vector3()); const size = box.getSize(new THREE.Vector3()); const maxSize = Math.max(size.x, size.y, size.z, 0.001);
    model.position.sub(center); model.position.y += size.y * 0.02;
    const fovRad = THREE.MathUtils.degToRad(hitEnterCamera.fov); const distance = (maxSize * 0.62) / Math.tan(fovRad / 2);
    hitEnterCamera.position.set(0, maxSize * 0.08, Math.max(distance, 0.35)); hitEnterCamera.lookAt(0, size.y * 0.02, 0); hitEnterCamera.near = Math.max(0.01, maxSize / 100); hitEnterCamera.far = Math.max(10, maxSize * 20); hitEnterCamera.updateProjectionMatrix();
  }

  loader.load("https://raw.githubusercontent.com/erocshgih/lightninghornunicorn/main/glb/hitenter.glb", (g) => {
    hitEnterObject = g.scene;
    hitEnterObject.traverse((child) => {
      if (!child.isMesh || !child.material) return;
      const materials = Array.isArray(child.material) ? child.material : [child.material];
      materials.forEach((mat) => { if ("envMapIntensity" in mat) mat.envMapIntensity = 1.5; if ("roughness" in mat && mat.roughness > 0.75) mat.roughness = 0.58; if ("emissive" in mat) { mat.emissive.setRGB(0.055, 0.055, 0.055); mat.emissiveIntensity = 0.35; } });
    });
    hitEnterScene.add(hitEnterObject); fitHitEnterModel(hitEnterObject);
    if (g.animations.length) { hitEnterMixer = new THREE.AnimationMixer(hitEnterObject); g.animations.forEach(clip => hitEnterMixer.clipAction(clip).play()); }
  });

  const hitEnterResizeObserver = new ResizeObserver(() => {
    const rect = hitEnterSlot.getBoundingClientRect(); const w = Math.max(1, Math.floor(rect.width)); const h = Math.max(1, Math.floor(rect.height));
    hitEnterRenderer.setSize(w, h, false); hitEnterCamera.aspect = w / h; hitEnterCamera.updateProjectionMatrix();
  });
  hitEnterResizeObserver.observe(hitEnterSlot);

  let object = null, mixer = null; const clock = new THREE.Clock();

  function loadHead(url) {
    startLoading(); if (object) scene.remove(object); if (mixer) mixer.stopAllAction();
    loader.load(url, (g) => { object = g.scene; scene.add(object); if (g.animations.length) { mixer = new THREE.AnimationMixer(object); g.animations.forEach(clip => mixer.clipAction(clip).play()); } stopLoading(); });
  }

  const controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping = true; controls.dampingFactor = 0.08; controls.autoRotate = true; controls.autoRotateSpeed = 1.2;

  let musicOn = false; const music = document.getElementById("background-music");
  document.getElementById("music-toggle").onclick = () => { musicOn = !musicOn; musicOn ? music.play().catch(()=>{}) : music.pause(); document.getElementById("music-toggle").textContent = musicOn ? "Stop Music" : "Play Music"; };
  document.getElementById("navigate-to-main").onclick = () => { location.href = "https://erocshgih.github.io/lightninghornunicorn/LightningHornUnicorn.html"; };

  let gagActive = false, gagStart = 0, gagBase = null, gagSize = new THREE.Vector3(), camTween = null;
  let rainbowActive = false, rainbowStart = 0, rainbowBaseRot = null, rainbowBasePos = null, rainbowBaseScale = null; 
  let rainbowMatStates = [];

  function tweenCamera(toPos, toTarget, dur, onDone) {
    camTween = { fromPos: camera.position.clone(), toPos: toPos.clone(), fromTarget: controls.target.clone(), toTarget: toTarget.clone(), start: performance.now(), dur, onDone }; controls.enabled = false; controls.autoRotate = false;
  }

  document.getElementById("heart-btn").onclick = () => {
    if (!object || gagActive || rainbowActive) return; music.pause(); musicOn = false; document.getElementById("music-toggle").textContent = "Play Music";
    gagActive = true; gagStart = performance.now(); gagBase = object.position.clone();
    document.getElementById("matrix-bg").style.opacity = "0";
    const box = new THREE.Box3().setFromObject(object); box.getSize(gagSize); const center = new THREE.Vector3(); box.getCenter(center);
    const eye = new THREE.Vector3(center.x, box.max.y - gagSize.y * 0.12, center.z + gagSize.z * 0.1);
    const closePos = eye.clone().add(new THREE.Vector3(gagSize.x * 0.25, gagSize.y * 0.02, gagSize.z * 0.55 + gagSize.length() * 0.35));
    tweenCamera(closePos, eye, 650);
    document.getElementById("heart-emojis").classList.add("active");
    const sndWolf = document.getElementById("snd-wolf"); const sndRizz = document.getElementById("snd-rizz"); sndWolf.currentTime = 0; sndWolf.play().catch(()=>{}); sndWolf.onended = () => { sndRizz.currentTime = 0; sndRizz.play().catch(endGag); sndRizz.onended = endGag; }; setTimeout(endGag, 9000);
  };

  function endGag() {
    if (gagBase) object.position.copy(gagBase); object.rotation.set(0,0,0); gagActive = false; document.getElementById("heart-emojis").classList.remove("active"); document.getElementById("matrix-bg").style.opacity = "1"; tweenCamera(new THREE.Vector3(2.6, 0, 2.6), new THREE.Vector3(0, 0, 0), 700, () => controls.autoRotate = true);
  }

  document.getElementById("rainbow-btn").onclick = () => {
    if (!object || gagActive || rainbowActive) return; music.pause(); musicOn = false; document.getElementById("music-toggle").textContent = "Play Music";
    rainbowActive = true; rainbowStart = performance.now(); 
    rainbowBaseRot = object.rotation.clone(); 
    rainbowBasePos = object.position.clone();
    rainbowBaseScale = object.scale.clone();
    
    document.getElementById("matrix-bg").style.opacity = "0";
    rainbowMatStates = []; object.traverse(c => { if (c.isMesh && c.material) { const mats = Array.isArray(c.material) ? c.material : [c.material]; mats.forEach(m => { if (m.emissive) rainbowMatStates.push({ mat: m, col: m.emissive.clone(), int: m.emissiveIntensity }); }); } });
    document.getElementById("rainbow-aura").classList.add("active"); document.getElementById("rainbow-emojis").classList.add("active");
    
    const box = new THREE.Box3().setFromObject(object); box.getSize(gagSize); const center = new THREE.Vector3(); box.getCenter(center); const maxDim = Math.max(gagSize.x, gagSize.y, gagSize.z); 
    tweenCamera(new THREE.Vector3(0, center.y, maxDim * 2.3), center, 450);
    
    const snd = document.getElementById("snd-rainbow"); snd.currentTime = 0; snd.play().catch(()=>{}); controls.enabled = false; controls.autoRotate = false;
  };

  function endRainbow() {
    rainbowActive = false; 
    if (rainbowBaseRot) object.rotation.copy(rainbowBaseRot); 
    if (rainbowBasePos) object.position.copy(rainbowBasePos); 
    if (rainbowBaseScale) object.scale.copy(rainbowBaseScale); 
    rainbowBasePos = null; 
    rainbowMatStates.forEach(s => { s.mat.emissive.copy(s.col); s.mat.emissiveIntensity = s.int; }); 
    
    document.getElementById("rainbow-aura").classList.remove("active"); 
    document.getElementById("rainbow-emojis").classList.remove("active"); 
    document.getElementById("shmup-container").style.display = "none"; 
    document.getElementById("matrix-bg").style.opacity = "1"; 
    
    const centerPoint = document.querySelector(".shmup-center");
    if(centerPoint) { centerPoint.style.left = "50%"; centerPoint.style.top = "50%"; }
    
    controls.enabled = true; controls.autoRotate = true; 
    tweenCamera(new THREE.Vector3(2.6, 0, 2.6), new THREE.Vector3(0, 0, 0), 700, () => controls.autoRotate = true);
  }

  function spawnEmojis(containerId, char, count, sizeBase, sizeVar) {
    const container = document.getElementById(containerId);
    for (let i = 0; i < count; i++) {
      const e = document.createElement("span"); e.className = "fast-rise-emoji"; e.textContent = char; e.style.setProperty("--left", `${Math.random() * 100}%`); e.style.setProperty("--size", `${sizeBase + Math.random() * sizeVar}px`); e.style.setProperty("--dur", `${0.15 + Math.random() * 0.25}s`); e.style.setProperty("--delay", `${-Math.random() * 2}s`); e.style.setProperty("--drift", `${(Math.random() - 0.5) * 60}px`); container.appendChild(e);
    }
  }
  
  spawnEmojis("heart-emojis", "❤️", 30, 60, 40); spawnEmojis("rainbow-emojis", "🌈", 40, 30, 20);

  const selectEl = document.getElementById("head-select");
  MODELS.forEach(m => { const opt = document.createElement("option"); opt.value = m.url; opt.textContent = m.label; selectEl.appendChild(opt); });
  selectEl.addEventListener("change", (e) => loadHead(e.target.value)); loadHead(MODELS[0].url);

  /* 3. DYNAMISCHE INTRO LOGIK */
  (() => {
    const intro = document.getElementById("lhu-intro");
    const audio = document.getElementById("lhu-intro-audio");
    const canvas = document.getElementById("lhu-intro-canvas");
    const ctx = canvas.getContext("2d");
    const word = document.getElementById("lhu-intro-word");
    const lines = [...word.querySelectorAll("span")];
    
    let W = 0, H = 0, introStart = 0;
    let introVariant = "yellow"; 
    
    const variantColors = {
      red: { color: "#ff3333", bg: "linear-gradient(180deg, #ff9999 0%, #ff3333 24%, #cc0000 48%, #ff6666 68%, #ff3333 100%)", shadow: "rgba(255,50,50,.75)" },
      yellow: { color: "#ffd400", bg: "linear-gradient(180deg, #fff6a0 0%, #ffd400 24%, #ff9d00 48%, #fff04a 68%, #ffd400 100%)", shadow: "rgba(255,212,0,.75)" },
      blue: { color: "#33bbff", bg: "linear-gradient(180deg, #99ddff 0%, #33bbff 24%, #0077cc 48%, #66ccff 68%, #33bbff 100%)", shadow: "rgba(50,180,255,.75)" }
    };
    
    function resizeIntro() { W = innerWidth; H = innerHeight; canvas.width = W; canvas.height = H; }
    
    function animateIntro(now) {
      const t = (now - introStart) / 1000 / 2;
      ctx.clearRect(0, 0, W, H);
      
      const textT = Math.max(0, Math.min(1, (t - .75) / 2.8));
      const textEase = textT * textT * (3 - 2 * textT);

      if (textT > 0) {
        word.style.opacity = String(Math.min(1, textT * 2.5));
        lines.forEach((el, i) => {
          const reveal = Math.min(1, textT * 2.2);
          const collapse = Math.max(0, Math.min(1, (textT - .55) / .45));
          const easeIn = collapse * collapse * (3 - 2 * collapse);

          let x = 0, y = 0, z = 0, rotY = 0, rotZ = 0, scale = 1, opac = 1;

          if (introVariant === "red") {
            const slam = Math.pow(easeIn, 7); 
            const shakeX = (1 - slam) * (Math.random() - 0.5) * 120;
            const shakeY = (1 - slam) * (Math.random() - 0.5) * 120;
            x = (Math.random() - 0.5) * 600 * (1 - slam) + shakeX;
            y = -800 * (1 - slam) + shakeY; 
            z = 400 * (1 - slam);
            rotY = (Math.random() - 0.5) * 180 * (1 - slam);
            rotZ = (Math.random() - 0.5) * 90 * (1 - slam);
            scale = 1 + (1 - slam) * 5; 
            opac = slam;
          } 
          else if (introVariant === "blue") {
            const ritualPhase = t * 4.0 + i * ((Math.PI * 2) / 3);
            const radius = 350 * (1 - easeIn);
            x = Math.cos(ritualPhase) * radius;
            z = Math.sin(ritualPhase) * radius;
            y = Math.sin(t * 3.0 + i) * 120 * (1 - easeIn);
            rotY = (t * 250) + (easeIn * 360); 
            rotZ = Math.sin(t * 2) * 20 * (1 - easeIn);
            scale = 0.5 + easeIn * 0.5;
            opac = easeIn * (Math.sin(t * 30 + i) * 0.5 + 0.5);
            if (easeIn > 0.95) opac = 1; 
          } 
          else {
            const spiral = textEase * Math.PI * 3.0;
            const phase = spiral + i * 2.1;
            const x0 = Math.cos(phase) * 210 * reveal;
            const y0 = Math.sin(phase * .72) * 75 * reveal;
            const z0 = Math.sin(phase) * 280 * reveal;

            const letterSpiral = spiral * 1.5 + i * 1.7;
            const radius = 180 * (1 - easeIn);
            
            x = x0 * (1 - easeIn) + Math.cos(letterSpiral) * radius;
            y = y0 * (1 - easeIn) + Math.sin(letterSpiral) * radius + Math.sin(t * 4 + i) * 30 * (1 - easeIn);
            z = z0 * (1 - easeIn) + 120 - easeIn * 500;
            
            rotY = Math.sin(phase) * 20 + easeIn * 540;
            rotZ = easeIn * 360;
            scale = .72 + (1 - easeIn) * .45;
            opac = .6 + scale * .35;
          }

          el.style.transform = `translate3d(${x}px,${y}px,${z}px) rotateY(${rotY}deg) rotateZ(${rotZ}deg) scale(${scale})`;
          el.style.opacity = String(opac);
        });
      }
      
      const seqT = t - 0.625;
      if (seqT >= 0 && seqT < 1.905) {
        const index = Math.min(2, Math.floor(seqT / 0.635));
        const local = seqT - index * 0.635;
        
        word.innerHTML = "";
        word.style.opacity = "1";
        
        const stack = document.createElement("span");
        stack.style.display = "flex"; stack.style.flexDirection = "column"; stack.style.alignItems = "center";
        stack.style.fontFamily = "Impact, sans-serif"; stack.style.fontSize = "clamp(42px, 8vh, 88px)";
        
        const vColor = variantColors[introVariant] || variantColors.yellow;
        stack.style.color = vColor.color;
        stack.style.textShadow = `0 0 3px ${vColor.shadow}`;
        
        for (const ch of ["LIGHTNING", "HORN", "UNICORN"][index]) {
          const letter = document.createElement("span");
          letter.textContent = ch; 
          letter.style.display = "block"; letter.style.lineHeight = "0.88"; letter.style.fontSize = "1em";
          letter.style.color = vColor.color; letter.style.fontFamily = "inherit"; letter.style.fontWeight = "900";
          letter.style.backgroundImage = vColor.bg; letter.style.webkitBackgroundClip = "text";
          letter.style.backgroundClip = "text"; letter.style.webkitTextFillColor = "transparent";
          stack.appendChild(letter);
        }
        
        if (introVariant === "red") {
          const g = Math.random() * 4;
          const jitterX = (Math.random() - 0.5) * 10;
          stack.style.transform = `translateX(${jitterX}px)`;
          stack.style.textShadow = `0 0 5px ${vColor.shadow}, ${g*2}px 0 0 rgba(0,255,255,.9), -${g*2}px 0 0 rgba(255,0,180,.9)`;
        } 
        else if (introVariant === "blue") {
          const breath = Math.sin(local * Math.PI * 4); 
          const glow = 5 + (breath * 15);
          stack.style.textShadow = `0 0 ${glow}px ${vColor.shadow}, 0 0 ${glow * 2}px rgba(255,255,255,0.4)`;
          if (local < 0.1 || (local > 0.3 && local < 0.35)) {
            stack.style.opacity = Math.random(); 
          }
        } 
        else {
          let bScale = 1;
          if (local < 0.2) {
             const progress = local / 0.2;
             bScale = 1 + Math.sin(progress * Math.PI) * 0.15; 
          }
          stack.style.transform = `scale(${bScale})`;
          
          let glitchPulse = 0;
          if (local > 0.15 && local < 0.22) {
            glitchPulse = Math.sin(((local - 0.15) / 0.07) * Math.PI); 
          }
          if (glitchPulse > 0) {
            const g = glitchPulse * 2.2;
            const jitterX = (Math.random() - 0.5) * g * 8;
            stack.style.transform = `scale(${bScale}) translateX(${jitterX}px)`;
            stack.style.textShadow = `0 0 5px ${vColor.shadow}, ${g*2}px 0 0 rgba(0,255,255,.8), -${g*2}px 0 0 rgba(255,0,180,.8)`;
          }
        }
        
        word.appendChild(stack);
      } else {
        word.style.opacity = "0";
      }
      
      if (t >= 2.625) { intro.remove(); return; }
      requestAnimationFrame(animateIntro);
    }
    
    resizeIntro(); window.addEventListener("resize", resizeIntro);
    
    document.querySelectorAll(".lhu-pill").forEach(btn => {
      btn.addEventListener("click", () => {
        introVariant = btn.dataset.intro;
        document.getElementById("lhu-enter-panel").classList.add("hidden");
        if (audio) { audio.src = `lhu${btn.dataset.intro}.mp3`; audio.play().catch(()=>{}); }
        introStart = performance.now();
        requestAnimationFrame(animateIntro);
      }, { once: true });
    });
  })();

  function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();
    if (mixer) mixer.update(delta);
    
    if (camTween) {
      const k = Math.min(1, (performance.now() - camTween.start) / camTween.dur);
      const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      camera.position.lerpVectors(camTween.fromPos, camTween.toPos, e);
      controls.target.lerpVectors(camTween.fromTarget, camTween.toTarget, e);
      camera.lookAt(controls.target);
      if (k >= 1) { if(camTween.onDone) camTween.onDone(); camTween = null; controls.enabled = true; }
    } else controls.update();
    
    if (object) {
      if (gagActive) {
        const tt = (performance.now() - gagStart) / 1000; const amp = gagSize.length() * 0.04;
        object.position.x = gagBase.x + Math.sin(tt * 5) * amp; object.position.z = gagBase.z + (Math.sin(tt * 10) * 0.5 + 0.5) * amp * 0.6; object.position.y = gagBase.y + Math.sin(tt * 5 + Math.PI / 2) * amp * 0.4;
        object.rotation.z = Math.sin(tt * 5) * 0.08; object.rotation.y = Math.sin(tt * 3) * 0.12;
      } 
      else if (rainbowActive) {
        const tt = (performance.now() - rainbowStart) / 1000;
        
        if (tt < 0.35) {
            const u = tt / 0.35;
            object.position.y = rainbowBasePos.y + Math.pow(u, 3) * 20; 
        } 
        else if (tt < 0.45) {
            // Parodius XL-Modus Skalierung
            object.scale.setScalar(0.75); 
            object.position.y = rainbowBasePos.y - 14; 
            object.position.z = rainbowBasePos.z - 15; 
        } 
        else if (tt < 2.45) {
            const u = (tt - 0.45) / 2.0;
            
            // Anpassung der Flugstrecke für die neue Größe
            object.position.y = (rainbowBasePos.y - 14) + (u * 28); 
            object.position.z = rainbowBasePos.z - 15;
            
            object.rotation.y = rainbowBaseRot.y + (u * Math.PI * 2 * 3);
            object.rotation.x = rainbowBaseRot.x + 0.4; 
            
            const pulse = 0.7 + 0.3 * Math.sin(tt * 28); 
            const hue = (tt * 260) % 360;
            rainbowMatStates.forEach(st => { 
                st.mat.emissive.setHSL(hue / 360, 1, 0.52); 
                st.mat.emissiveIntensity = 0.35 + pulse * 3.0; 
            });
            
            const screenPos = object.position.clone().project(camera);
            const screenX = (screenPos.x * 0.5 + 0.5) * window.innerWidth;
            const screenY = -(screenPos.y * 0.5 - 0.5) * window.innerHeight;
            
            const crossfire = document.getElementById("shmup-container");
            const centerPoint = crossfire.querySelector(".shmup-center");
            if (centerPoint) {
                centerPoint.style.left = screenX + "px";
                centerPoint.style.top = screenY + "px";
            }
            
            if (tt >= 0.7 && tt < 2.2) {
                crossfire.style.display = "block";
            } else {
                crossfire.style.display = "none";
            }
        }
        
        if (tt >= 2.45) endRainbow();
      } 
      else if (musicOn) { 
        object.rotation.x = Math.sin(Date.now()*0.001 * (Math.PI / (60/144*0.5))) * 0.08; 
      } 
      else { 
        object.rotation.x *= 0.9; 
      }
    }
    renderer.render(scene, camera);
    if (hitEnterMixer) hitEnterMixer.update(delta); if (hitEnterObject) hitEnterObject.rotation.y += delta * 0.75; hitEnterRenderer.render(hitEnterScene, hitEnterCamera);
  }
  animate();
  window.addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
