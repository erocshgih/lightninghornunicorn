<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Lightning Horn Unicorn</title>

<!-- ============================================================
     MODERNISIERTE INDEX.HTML
     - Desktop + Mobile (responsive, safe-area-insets)
     - Funktionen erhalten: 3D-Viewer, Dropdown, Musik, Navigation,
       Spiegel-Reflexion via HDRI
     - Matrix-Regen in ALLEN Farben (spaltenbasiert, trail-fade -> günstig)
     - Rechenlast gezielt für Mittelklasse-Handys 2023 (pixelRatio-Cap,
       kein shadowBlur, eine Zeile pro Spalte)
     Alle Erklärungen stehen hier nur als Kommentare (erscheinen nicht).
     ============================================================ -->
<style>
  :root {
    --glass: rgba(18, 20, 32, 0.42);
    --glass-strong: rgba(18, 20, 32, 0.62);
    --border: rgba(255, 255, 255, 0.14);
    --text: #f3f4f8;
    --muted: rgba(243, 244, 248, 0.6);
    --radius: 18px;
    --accent: #8fd9fb;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #04050a;
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Matrix-Regen: ganz hinten */
  #matrix-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    display: block;
  }

  /* 3D-Bereich: füllt den Viewport, Canvas transparent -> Matrix scheint durch */
  #container3D {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    z-index: 1;
    touch-action: none;
  }
  #container3D canvas { display: block; }

  /* Kleiner, dezenter Titel oben mittig */
  #title {
    position: fixed;
    top: max(14px, env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    z-index: 8;
    font-size: clamp(11px, 2.6vw, 14px);
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--muted);
    pointer-events: none;
    text-align: center;
    white-space: nowrap;
  }

  /* Glass-Optik, wiederverwendbar für Buttons & Pill */
  .glass {
    background: var(--glass);
    backdrop-filter: blur(14px) saturate(150%);
    -webkit-backdrop-filter: blur(14px) saturate(150%);
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--text);
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
  }

  /* Obere Button-Leiste */
  #ui-wrapper {
    position: fixed;
    top: max(54px, calc(env(safe-area-inset-top) + 44px));
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    gap: 10px;
    width: max-content;
    max-width: 92vw;
  }
  .btn {
    padding: 12px 22px;
    font-size: clamp(13px, 3.6vw, 16px);
    font-weight: 600;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:hover { transform: translateY(-1px); background: var(--glass-strong); }
  .btn:active { transform: translateY(0); }

  /* Unteres Menü: Dropdown als Glass-Pill */
  #head-menu {
    position: fixed;
    bottom: max(16px, env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    width: min(92vw, 460px);
  }
  #head-select {
    width: 100%;
    padding: 15px 20px;
    font-size: clamp(14px, 3.8vw, 17px);
    font-weight: 600;
    text-align: center;
    text-align-last: center;
    border: none;
    outline: none;
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
  }
  #head-select option { color: #111; }

  /* Lade-Overlay */
  #loading {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    pointer-events: none;
    color: var(--text);
    font-size: 13px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
  }
  #loading.show { display: flex; }
  .spinner {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, transparent, var(--accent));
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 0);
    mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 0);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>

<body>
<!-- Matrix-Regen-Hintergrund -->
<canvas id="matrix-bg"></canvas>

<!-- 3D-Bereich (Three.js hängt sein Canvas hier ein) -->
<div id="container3D"></div>

<!-- Dezenter Titel -->
<div id="title">Lightning Horn Unicorn</div>

<!-- Lade-Overlay -->
<div id="loading">
  <div class="spinner"></div>
  <span class="loading-text">loading</span>
</div>

<!-- Obere Buttons -->
<div id="ui-wrapper">
  <button id="music-toggle" class="btn glass">Music Off</button>
  <button id="navigate-to-main" class="btn glass">Main Page</button>
</div>

<!-- Hintergrundmusik -->
<audio id="background-music" preload="auto" crossorigin="anonymous" loop>
  <source src="https://raw.githubusercontent.com/erocshgih/lightninghornunicorn/main/unison_unicorns.mp3" type="audio/mpeg">
</audio>

<!-- Dropdown zur Modell-Auswahl -->
<div id="head-menu">
  <select id="head-select" class="glass"></select>
</div>

<!-- ============================================================
     MATRIX-REGEN IN ALLEN FARBEN
     Spaltenbasiert: pro Spalte eine fallende "7" mit eigener Farbe.
     Statt clearRect wird eine halbtransparente Fläche drübergelegt
     (Trail-Effekt) -> sehr günstig, keine Schatten/Glow-Kosten.
     ============================================================ -->
<script>
  const mcanvas = document.getElementById("matrix-bg");
  const mctx = mcanvas.getContext("2d");

  let cols, drops, hues, speeds, fontSize;

  function setupMatrix() {
    // Canvas in CSS-Pixeln (kein DPR-Scaling nötig -> spart Leistung)
    mcanvas.width = innerWidth;
    mcanvas.height = innerHeight;
    fontSize = Math.max(14, Math.round(innerWidth / 52));
    cols = Math.ceil(innerWidth / fontSize);
    drops = new Array(cols);
    hues = new Array(cols);
    speeds = new Array(cols);
    for (let i = 0; i < cols; i++) {
      drops[i] = Math.random() * -innerHeight / fontSize;
      hues[i] = Math.floor(Math.random() * 360);
      speeds[i] = 0.35 + Math.random() * 0.7;
    }
    mctx.font = fontSize + "px monospace";
  }
  setupMatrix();

  function drawMatrix() {
    // Trail-Fade: dunkle, leicht transparente Fläche statt komplett löschen
    mctx.fillStyle = "rgba(4, 5, 10, 0.12)";
    mctx.fillRect(0, 0, mcanvas.width, mcanvas.height);
    mctx.font = fontSize + "px monospace";

    for (let i = 0; i < cols; i++) {
      const x = i * fontSize;
      const y = drops[i] * fontSize;
      // helle Spitze für Tiefe, farbiger Schaft
      mctx.fillStyle = "hsl(" + hues[i] + ", 100%, 70%)";
      mctx.fillText("7", x, y);

      drops[i] += speeds[i];
      if (y > innerHeight && Math.random() > 0.975) {
        drops[i] = 0;
        hues[i] = Math.floor(Math.random() * 360); // neue Farbe pro Neustart
      }
    }
    requestAnimationFrame(drawMatrix);
  }
  drawMatrix();

  window.addEventListener("resize", setupMatrix);
</script>

<!-- ============================================================
     3D + MODELL-LOGIK
     ============================================================ -->
<script type="module">
  import * as THREE from "https://esm.sh/three@0.160.0";
  import { OrbitControls } from "https://esm.sh/three@0.160.0/examples/jsm/controls/OrbitControls.js";
  import { GLTFLoader } from "https://esm.sh/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";
  import { DRACOLoader } from "https://esm.sh/three@0.160.0/examples/jsm/loaders/DRACOLoader.js";

  /* ---------- MODELLLISTE (einfach erweiterbar) ---------- */
  const MODELS = [
    { label: "unibrowserloadicorn",   url: "https://raw.githubusercontent.com/erocshgih/lightninghornunicorn/main/glb/unibrowserloadicorn.glb" },
    { label: "uniturnoeyeballhorn",   url: "https://raw.githubusercontent.com/erocshgih/lightninghornunicorn/main/glb/uniturnoeyeballhorn.glb" },
    { label: "duckybulbywaterhorn",   url: "https://raw.githubusercontent.com/erocshgih/lightninghornunicorn/main/glb/duckybulbywaterhorn.glb" },
    { label: "askflamongostache",     url: "https://raw.githubusercontent.com/erocshgih/lightninghornunicorn/main/glb/askflamongostache.glb" }
  ];

  /* ---------- LADEN-ANZEIGE ---------- */
  const loadingEl = document.getElementById("loading");
  const loadingText = loadingEl.querySelector(".loading-text");
  let loadingTimer;
  function startLoading() {
    loadingEl.classList.add("show");
    loadingText.textContent = "loading";
    let dots = 0;
    loadingTimer = setInterval(() => {
      dots = (dots + 1) % 4;
      loadingText.textContent = "loading" + ".".repeat(dots);
    }, 200);
  }
  function stopLoading() {
    clearInterval(loadingTimer);
    loadingEl.classList.remove("show");
  }

  /* ---------- SZENE / KAMERA ---------- */
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 1000);
  camera.position.set(2.6, 0, 2.6);

  /* ---------- RENDERER ----------
     pixelRatio auf max. 2 (bzw. 1.5 auf Mobile) gedeckelt -> flüssig auf
     Mittelklasse 2023, trotz voller Auflösung + Antialias. */
  const isMobile = matchMedia("(max-width: 820px)").matches;
  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isMobile ? 1.5 : 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  document.getElementById("container3D").appendChild(renderer.domElement);

  /* ---------- UMGEBUNG / SPIEGELUNGEN ----------
     HDRI als scene.environment -> metallische/glänzende Materialien
     spiegeln das Asset (der "Spiegel-Effekt"). */
  new THREE.TextureLoader().load(
    "./assets/hdri/lhu_tropical_chrome.png",
    (tex) => {
      tex.mapping = THREE.EquirectangularReflectionMapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      scene.environment = tex;
    },
    undefined,
    (err) => console.error("HDRI konnte nicht geladen werden:", err)
  );

  /* ---------- LICHTER ---------- */
  scene.add(new THREE.AmbientLight(0xffffff, 1.3));
  const key = new THREE.DirectionalLight(0xffffff, 1.8); key.position.set(5, 5, 5); scene.add(key);
  const fill = new THREE.DirectionalLight(0xffffff, 1.2); fill.position.set(-5, 2, 5); scene.add(fill);
  const rim = new THREE.DirectionalLight(0xffffff, 1.0); rim.position.set(-3, 5, -5); scene.add(rim);

  /* ---------- GLTF-LOADER + DRACO ---------- */
  const dracoLoader = new DRACOLoader();
  dracoLoader.setDecoderPath("https://www.gstatic.com/draco/v1/decoders/");
  const loader = new GLTFLoader();
  loader.setDRACOLoader(dracoLoader);

  let object = null, mixer = null;
  const clock = new THREE.Clock();

  function disposeObject(obj) {
    obj.traverse((c) => {
      if (c.isMesh) { c.geometry.dispose(); if (c.material) c.material.dispose(); }
    });
  }

  function loadHead(url) {
    startLoading();
    if (object) { scene.remove(object); disposeObject(object); object = null; }
    if (mixer) { mixer.stopAllAction(); mixer = null; }

    loader.load(
      url,
      (g) => {
        object = g.scene;
        object.traverse((c) => {
          if (c.isMesh && c.material) {
            c.material.envMapIntensity = 1.5; // Reflexion verstärken
            c.material.needsUpdate = true;
          }
        });
        scene.add(object);
        if (g.animations && g.animations.length) {
          mixer = new THREE.AnimationMixer(object);
          g.animations.forEach((clip) => mixer.clipAction(clip).play());
        }
        stopLoading();
      },
      undefined,
      (err) => {
        console.error("GLB konnte nicht geladen werden:", err);
        stopLoading();
        loadingText.textContent = "load error";
        loadingEl.classList.add("show");
      }
    );
  }

  /* ---------- STEUERUNG ---------- */
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 1.2;

  /* ---------- MUSIK ---------- */
  let musicOn = false;
  const music = document.getElementById("background-music");
  const bpm = 144;
  const nodSpeed = (60 / bpm) * 0.5;
  document.getElementById("music-toggle").onclick = () => {
    musicOn = !musicOn;
    musicOn ? music.play().catch(() => {}) : music.pause();
    document.getElementById("music-toggle").textContent = musicOn ? "Music On" : "Music Off";
  };

  /* ---------- NAVIGATION ---------- */
  document.getElementById("navigate-to-main").onclick = () => {
    location.href = "https://erocshgih.github.io/lightninghornunicorn/LightningHornUnicorn.html";
  };

  /* ---------- DROPDOWN + AUTOLOAD ---------- */
  const selectEl = document.getElementById("head-select");
  MODELS.forEach((m) => {
    const opt = document.createElement("option");
    opt.value = m.url;
    opt.textContent = m.label;
    selectEl.appendChild(opt);
  });
  selectEl.addEventListener("change", (e) => loadHead(e.target.value));
  loadHead(MODELS[0].url);

  /* ---------- ANIMATIONS-SCHLEIFE ---------- */
  function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();
    if (mixer) mixer.update(delta);
    controls.update();
    if (object) {
      // autoRotate übernimmt die Drehung; bei Musik zusätzlich Nicken
      if (musicOn) {
        const t = Date.now() * 0.001;
        object.rotation.x = Math.sin(t * (Math.PI / nodSpeed)) * 0.08;
      } else {
        object.rotation.x *= 0.9;
      }
    }
    renderer.render(scene, camera);
  }
  animate();

  /* ---------- RESIZE ---------- */
  window.addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
</script>
</body>
</html>
