<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Contact - LHU Content</title>
</head>
<body>
    <main>
        <!-- Spezifisches CSS nur für diese Unterseite -->
        <style>
            section p { font-size: var(--fs-sm); margin: 18px auto; text-align: center; }

            .wobble-glitch-container {
                position: relative;
                display: inline-block;
            }

            .analog-glow {
                pointer-events: none;
            }

            .tape-image {
                display: block;
                width: 100%;
                max-width: 400px;
                height: auto;
                margin: 40px auto;
                border-radius: var(--radius);
                box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
                transition: transform 0.3s;
            }

            .tape-image:hover {
                transform: scale(1.03);
            }

            @keyframes retroBlink {
                0% { opacity: 1; }
                50% { opacity: 0; }
                100% { opacity: 1; }
            }

            @media (min-width: 769px) {
                section p { font-size: var(--fs-base); max-width: 600px; line-height: 2; }
                .tape-image { max-width: 500px; }
            }
        </style>

        <section id="CONTACT">
            <h2 data-lang-en="CONTACT" data-lang-de="KONTAKT">CONTACT</h2>

            <p data-lang-en="For global funding campaigns, collaborative ventures, or cosmic feedback – dispatch a message directly to me."
               data-lang-de="Für globale Kampagnen, Kollaborationen oder kosmischen Input – schicke eine Email direkt zu mir.">
            </p>

            <p data-lang-en="Click the mailbox below to send an email."
               data-lang-de="Klick auf den Briefkasten unten, um eine Email zu senden."
               style="font-family: 'Press Start 2P', cursive; font-size: var(--fs-xs); color: var(--text-soft); text-align: center; margin-bottom: 20px; line-height: 2.2;">
            </p>

            <a href="mailto:lightninghornunicorn@gmail.com" class="music-tape-link" style="margin: 30px auto; display: block;">
                <div class="wobble-glitch-container">
                    <img src="unicornmail.webp" alt="The Ironic Furry Unicorn Mailbox TRK-2000 with Nano Banana" class="tape-image">
                    <div class="analog-glow"></div>
                </div>
            </a>

            <p style="font-size: 0.5rem; color: #00FF28; text-align: center; letter-spacing: 2px; margin-top: 10px; animation: retroBlink 1.2s infinite steps(2);">
                &#9889; TRK-2000 SYSTEM ONLINE &#9889;
            </p>
        </section>

        <script>
            (function initContact() {
                const lang = (navigator.language || 'en').startsWith('de') ? 'de' : 'en';
                document.querySelectorAll('[data-lang-en]').forEach(el => {
                    const text = el.getAttribute(`data-lang-${lang}`);
                    if (text) el.innerHTML = text;
                });
            })();
        </script>
    </main>
</body>
</html>
