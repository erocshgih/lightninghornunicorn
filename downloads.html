<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Duckify – Lightning Horn Unicorn</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-main: #121212;
      --bg-sidebar: #1a1a1a;
      --bg-card: #181818;
      --bg-hover: #282828;
      --bg-active: #333;
      --yellow: #FFC400;
      --orange: #FF7A00;
      --yellow-dim: #b38a00;
      --text-main: #FFFFFF;
      --text-muted: #B3B3B3;
      --text-dim: #727272;
      --border: #282828;
      --row-hover: rgba(255,255,255,0.1);
    }

    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    @keyframes duckBob {
      from { transform: translateY(-5px) rotate(-7deg); }
      to { transform: translateY(5px) rotate(7deg); }
    }
    @keyframes duckFly {
      from { transform: translateX(0); }
      to { transform: translateX(122vw); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    body {
      font-family: 'Press Start 2P', monospace;
      background: var(--bg-main);
      color: var(--text-main);
      overflow: hidden;
      height: 100vh;
    }

    /* ========== LAYOUT ========== */
    .app {
      display: grid;
      grid-template-columns: 280px 1fr;
      grid-template-rows: 1fr 90px;
      height: 100vh;
    }

    /* ========== SIDEBAR ========== */
    .sidebar {
      background: var(--bg-sidebar);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      overflow-y: auto;
      border-right: 1px solid var(--border);
    }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 8px;
    }

    .sidebar-logo .duck-icon {
      font-size: 28px;
      animation: pulse 2s ease-in-out infinite;
    }

    .sidebar-logo h1 {
      font-size: 14px;
      color: var(--yellow);
      letter-spacing: 1px;
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .sidebar-nav a {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 16px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 9px;
      border-radius: 8px;
      transition: all 0.2s;
    }

    .sidebar-nav a:hover {
      color: var(--text-main);
      background: var(--bg-hover);
    }

    .sidebar-nav a.active {
      color: var(--text-main);
      background: var(--bg-hover);
    }

    .sidebar-nav a .icon {
      font-size: 18px;
      width: 24px;
      text-align: center;
    }

    .sidebar-divider {
      height: 1px;
      background: var(--border);
      margin: 8px 0;
    }

    .sidebar-section-title {
      font-size: 8px;
      color: var(--text-dim);
      padding: 0 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .sidebar-playlists {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      overflow-y: auto;
    }

    .sidebar-playlist {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .sidebar-playlist:hover {
      color: var(--text-main);
      background: var(--bg-hover);
    }

    .sidebar-playlist.active {
      color: var(--yellow);
    }

    .sidebar-playlist .pl-cover {
      width: 40px;
      height: 40px;
      border-radius: 4px;
      background: var(--bg-hover);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    /* ========== MAIN CONTENT ========== */
    .main {
      overflow-y: auto;
      background: var(--bg-main);
      position: relative;
    }

    .main::-webkit-scrollbar {
      width: 12px;
    }
    .main::-webkit-scrollbar-track {
      background: transparent;
    }
    .main::-webkit-scrollbar-thumb {
      background: var(--bg-hover);
      border-radius: 6px;
    }

    /* ========== PLAYLIST HEADER ========== */
    .playlist-header {
      display: flex;
      align-items: flex-end;
      gap: 24px;
      padding: 40px 32px 24px;
      background: linear-gradient(180deg, #2a2200 0%, var(--bg-main) 100%);
    }

    .playlist-cover {
      width: 200px;
      height: 200px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--yellow), var(--orange));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 72px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      flex-shrink: 0;
    }

    .playlist-info {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .playlist-type {
      font-size: 8px;
      color: var(--text-main);
      text-transform: uppercase;
    }

    .playlist-title {
      font-size: clamp(24px, 4vw, 48px);
      color: var(--text-main);
      line-height: 1.1;
    }

    .playlist-desc {
      font-size: 9px;
      color: var(--text-muted);
      max-width: 500px;
      line-height: 1.6;
    }

    .playlist-meta {
      font-size: 8px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .playlist-meta .dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--text-muted);
    }

    /* ========== PLAYLIST ACTIONS ========== */
    .playlist-actions {
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 24px 32px;
    }

    .play-btn-large {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--yellow);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: #000;
      transition: all 0.2s;
      box-shadow: 0 4px 16px rgba(255,196,0,0.3);
    }

    .play-btn-large:hover {
      transform: scale(1.06);
      background: #fff;
      box-shadow: 0 6px 24px rgba(255,196,0,0.5);
    }

    .shuffle-btn, .download-all-btn {
      display: none;
    }

    /* ========== SONG LIST HEADER ========== */
    .song-list-header {
      display: grid;
      grid-template-columns: 40px 1fr 100px 80px 50px;
      gap: 16px;
      padding: 0 32px 8px;
      border-bottom: 1px solid var(--border);
      margin: 0 0 8px;
      font-size: 8px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .song-list-header span:nth-child(3),
    .song-list-header span:nth-child(4) {
      text-align: right;
    }

    /* ========== SONG ROW ========== */
    .song-row {
      display: grid;
      grid-template-columns: 40px 1fr 100px 80px 50px;
      gap: 16px;
      padding: 8px 32px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
      align-items: center;
      animation: fadeIn 0.4s ease forwards;
      opacity: 0;
    }

    .song-row:hover {
      background: var(--row-hover);
    }

    .song-row:hover .song-num {
      display: none;
    }

    .song-row:hover .song-play-icon {
      display: flex;
    }

    .song-row.playing {
      background: rgba(255,196,0,0.1);
    }

    .song-row.playing .song-num {
      color: var(--yellow);
    }

    .song-row.playing .song-title {
      color: var(--yellow);
    }

    .song-num-play {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .song-num {
      font-size: 9px;
      color: var(--text-muted);
    }

    .song-play-icon {
      display: none;
      font-size: 14px;
      color: var(--text-main);
    }

    .song-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .song-title {
      font-size: 10px;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-artist {
      font-size: 8px;
      color: var(--text-muted);
    }

    .song-version-dots {
      display: flex;
      gap: 6px;
      justify-content: flex-end;
    }

    .version-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--text-dim);
      cursor: pointer;
      transition: all 0.2s;
    }

    .version-dot:hover {
      background: var(--text-muted);
      transform: scale(1.2);
    }

    .version-dot.active {
      background: var(--yellow);
      box-shadow: 0 0 8px rgba(255,196,0,0.5);
    }

    .song-duration {
      font-size: 9px;
      color: var(--text-muted);
      text-align: right;
    }

    .song-download {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dl-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: transparent;
      border: 1px solid var(--text-dim);
      color: var(--text-dim);
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      opacity: 0;
    }

    .song-row:hover .dl-btn {
      opacity: 1;
    }

    .dl-btn:hover {
      border-color: var(--text-main);
      color: var(--text-main);
      transform: scale(1.1);
    }

    .dl-btn.dl-active {
      opacity: 1;
      border-color: var(--yellow);
      color: var(--yellow);
    }

    /* ========== GENRE SECTION DIVIDER ========== */
    .genre-divider {
      padding: 32px 32px 16px;
      font-size: 12px;
      color: var(--text-main);
      border-bottom: 1px solid var(--border);
      margin-bottom: 8px;
    }

    /* ========== NOW PLAYING BAR ========== */
    .now-playing {
      grid-column: 1 / -1;
      background: #181818;
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: 1fr 2fr 1fr;
      align-items: center;
      padding: 0 16px;
      z-index: 100;
    }

    .np-left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .np-cover {
      width: 56px;
      height: 56px;
      border-radius: 4px;
      background: linear-gradient(135deg, var(--yellow), var(--orange));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }

    .np-track-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .np-track-name {
      font-size: 9px;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .np-track-artist {
      font-size: 7px;
      color: var(--text-muted);
    }

    .np-like {
      display: none;
    }

    .np-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .np-controls {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .np-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 16px;
      cursor: pointer;
      transition: color 0.2s;
    }

    .np-btn:hover {
      color: var(--text-main);
    }

    .np-btn.play {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--text-main);
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: transform 0.1s;
    }

    .np-btn.play:hover {
      transform: scale(1.06);
    }

    .np-btn.play.active {
      background: var(--yellow);
    }

    .np-progress {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      max-width: 600px;
    }

    .np-time {
      font-size: 7px;
      color: var(--text-muted);
      min-width: 40px;
      text-align: center;
    }

    .np-bar {
      flex: 1;
      height: 4px;
      background: var(--bg-hover);
      border-radius: 2px;
      position: relative;
      cursor: pointer;
    }

    .np-bar:hover {
      height: 6px;
    }

    .np-bar:hover .np-thumb,
    .np-thumb.visible {
      opacity: 1;
    }

    .np-fill {
      height: 100%;
      background: var(--text-main);
      border-radius: 2px;
      transition: width 0.1s linear;
      position: relative;
    }

    .np-bar:hover .np-fill {
      background: var(--yellow);
    }

    .np-thumb {
      position: absolute;
      top: 50%;
      right: -6px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      transform: translateY(-50%);
      opacity: 0;
      transition: opacity 0.2s;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
      object-fit: contain;
    }

    .np-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
    }

    .np-right .np-btn {
      font-size: 14px;
    }

    .np-dl-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--yellow);
      border: none;
      color: #000;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .np-dl-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 12px rgba(255,196,0,0.5);
    }

    /* ========== INTRO ========== */
    #intro {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      transition: opacity 0.6s, visibility 0.6s;
    }

    #intro.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    @keyframes introGlitch {
      0%, 100% { transform: translate(0); filter: none; }
      10% { transform: translate(-4px, 2px); filter: hue-rotate(90deg); }
      20% { transform: translate(4px, -2px); filter: hue-rotate(180deg); }
      30% { transform: translate(-2px, 4px) skewX(2deg); }
      40% { transform: translate(2px, -4px) skewX(-2deg); }
      50% { transform: translate(-4px, 0); filter: hue-rotate(270deg); }
      60% { transform: translate(4px, 2px); }
      70% { transform: translate(-2px, -2px) skewX(4deg); filter: hue-rotate(45deg); }
      80% { transform: translate(0, 4px) skewX(-4deg); }
      90% { transform: translate(2px, -2px); filter: hue-rotate(135deg); }
    }

    @keyframes introFlash {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    @keyframes introScale {
      0% { transform: scale(0.1) rotate(-180deg); opacity: 0; }
      50% { transform: scale(1.3) rotate(10deg); opacity: 1; }
      70% { transform: scale(0.9) rotate(-5deg); }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    @keyframes introShake {
      0%, 100% { transform: translateX(0); }
      10% { transform: translateX(-10px) rotate(-2deg); }
      20% { transform: translateX(10px) rotate(2deg); }
      30% { transform: translateX(-8px) rotate(-1deg); }
      40% { transform: translateX(8px) rotate(1deg); }
      50% { transform: translateX(-5px); }
      60% { transform: translateX(5px); }
      70% { transform: translateX(-3px); }
      80% { transform: translateX(3px); }
    }

    @keyframes introPulse {
      0%, 100% { text-shadow: 0 0 20px var(--yellow), 0 0 40px var(--orange); }
      50% { text-shadow: 0 0 60px var(--yellow), 0 0 100px var(--orange), 0 0 140px var(--yellow); }
    }

    @keyframes introRainbow {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(360deg); }
    }

    .intro-duck {
      font-size: 80px;
      animation: introScale 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55) forwards,
                 introShake 0.5s ease 0.8s,
                 introPulse 1.5s ease-in-out 1s infinite;
    }

    .intro-title {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(40px, 10vw, 80px);
      color: var(--yellow);
      margin-top: 24px;
      animation: introGlitch 0.3s steps(2) 3,
                 introFlash 0.15s steps(1) 8,
                 introScale 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55) 0.4s forwards,
                 introPulse 2s ease-in-out 1.5s infinite;
      opacity: 0;
      letter-spacing: 8px;
    }

    .intro-sub {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(6px, 1.5vw, 10px);
      color: var(--text-muted);
      margin-top: 16px;
      opacity: 0;
      animation: introFlash 0.2s steps(1) 6 1.2s,
                 fadeIn 0.4s ease 1.8s forwards;
    }

    @keyframes introScanline {
      0% { top: -100%; }
      100% { top: 200%; }
    }

    #intro::after {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent 0px,
        transparent 2px,
        rgba(255,196,0,0.03) 2px,
        rgba(255,196,0,0.03) 4px
      );
      pointer-events: none;
    }

    .intro-scanline {
      position: absolute;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, transparent, var(--yellow), transparent);
      opacity: 0.4;
      animation: introScanline 2s linear infinite;
    }

    .intro-bar {
      position: absolute;
      bottom: 60px;
      width: 200px;
      height: 4px;
      background: var(--bg-hover);
      border-radius: 2px;
      overflow: hidden;
      opacity: 0;
      animation: fadeIn 0.3s ease 2s forwards;
    }

    .intro-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--yellow), var(--orange));
      border-radius: 2px;
      transition: width 0.1s linear;
    }

    /* ========== DUCKS OVERLAY ========== */
    #duckFlock {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .duck {
      position: absolute;
      left: -10%;
      will-change: transform;
      filter: scaleX(-1) brightness(0.3);
    }

    .duck img {
      display: block;
      opacity: 0.4;
      animation: duckBob 2.4s ease-in-out infinite alternate;
    }

    #duck3D {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 900px) {
      .app {
        grid-template-columns: 1fr;
      }
      .sidebar {
        display: none;
      }
      .playlist-header {
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 24px 16px;
      }
      .playlist-cover {
        width: 160px;
        height: 160px;
      }
      .song-list-header,
      .song-row {
        grid-template-columns: 30px 1fr 60px 40px;
      }
      .song-list-header span:nth-child(3),
      .song-row .song-version-dots {
        display: none;
      }
      .now-playing {
        grid-template-columns: 1fr 1fr;
      }
      .np-center {
        display: none;
      }
    }
  </style>
</head>
<body>

<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <span class="duck-icon">🦆</span>
      <h1>DUCKIFY</h1>
    </div>

    <div class="sidebar-divider"></div>

    <div class="sidebar-section-title">Playlists</div>

    <div class="sidebar-playlists">
      <div class="sidebar-playlist active" data-genre="all">
        <div class="pl-cover">⚡</div>
        <span>All Songs</span>
      </div>
      <div class="sidebar-playlist" data-genre="80ies">
        <div class="pl-cover">🎸</div>
        <span>80ies</span>
      </div>
      <div class="sidebar-playlist" data-genre="bsides">
        <div class="pl-cover">🎤</div>
        <span>B-Sides Acoustic</span>
      </div>
      <div class="sidebar-playlist" data-genre="calm">
        <div class="pl-cover">🌊</div>
        <span>Calm Chillout Lofi</span>
      </div>
      <div class="sidebar-playlist" data-genre="electro">
        <div class="pl-cover">⚡</div>
        <span>Electro Neurofunk</span>
      </div>
      <div class="sidebar-playlist" data-genre="indie">
        <div class="pl-cover">🎭</div>
        <span>Indie Operarock</span>
      </div>
      <div class="sidebar-playlist" data-genre="rock">
        <div class="pl-cover">🔥</div>
        <span>Rock Metal Punk</span>
      </div>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main" id="main-content">
    <!-- DYNAMIC CONTENT INSERTED BY JS -->
  </main>

  <!-- NOW PLAYING BAR -->
  <div class="now-playing">
    <div class="np-left">
      <div class="np-cover" id="np-cover">🦆</div>

    } else {
      var g = genres.find(function(x) { return x.id === genreId; });

        return { genre: g.id, genreName: g.name, genreIcon: g.icon, title: s.title, file: s.file, versions: s.versions || null };

      html += '  <div class="song-num-play">';
      html += '    <span class="song-num">' + (i + 1) + '</span>';

      html += '  </div>';
      html += '  <div class="song-info">';
      html += '    <div class="song-title">' + song.title + '</div>';
      html += '    <div class="song-artist">' + song.genreName + '</div>';
      html += '  </div>';
      html += '  <div class="song-version-dots">';
      if (hasVersions) {
        song.versions.forEach(function(v, vi) {
          html += '    <span class="version-dot' + (vi === 0 ? ' active' : '') + '" data-song="' + i + '" data-ver="' + vi + '" title="' + v.name + '"></span>';
        });

      html += '  </div>';
      html += '  <div class="song-duration">--:--</div>';

  function bindSongEvents() {
    // Song row click -> play
    document.querySelectorAll('.song-row').forEach(function(row) {
      row.addEventListener('click', function(e) {
        if (e.target.closest('.version-dot') || e.target.closest('.dl-btn')) return;
        var idx = parseInt(row.dataset.idx);
        playSong(idx);
      });
    });

    // Version dots
    document.querySelectorAll('.version-dot').forEach(function(dot) {
      dot.addEventListener('click', function(e) {
        e.stopPropagation();
        var songIdx = parseInt(dot.dataset.song);
        var verIdx = parseInt(dot.dataset.ver);
        var song = songList[songIdx];
        if (!song || !song.versions) return;

        // Update active dot
        dot.closest('.song-version-dots').querySelectorAll('.version-dot').forEach(function(d) { d.classList.remove('active'); });
        dot.classList.add('active');

        // Update file only, keep main title
        song.file = song.versions[verIdx].file;

        // Update subtitle in row
        var row = dot.closest('.song-row');
        var artistEl = row.querySelector('.song-artist');
        if (artistEl) artistEl.textContent = song.genreName + ' — ' + song.versions[verIdx].label;

        // Stop if currently playing this song
        if (currentSongIdx === songIdx && currentAudio) {
          currentAudio.pause();
          currentAudio = null;
          currentSongIdx = -1;
          updateNowPlaying(null);
        }
      });
    });

    // Download buttons
    document.querySelectorAll('.dl-btn').forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        var idx = parseInt(btn.dataset.song);

        if (!song) return;
        var a = document.createElement('a');
        a.href = song.file;
        a.download = song.title;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        btn.classList.add('dl-active');
        setTimeout(function() { btn.classList.remove('dl-active'); }, 1000);
      });
    });

    // Play all button
    var playAllBtn = document.getElementById('play-all-btn');
    if (playAllBtn) {
      playAllBtn.addEventListener('click', function() {
        if (currentAudio && !currentAudio.paused) {
          currentAudio.pause();
          updatePlayBtn(false);
          return;
        }
        if (currentAudio && currentAudio.paused) {
          currentAudio.play();
          updatePlayBtn(true);
          return;
        }
        playSong(0);
      });
    }
  }

  function fmtTime(s) {
    if (isNaN(s)) return '0:00';
    var m = Math.floor(s / 60);
    var sec = Math.floor(s % 60);
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  function updateNowPlaying(song) {
    if (!song) {
      npTitle.textContent = 'No track selected';
      npArtist.textContent = 'Lightning Horn Unicorn';
      npFill.style.width = '0%';
      npCurrent.textContent = '0:00';

    npTitle.textContent = song.title;
    npArtist.textContent = song.genreName || 'Lightning Horn Unicorn';

  function updatePlayBtn(playing) {
    npPlay.innerHTML = playing ? '⏸' : '▶';
    npPlay.classList.toggle('active', playing);

    document.querySelectorAll('.song-row').forEach(function(row) {
      row.classList.remove('playing');

      var row = document.querySelector('.song-row[data-idx="' + currentSongIdx + '"]');

      currentAudio.pause();
      currentAudio.currentTime = 0;
      currentAudio = null;
    }
    currentSongIdx = -1;
    updatePlayBtn(false);

  function playSong(idx) {
    if (idx < 0 || idx >= songList.length) return;
    stopCurrent();
    var gen = songGen;
    var song = songList[idx];
    var audio = new Audio(song.file);
    currentAudio = audio;
    currentSongIdx = idx;

    updateNowPlaying(song);
    updatePlayBtn(true);
    npFill.style.width = '0%';
    npCurrent.textContent = '0:00';
    npTotal.textContent = '0:00';

    audio.addEventListener('loadedmetadata', function() {
      if (gen !== songGen) return;
      npTotal.textContent = fmtTime(audio.duration);
    });

    audio.addEventListener('timeupdate', function() {
      if (gen !== songGen) return;
      var pct = (audio.currentTime / audio.duration) * 100;
      npFill.style.width = pct + '%';
      npCurrent.textContent = fmtTime(audio.currentTime);
    });

    audio.addEventListener('ended', function() {
      if (gen !== songGen) return;
      updatePlayBtn(false);
      currentAudio = null;
      currentSongIdx = -1;
      npFill.style.width = '0%';
      npCurrent.textContent = '0:00';
      // Auto next
      var nextIdx = idx + 1;
      if (nextIdx < songList.length) {
        playSong(nextIdx);
      }
    });

    audio.play().catch(function() {
      if (gen !== songGen) return;
      updatePlayBtn(false);
      currentAudio = null;
      currentSongIdx = -1;
    });
  }

      currentAudio.pause();

  var quackSound = new Audio('quack.mp3');
  var lastQuack = 0;

  function quack() {
    var now = Date.now();
    if (now - lastQuack < 150) return;
    lastQuack = now;
    quackSound.currentTime = 0;
    quackSound.play().catch(function() {});
  }

  function seekTo(e) {
    if (!currentAudio) return;
    var rect = npBar.getBoundingClientRect();
    var pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    currentAudio.currentTime = pct * currentAudio.duration;
    npFill.style.width = (pct * 100) + '%';
  }

  npBar.addEventListener('click', function(e) {
    seekTo(e);
    quack();
  });

        var durEl = row.querySelector('.song-duration');
        if (durEl) durEl.textContent = fmtTime(audio.duration);

    }
  }

  // Three.js 3D Duck
  try {
    var canvas = document.getElementById('duck3D');
    var renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5;

    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    var dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
    dirLight.position.set(2, 3, 4);
    scene.add(dirLight);

    var gltfLoader = new THREE.GLTFLoader();
    var ducks3D = [];

    function spawnGiantDuck() {
      var size = 0.6 + Math.random() * 1.2;
      var yPos = -2 + Math.random() * 4;
      var dur = 12 + Math.random() * 8;

      gltfLoader.load('rubberduck.glb', function(gltf) {
        var model = gltf.scene;
        model.scale.set(size, size, size);
        model.rotation.y = Math.PI;
        model.position.set(-7, yPos, 0);
        scene.add(model);
        ducks3D.push({ mesh: model, speed: 14 / dur, born: performance.now(), lifetime: dur * 1000 });
      });
    }

    setInterval(spawnGiantDuck, 12000);

    window.addEventListener('resize', function() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      var now = performance.now();
      for (var i = ducks3D.length - 1; i >= 0; i--) {
        var duck = ducks3D[i];
        var elapsed = (now - duck.born) / 1000;
        duck.mesh.position.x = -7 + duck.speed * elapsed;
        duck.mesh.rotation.z += 0.015;
        if (now - duck.born > duck.lifetime) {
          scene.remove(duck.mesh);
          ducks3D.splice(i, 1);
        }
      }
      renderer.render(scene, camera);
    }
    animate();
  } catch(e) {}

  // ========== INIT ==========
  renderPlaylist('all');

  // ========== INTRO ==========
  var introEl = document.getElementById('intro');
  var introBarFill = document.getElementById('intro-bar-fill');
  var introProgress = 0;

  function introTick() {
    if (introProgress >= 100) {
      introEl.classList.add('hidden');
      setTimeout(function() { introEl.remove(); }, 700);
      return;
    }
    introProgress += 2 + Math.random() * 5;
    if (introProgress > 100) introProgress = 100;
    introBarFill.style.width = introProgress + '%';
    setTimeout(introTick, 40 + Math.random() * 80);
  }

  setTimeout(introTick, 800);
})();
</script>

</body>
</html>
